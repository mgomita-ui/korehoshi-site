<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>これほし｜3分の体験（パソコン）</title>
<meta name="description" content="連絡をまとめ、AIが返事と段取りを準備。送信は必ず人。ログインなし・3分の操作体験。">
<meta property="og:title" content="これほし｜LINEで使う、社長のAI秘書室">
<meta property="og:description" content="連絡をまとめ、AIが返事と段取りを準備。送信は必ず人。ログインなし・3分の操作体験。">
<meta property="og:image" content="https://mgomita-ui.github.io/korehoshi-site/demo/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #F3F5F7;
  --surface: #FFFFFF;
  --ink: #142333;
  --ink2: #526170;
  --ink3: #8592A0;
  --rule: #DCE3E8;
  --rule2: #E9EEF1;
  --accent: #006D77;
  --accent-ink: #00555D;
  --accent-surface: #E8F3F3;
  --accent-line: #B9DADC;
  --due: #835433;
  --due-surface: #F4EEE8;
  --ai-bg: #FBFBFA;
  --jp: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
  --latin: "Inter", "Noto Sans JP", sans-serif;
  --shadow: 0 1px 2px rgba(20,35,51,.04), 0 12px 32px -12px rgba(20,35,51,.12);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--jp); font-size: 14px; line-height: 1.65;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; line-break: strict;
  display: flex; flex-direction: column; min-width: 1180px; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
.num, time { font-family: var(--latin); font-variant-numeric: tabular-nums; }

/* ---------- 体験版の帯 ---------- */
.demobar { height: 44px; flex: 0 0 auto; display: flex; align-items: center; gap: 18px; padding: 0 24px;
  background: var(--surface); border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--ink2); }
.demobar .tag { font-weight: 700; color: var(--ink); letter-spacing: .02em; }
.demobar .sep { width: 1px; height: 14px; background: var(--rule); }
.steps { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.steps span { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; color: var(--ink3); transition: all .3s; }
.steps span b { font-family: var(--latin); font-weight: 600; font-size: 11px; width: 18px; height: 18px; border-radius: 50%;
  display: inline-grid; place-items: center; border: 1px solid currentColor; }
.steps span.on { color: var(--accent-ink); background: var(--accent-surface); }
.steps span.on b { background: var(--accent); border-color: var(--accent); color: #fff; }
.steps span.done { color: var(--ink2); }
.steps i { width: 14px; height: 1px; background: var(--rule); }
.restart { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 13px; color: var(--ink2); }
.restart:hover { border-color: var(--ink3); color: var(--ink); }

/* ---------- 作業台 ---------- */
.stage { flex: 1; min-height: 0; padding: 20px 24px 24px; display: flex; justify-content: center; }
.window { width: 100%; max-width: 1640px; height: 100%; display: grid; grid-template-columns: minmax(400px, 39%) 1fr;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }

/* ---------- 左：AIアシスタント ---------- */
.ai { display: flex; flex-direction: column; min-height: 0; background: var(--ai-bg); border-right: 1px solid var(--rule); }
.ai-head { flex: 0 0 auto; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 22px; border-bottom: 1px solid var(--rule2); }
.ai-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: #fff; display: grid; place-items: center; }
.ai-mark svg { width: 15px; height: 15px; }
.ai-head .t { font-weight: 700; font-size: 14px; }
.ai-head > div:nth-child(2) { min-width: 0; }
.ai-head .s { font-size: 12px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ai-head .live { margin-left: auto; font-size: 12px; color: var(--ink3); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.ai-head .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #3BA776; }
.log { flex: 1; min-height: 0; overflow-y: auto; padding: 26px 26px 12px; }
.log::-webkit-scrollbar { width: 8px; } .log::-webkit-scrollbar-thumb { background: #D9DFE4; border-radius: 8px; }
.msg { margin-bottom: 22px; animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg.me { display: flex; justify-content: flex-end; }
.msg.me .bubble { max-width: 82%; background: #EDF0F2; border-radius: 16px 16px 4px 16px; padding: 9px 14px; font-size: 14.5px; }
.msg.bot { display: grid; grid-template-columns: 26px 1fr; gap: 12px; }
.msg.bot .av { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: #fff; display: grid; place-items: center; margin-top: 1px; }
.msg.bot .av svg { width: 13px; height: 13px; }
.msg.bot .body { min-width: 0; font-size: 14.5px; line-height: 1.75; }
.body p { margin: 0 0 10px; }
.body p:last-child { margin-bottom: 0; }
.body .lbl { font-size: 12px; font-weight: 700; color: var(--ink2); margin: 16px 0 6px; letter-spacing: .02em; }
.body .lbl:first-child { margin-top: 0; }
.body ol, .body ul { margin: 0 0 10px; padding-left: 0; list-style: none; counter-reset: n; }
.body ol li, .body ul li { position: relative; padding-left: 24px; margin: 5px 0; }
.body ol li::before { counter-increment: n; content: counter(n); position: absolute; left: 0; top: 3px; width: 17px; height: 17px; border-radius: 50%;
  background: var(--rule2); color: var(--ink2); font: 600 11px/17px var(--latin); text-align: center; }
.body ul li::before { content: ""; position: absolute; left: 7px; top: 11px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink3); }
.body .due { color: var(--due); font-weight: 500; }
.body .who { font-weight: 700; }
.body .muted { color: var(--ink2); font-size: 13.5px; }
.draft { border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; margin: 8px 0 12px; overflow: hidden; }
.draft .dh { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 9px 14px; border-bottom: 1px solid var(--rule2); font-size: 12.5px; color: var(--ink2); background: #FAFBFC; }
.draft .dh b { color: var(--ink); font-weight: 500; }
.draft .db { padding: 12px 14px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
.mention { display: inline-block; color: var(--accent-ink); background: var(--accent-surface); border-radius: 5px; padding: 0 6px; font-size: .94em; margin-right: 2px; }
.tools { margin: 0 0 12px; display: grid; gap: 6px; }
.tool { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--ink2); }
.tool .ic { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; }
.tool.run .ic { border: 1.5px solid var(--rule); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.tool.ok .ic { background: var(--accent-surface); color: var(--accent); }
.tool.ok .ic svg { width: 10px; height: 10px; }
.tool .tn { font-family: var(--latin); font-size: 11.5px; color: var(--ink3); background: var(--rule2); border-radius: 4px; padding: 0 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.caret::after { content: ""; display: inline-block; width: 7px; height: 15px; margin-left: 2px; background: var(--accent); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.handoff { margin-top: 12px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--accent-surface); color: var(--accent-ink); font-size: 13px; }
.handoff svg { width: 16px; height: 16px; flex: 0 0 auto; }
.note-sys { text-align: center; font-size: 12px; color: var(--ink3); margin: 4px 0 22px; display: flex; align-items: center; gap: 10px; }
.note-sys::before, .note-sys::after { content: ""; flex: 1; height: 1px; background: var(--rule2); }

.composer { flex: 0 0 auto; padding: 12px 22px 20px; border-top: 1px solid var(--rule2); background: var(--ai-bg); }
.hint { font-size: 12px; color: var(--ink3); margin: 0 2px 8px; min-height: 18px; display: flex; align-items: center; gap: 6px; }
.hint .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-in-out infinite; flex: 0 0 auto; }
@keyframes pulse { 50% { opacity: .3; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; min-height: 36px; }
.chip { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; color: var(--ink);
  transition: border-color .15s, background .15s; animation: rise .3s ease both; }
.chip:hover { border-color: var(--accent); color: var(--accent-ink); }
.chip.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
.chip.primary:hover { background: var(--accent-ink); color: #fff; }
.box { display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--rule); background: var(--surface); border-radius: 14px; padding: 8px 8px 8px 14px; }
.box:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px rgba(0,109,119,.08); }
.box textarea { flex: 1; border: 0; outline: 0; resize: none; font: inherit; font-size: 14.5px; line-height: 1.6; height: 24px; max-height: 96px; padding: 3px 0; background: transparent; color: var(--ink); overflow: hidden; }
.box textarea::placeholder { color: var(--ink3); }
.send-btn { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--ink); color: #fff; display: grid; place-items: center; flex: 0 0 auto; }
.send-btn svg { width: 15px; height: 15px; }

/* ---------- 右：これほし（受信箱） ---------- */
.kh { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.kh-top { flex: 0 0 auto; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--rule); }
.brand { font-weight: 700; font-size: 16px; letter-spacing: .04em; white-space: nowrap; }
.brand small { font-weight: 400; font-size: 11.5px; color: var(--ink3); letter-spacing: 0; margin-left: 8px; }
.nav { display: flex; gap: 2px; }
.nav span { padding: 6px 11px; border-radius: 7px; font-size: 13px; color: var(--ink2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.nav span.on { background: var(--bg); color: var(--ink); font-weight: 500; }
.nav .c { font: 600 11px/16px var(--latin); font-style: normal; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--rule2); color: var(--ink2); text-align: center; transition: all .3s; }
.nav .c.bump { background: var(--accent); color: #fff; transform: scale(1.15); }
.kh-top .date { margin-left: auto; font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.kh-top .me { width: 28px; height: 28px; border-radius: 50%; background: var(--rule2); display: grid; place-items: center; font-size: 12px; color: var(--ink2); flex: 0 0 auto; }
.kh-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 296px 1fr; }

.list { border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; background: #FCFCFD; }
.ltabs { display: flex; gap: 14px; padding: 12px 16px 0; border-bottom: 1px solid var(--rule2); font-size: 13px; color: var(--ink2); }
.ltabs span { padding-bottom: 9px; display: flex; gap: 5px; align-items: center; }
.ltabs span.on { color: var(--ink); font-weight: 500; box-shadow: inset 0 -2px 0 var(--ink); }
.ltabs .c { font: 600 11px/1 var(--latin); font-style: normal; color: var(--ink3); }
.ltabs span.on .c { color: var(--accent); }
.morning { margin: 12px 12px 4px; border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; }
.morning .mh { display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 13px; }
.morning .mh .c { margin-left: auto; font: 500 11.5px var(--latin); color: var(--ink3); }
.morning .mi { display: flex; gap: 8px; margin-top: 6px; color: var(--ink2); }
.morning .mi .k { flex: 0 0 auto; align-self: flex-start; font-size: 11px; border-radius: 4px; padding: 0 6px; line-height: 18px; margin-top: 1px; }
.morning .mi .k.due { background: var(--due-surface); color: var(--due); }
.morning .mi .k.ev { background: var(--rule2); color: var(--ink2); font-family: var(--latin); }
.rows { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 8px 12px; }
.row { position: relative; display: block; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 10px 12px 10px 14px; margin-bottom: 2px; transition: background .2s, border-color .2s, opacity .4s, transform .4s; }
.row:hover { background: var(--bg); }
.row.on { background: var(--surface); border-color: var(--rule); box-shadow: 0 1px 2px rgba(20,35,51,.05); }
.row.on::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--accent); }
.row.flash { animation: flash 1.4s ease; }
@keyframes flash { 0%, 100% { background: transparent; } 30% { background: var(--accent-surface); } }
.row .r1 { display: flex; align-items: center; gap: 8px; }
.row .ch { font-size: 10.5px; color: var(--ink2); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; line-height: 16px; }
.row .tm { margin-left: auto; font: 500 11.5px var(--latin); color: var(--ink3); }
.row .nm { font-weight: 700; font-size: 14px; margin-top: 3px; }
.row .pv { font-size: 12.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.row .st { display: flex; gap: 8px; align-items: center; margin-top: 5px; font-size: 11.5px; color: var(--ink2); }
.row .st .u { display: inline-flex; align-items: center; gap: 5px; }
.row .st .u::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.row .st .d { color: var(--accent-ink); background: var(--accent-surface); border-radius: 4px; padding: 0 6px; }
.row .st .ok { color: var(--ink3); }
.row.gone { opacity: 0; transform: translateX(-12px); }
.auto { margin: 6px 8px 0; font-size: 12px; color: var(--ink3); padding: 8px 10px 10px; border-top: 1px solid var(--rule2); }

.thread { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--ink3); font-size: 13px; padding: 40px; line-height: 1.8; }
.empty .big { font-size: 15px; color: var(--ink2); margin-bottom: 6px; }
.th-head { flex: 0 0 auto; padding: 14px 22px 12px; border-bottom: 1px solid var(--rule2); }
.th-head .r1 { display: flex; align-items: center; gap: 10px; }
.th-head .nm { font-size: 16px; font-weight: 700; }
.th-head .ch { font-size: 11px; color: var(--ink2); border: 1px solid var(--rule); border-radius: 4px; padding: 0 6px; line-height: 18px; }
.th-head .stt { margin-left: auto; font-size: 12px; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
.th-head .stt.open::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.th-head .stt.done { color: var(--ink3); }
.th-head .mem { font-size: 12px; color: var(--ink3); margin-top: 2px; }
.points { flex: 0 0 auto; margin: 12px 22px 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; padding: 10px 14px; background: #FAFBFC; border: 1px solid var(--rule2); border-radius: 10px; }
.points dt { color: var(--ink3); font-size: 12px; padding-top: 1px; }
.points dd { margin: 0; color: var(--ink); }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 22px 18px; }
.day { text-align: center; font: 500 11.5px var(--latin); color: var(--ink3); margin: 8px 0 12px; }
.m { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 12px; max-width: 80%; animation: rise .35s ease both; }
.m .sp { font-size: 11.5px; color: var(--ink2); margin: 0 0 3px 2px; }
.m .bb { background: var(--bg); border-radius: 4px 14px 14px 14px; padding: 9px 13px; font-size: 13.5px; line-height: 1.75; white-space: pre-wrap; }
.m .tt { font: 400 11px var(--latin); color: var(--ink3); margin: 3px 2px 0; }
.m.out { margin-left: auto; align-items: flex-end; }
.m.out .bb { background: var(--accent-surface); border-radius: 14px 4px 14px 14px; }
.m .file { display: flex; align-items: center; gap: 10px; margin-top: 6px; border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.fi { width: 26px; height: 32px; border-radius: 4px; background: #F1E9E6; color: #A1453A; display: grid; place-items: center; font: 700 8.5px var(--latin); flex: 0 0 auto; }
.m.sent-now .bb { box-shadow: 0 0 0 2px var(--accent-line); }
.subj { font-size: 12px; color: var(--ink2); margin-bottom: 4px; }
.reply-off { flex: 0 0 auto; margin: 0 22px 16px; border: 1px dashed var(--rule); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; color: var(--ink3); }

/* 送る前の下書き（本物の「送信セット」の緑枠にあたる） */
.pset { flex: 0 0 auto; margin: 0 22px 16px; border: 2px solid var(--accent); border-radius: 12px; background: var(--surface); padding: 12px 14px; animation: rise .4s ease both; }
.pset .ph { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--accent-ink); font-weight: 500; }
.pset .ph .by { color: var(--ink3); font-weight: 400; }
.pset .ph button { margin-left: auto; border: 1px solid var(--accent); background: var(--surface); color: var(--accent-ink); border-radius: 7px; padding: 4px 12px; font-size: 12.5px; }
.pset .pv { margin-top: 6px; font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 全画面で確かめる */
.full { position: absolute; inset: 0; background: rgba(243,245,247,.78); backdrop-filter: blur(2px); display: flex; align-items: stretch; justify-content: center; padding: 18px; z-index: 5; animation: fade .25s ease both; }
@keyframes fade { from { opacity: 0; } }
.fcard { width: 100%; max-width: 880px; background: var(--surface); border: 2px solid var(--accent); border-radius: 14px; box-shadow: 0 24px 60px -20px rgba(20,35,51,.28); display: flex; flex-direction: column; min-height: 0; animation: rise .3s ease both; }
.fh { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--rule2); }
.fh .tt { font-weight: 700; font-size: 15px; }
.fh .by { font-size: 12px; color: var(--ink3); }
.fh .ver { font: 500 11px var(--latin); color: var(--accent-ink); background: var(--accent-surface); border-radius: 4px; padding: 1px 6px; }
.fh .x { margin-left: auto; border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 4px 12px; font-size: 12.5px; color: var(--ink2); }
.fto { flex: 0 0 auto; margin: 0; padding: 14px 20px; display: grid; grid-template-columns: 76px 1fr; gap: 6px 14px; border-bottom: 1px solid var(--rule2); font-size: 13.5px; }
.fto dt { color: var(--ink3); font-size: 12.5px; padding-top: 2px; }
.fto dd { margin: 0; }
.fto .dest { font-size: 17px; font-weight: 700; }
.fto .kind { font-size: 12.5px; color: var(--ink2); margin-left: 8px; font-weight: 400; }
.fto .warn { color: var(--due); font-size: 12.5px; }
.fitems { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px; }
.fitem { display: grid; grid-template-columns: 26px 1fr; gap: 12px; margin-bottom: 14px; }
.fitem .no { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--rule); display: grid; place-items: center; font: 600 11.5px var(--latin); color: var(--ink2); margin-top: 2px; transition: all .3s; }
.fitem .k { font-size: 12px; color: var(--ink3); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.fitem .k .s { font-size: 11.5px; border-radius: 4px; padding: 0 6px; background: var(--rule2); color: var(--ink2); transition: all .3s; }
.fitem .k .s.sending { background: var(--accent-surface); color: var(--accent-ink); }
.fitem .k .s.sent { background: var(--accent); color: #fff; }
.fitem.done .no { background: var(--accent); border-color: var(--accent); color: #fff; }
.ftext { border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; font-size: 15px; line-height: 1.9; white-space: pre-wrap; background: #FFFFFF; }
.ffile { display: flex; align-items: center; gap: 12px; border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; }
.ffile .fi { width: 30px; height: 38px; font-size: 9.5px; }
.ffile .fm { font-size: 12px; color: var(--ink3); }
.fimg { margin: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: #fff; }
.fimg img { display: block; width: 100%; max-height: 380px; object-fit: contain; background: #fff; }
.fimg figcaption { font-size: 12px; color: var(--ink3); padding: 8px 12px; border-top: 1px solid var(--rule2); }
.dimg { padding: 0 14px 12px; } .dimg img { display: block; width: 100%; border: 1px solid var(--rule2); border-radius: 8px; }
.mimg { display: block; width: 280px; margin-top: 6px; border: 1px solid var(--rule); border-radius: 10px; }
.ff { flex: 0 0 auto; padding: 14px 20px 18px; border-top: 1px solid var(--rule2); display: flex; align-items: center; gap: 14px; }
.ff .why { font-size: 12.5px; color: var(--ink2); }
.ff .drop { margin-left: auto; border: 0; background: transparent; color: var(--ink3); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; }
.go { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 500; position: relative; transition: background .2s; }
.go:hover { background: var(--accent-ink); }
.go.ring::after { content: ""; position: absolute; inset: -5px; border-radius: 14px; border: 2px solid var(--accent); opacity: .5; animation: ring 1.8s ease-out infinite; pointer-events: none; }
@keyframes ring { 0% { transform: scale(.96); opacity: .6; } 100% { transform: scale(1.06); opacity: 0; } }
.go:disabled { background: var(--rule); color: var(--ink3); cursor: default; }
.go:disabled::after { display: none; }

/* 送る前の確かめ */
.confirm { position: absolute; inset: 0; background: rgba(20,35,51,.28); display: grid; place-items: center; z-index: 8; animation: fade .2s ease both; }
.cbox { width: 440px; background: var(--surface); border-radius: 14px; box-shadow: 0 30px 70px -20px rgba(20,35,51,.4); padding: 22px 24px 18px; animation: rise .25s ease both; }
.cbox h3 { margin: 0 0 12px; font-size: 16px; }
.cbox dl { margin: 0 0 14px; display: grid; grid-template-columns: 80px 1fr; gap: 6px 12px; font-size: 13.5px; }
.cbox dt { color: var(--ink3); font-size: 12.5px; padding-top: 1px; }
.cbox dd { margin: 0; }
.cbox .note { font-size: 12.5px; color: var(--ink2); background: var(--bg); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
.cbox .acts { display: flex; justify-content: flex-end; gap: 10px; }
.cbox .no { border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 10px 18px; }

/* 送ったあと */
.after { flex: 0 0 auto; margin: 0 22px 16px; border-radius: 12px; background: var(--accent-surface); padding: 14px 16px; animation: rise .4s ease both; }
.after .a1 { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--accent-ink); }
.after .a1 svg { width: 16px; height: 16px; flex: 0 0 auto; }
.after .a2 { font-size: 13px; color: var(--ink2); margin-top: 4px; }
.after .task { margin-top: 10px; display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.after .task .k { font-size: 11px; border-radius: 4px; padding: 0 6px; background: var(--due-surface); color: var(--due); flex: 0 0 auto; }
.after .task .k.hold { background: var(--rule2); color: var(--ink2); }

/* 日程を入れるか聞く */
.calask { flex: 0 0 auto; margin: 0 22px 16px; border: 2px solid var(--accent); border-radius: 12px; background: var(--surface); padding: 14px 16px; animation: rise .4s ease both; }
.calask .q { font-size: 12.5px; color: var(--ink2); }
.calask .ev { font-size: 15px; font-weight: 700; margin: 4px 0 2px; }
.calask .ev2 { font-size: 12.5px; color: var(--ink2); }
.calask .acts { display: flex; gap: 10px; margin-top: 12px; }
.calask .no2 { border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 10px 16px; }

.toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 10px; padding: 10px 16px; font-size: 13px; z-index: 9; animation: rise .3s ease both; white-space: nowrap; }

/* 右の上の切り替え・ページ */
.nav button { border: 0; background: transparent; padding: 6px 9px; border-radius: 7px; font-size: 13px; color: var(--ink2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.nav button:hover { background: var(--bg); }
.nav button.on { background: var(--bg); color: var(--ink); font-weight: 500; }
.nav button.feat { border: 1px solid var(--rule); margin-left: 4px; }
.ltabs button { border: 0; background: transparent; padding: 0 0 9px; font-size: 13px; color: var(--ink2); display: flex; gap: 5px; align-items: center; }
.ltabs button.on { color: var(--ink); font-weight: 500; box-shadow: inset 0 -2px 0 var(--ink); }
.ltabs .c { font: 600 11px/1 var(--latin); font-style: normal; color: var(--ink3); }
.ltabs button.on .c { color: var(--accent); }
button.auto { display: block; width: calc(100% - 16px); text-align: left; border: 0; border-top: 1px solid var(--rule2); background: transparent; cursor: pointer; }
button.auto:hover { color: var(--ink2); }
button.auto b { color: var(--accent-ink); font-weight: 500; }
.autobox { margin: 6px 8px 0; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); padding: 10px 12px; font-size: 12.5px; animation: rise .25s ease both; }
.autobox .aitem { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--rule2); }
.autobox .aitem:first-of-type { border-top: 0; }
.autobox .aitem div { flex: 1; color: var(--ink2); }
.autobox .aitem b { color: var(--ink); font-weight: 500; display: block; }
.autobox button { border: 1px solid var(--rule); background: var(--surface); border-radius: 7px; padding: 2px 8px; font-size: 11.5px; color: var(--ink2); flex: 0 0 auto; }
.rowx { padding: 10px 12px 10px 14px; border-radius: 10px; margin-bottom: 2px; }
.rowx .nm { font-weight: 700; font-size: 14px; }
.rowx .pv { font-size: 12.5px; color: var(--ink2); }
.rowx .st { font-size: 11.5px; color: var(--ink3); margin-top: 3px; }
.page { position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: var(--surface); z-index: 4; overflow-y: auto; animation: fade .2s ease both; }
.page[hidden] { display: none; }
.pg { max-width: 860px; margin: 0 auto; padding: 22px 28px 40px; }
.pg h2 { font-size: 19px; margin: 0 0 4px; }
.pg .lead { color: var(--ink2); font-size: 13.5px; margin: 0 0 18px; }
.pg h3 { font-size: 13px; color: var(--ink2); margin: 22px 0 8px; font-weight: 700; letter-spacing: .02em; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; margin-bottom: 14px; }
.seg button { border: 0; background: var(--surface); padding: 6px 14px; font-size: 13px; color: var(--ink2); }
.seg button.on { background: var(--ink); color: #fff; }
.tk { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 12px; margin-bottom: 8px; animation: rise .3s ease both; }
.tk .due { font-size: 11.5px; border-radius: 5px; padding: 1px 7px; background: var(--rule2); color: var(--ink2); white-space: nowrap; margin-top: 2px; }
.tk .due.hot { background: var(--due-surface); color: var(--due); }
.tk .t { font-size: 14.5px; font-weight: 500; }
.tk .w { font-size: 12.5px; color: var(--ink2); grid-column: 2; }
.tk .chk { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; color: var(--ink2); grid-row: 1 / span 2; grid-column: 3; align-self: center; }
.tk .chk:hover { border-color: var(--accent); color: var(--accent-ink); }
.tk.done { opacity: .45; }
.tk.done .t { text-decoration: line-through; }
.ask { border: 2px solid var(--accent); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; animation: rise .3s ease both; }
.ask .q { font-size: 12px; color: var(--accent-ink); font-weight: 500; }
.ask .t { font-size: 14.5px; font-weight: 500; margin: 3px 0; }
.ask .w { font-size: 12.5px; color: var(--ink2); }
.ask .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.ask .acts button { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 6px 14px; font-size: 13px; }
.ask .acts button.y { background: var(--accent); border-color: var(--accent); color: #fff; }
.ask .why { display: none; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.ask .why.on { display: flex; }
.ask .why button { border: 1px solid var(--rule); background: var(--bg); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; }
.fsec { border: 1px solid var(--rule); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
.fsec > .fh2 { padding: 12px 16px; background: #FAFBFC; border-bottom: 1px solid var(--rule2); font-weight: 700; font-size: 14px; display: flex; align-items: baseline; gap: 10px; }
.fsec > .fh2 small { font-weight: 400; color: var(--ink3); font-size: 12px; }
.fr2 { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 12px 16px; border-top: 1px solid var(--rule2); align-items: center; }
.fr2:first-of-type { border-top: 0; }
.fr2 .n { font-size: 14px; font-weight: 500; }
.fr2 .d { font-size: 12.5px; color: var(--ink2); grid-column: 1; }
.fr2 .ctl { grid-row: 1 / span 2; grid-column: 2; }
.sw { position: relative; width: 42px; height: 24px; border-radius: 999px; border: 0; background: var(--rule); transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .2s; }
.sw.on { background: var(--accent); }
.sw.on::after { transform: translateX(18px); }
.sw.lock { background: var(--accent); opacity: .55; cursor: not-allowed; }
.sel { border: 1px solid var(--rule); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 12.5px; background: var(--surface); color: var(--ink); }
.lv { font-size: 11.5px; border-radius: 5px; padding: 1px 7px; margin-left: 8px; font-weight: 500; }
.lv.auto { background: var(--accent-surface); color: var(--accent-ink); }
.lv.conf { background: var(--due-surface); color: var(--due); }
.meter { display: inline-block; width: 70px; height: 5px; border-radius: 3px; background: var(--rule2); vertical-align: middle; margin-left: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.dg { border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; font-size: 14px; line-height: 1.85; }
.dg b { font-weight: 500; }
.dg .n { font: 600 22px var(--latin); color: var(--accent); margin-right: 4px; }
.dgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.dgrid div { border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; font-size: 12.5px; color: var(--ink2); }
.dgrid b { display: block; font: 600 24px var(--latin); color: var(--ink); }
.np { border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.np label { display: flex; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--rule2); cursor: pointer; align-items: flex-start; }
.np label:first-child { border-top: 0; }
.np input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
.np .t { font-size: 14px; font-weight: 500; }
.np .w { font-size: 12.5px; color: var(--ink2); }
.pgacts { display: flex; gap: 10px; margin-top: 14px; }
.pgacts .no2 { border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 10px 16px; }
.learn { border: 1px solid var(--accent-line); background: var(--accent-surface); border-radius: 10px; padding: 10px 12px; margin: 8px 0 10px; font-size: 13.5px; }
.learn .bf { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin-top: 6px; font-size: 13px; }
.learn .bf dt { color: var(--ink3); }
.learn .bf dd { margin: 0; }
.learn del { color: #A03D32; text-decoration-color: #A03D32; }
.learn ins { color: var(--accent-ink); text-decoration: none; font-weight: 500; }
.ftext[contenteditable="true"] { outline: 0; cursor: text; }
.ftext[contenteditable="true"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,109,119,.08); }
.edit-note { font-size: 12px; color: var(--accent-ink); margin: 6px 2px 0; }
.ftext .mention { user-select: none; }
.tour { position: relative; margin-left: 10px; }
.tour > button { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 12px; color: var(--ink2); white-space: nowrap; }
.tour > button b { font-family: var(--latin); color: var(--accent); }
.tourbox { position: absolute; top: 34px; right: 0; width: 300px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; z-index: 30; animation: rise .2s ease both; }
.tourbox .h { font-size: 12.5px; color: var(--ink2); margin-bottom: 6px; }
.tourbox button.it { display: flex; width: 100%; gap: 8px; align-items: center; text-align: left; border: 0; background: transparent; padding: 6px 4px; border-radius: 8px; font-size: 13.5px; }
.tourbox button.it:hover { background: var(--bg); }
.tourbox .ck { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--rule); flex: 0 0 auto; display: grid; place-items: center; }
.tourbox .ok .ck { background: var(--accent); border-color: var(--accent); color: #fff; }
.tourbox .ok .ck svg { width: 10px; height: 10px; }
.tourbox .ok span:last-child { color: var(--ink3); }

/* 締め */
.closing { position: fixed; inset: 0; background: rgba(20,35,51,.42); display: grid; place-items: center; z-index: 20; animation: fade .4s ease both; }
.cl { width: 560px; background: var(--surface); border-radius: 18px; padding: 40px 44px 32px; box-shadow: 0 40px 90px -30px rgba(20,35,51,.5); animation: rise .5s ease both; }
.cl .k { font-size: 12px; color: var(--accent-ink); letter-spacing: .08em; font-weight: 500; }
.cl h2 { font-size: 28px; line-height: 1.45; margin: 10px 0 14px; letter-spacing: -.01em; }
.cl p { color: var(--ink2); margin: 0 0 8px; font-size: 14.5px; line-height: 1.85; }
.cl .facts { margin: 18px 0 24px; display: grid; gap: 8px; padding: 14px 16px; background: var(--bg); border-radius: 12px; }
.cl .facts div { display: flex; gap: 12px; font-size: 13.5px; align-items: baseline; }
.cl .facts .n { font: 600 15px var(--latin); color: var(--accent); width: 22px; text-align: right; }
.cl .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.cl a.go { text-decoration: none; display: inline-block; }
.cl .sub { border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 12px 18px; font-size: 14px; text-decoration: none; color: var(--ink); }
.cl .stay { display: block; margin-top: 16px; border: 0; background: none; color: var(--ink3); font-size: 12.5px; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

/* 狭い画面 */
.narrow { display: none; }
@media (max-width: 1099px) {
  .narrow { display: flex; position: fixed; inset: 0; z-index: 50; background: var(--bg); align-items: center; justify-content: center; padding: 24px; }
  .narrow .nb { max-width: 400px; background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 28px 24px; }
  .narrow h2 { font-size: 20px; margin: 0 0 8px; }
  .narrow p { color: var(--ink2); margin: 0 0 18px; }
  .narrow a.go { display: block; text-align: center; text-decoration: none; }
  .narrow button { margin-top: 12px; width: 100%; border: 0; background: none; color: var(--ink3); text-decoration: underline; font-size: 13px; }
  .narrow.off { display: none; }
  body.stay { overflow: auto; }
}

/* ================= v3：3列（体験メニュー｜AI｜受信箱） ================= */
.window { grid-template-columns: 236px minmax(360px, 34%) 1fr; }
.menu { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--rule); background: #FCFCFD; }
.menu .mh { padding: 16px 16px 6px; }
.menu .mh .k { font-size: 11.5px; color: var(--accent-ink); letter-spacing: .06em; font-weight: 500; }
.menu .mh b { display: block; font-size: 15px; margin-top: 2px; }
.mlist { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 8px; }
.mi { display: grid; grid-template-columns: 22px 1fr; gap: 2px 10px; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 9px 10px; margin-bottom: 2px; }
.mi:hover { background: var(--bg); }
.mi.on { background: var(--surface); border-color: var(--accent); box-shadow: 0 1px 2px rgba(20,35,51,.05); }
.mi .ck { grid-row: 1 / span 2; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--rule); display: grid; place-items: center; font: 600 10.5px var(--latin); color: var(--ink3); margin-top: 1px; }
.mi.done .ck { background: var(--accent); border-color: var(--accent); color: #fff; }
.mi.done .ck svg { width: 10px; height: 10px; }
.mi .t { font-size: 13.5px; font-weight: 500; line-height: 1.45; }
.mi .s { font-size: 11.5px; color: var(--ink3); line-height: 1.5; }
.mi .tag { display: inline-block; font-size: 10.5px; border-radius: 4px; padding: 0 5px; margin-left: 4px; vertical-align: 1px; background: var(--accent); color: #fff; font-weight: 500; }
.mi .tag.you { background: var(--due-surface); color: var(--due); }
.mfoot { border-top: 1px solid var(--rule2); padding: 10px 12px 14px; display: grid; gap: 6px; }
.mfoot button, .mfoot a { display: block; text-align: center; border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 8px; font-size: 13px; color: var(--ink); text-decoration: none; }
.mfoot .cta { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
.mfoot .pv { font-size: 10.5px; color: var(--ink3); line-height: 1.5; text-align: left; }
.ai-head .s { max-width: 260px; }
/* 光らせて「ここを押す」 */
.spot { position: relative; z-index: 3; box-shadow: 0 0 0 3px rgba(0,109,119,.35), 0 0 0 7px rgba(0,109,119,.12) !important; animation: spot 1.6s ease-in-out infinite; }
@keyframes spot { 50% { box-shadow: 0 0 0 3px rgba(0,109,119,.55), 0 0 0 10px rgba(0,109,119,.06); } }
.guide { flex: 0 0 auto; margin: 0 22px 10px; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--accent-surface); color: var(--accent-ink); font-size: 13px; }
.guide:empty { display: none; }
.guide::before { content: "→"; font-weight: 700; }
/* 会話の中の動き */
.hist { flex: 0 0 auto; margin: 10px 22px 0; border-left: 3px solid var(--accent); background: #F7FAFA; border-radius: 0 10px 10px 0; padding: 8px 12px; font-size: 12.5px; color: var(--ink2); }
.hist b { color: var(--accent-ink); font-weight: 500; display: block; font-size: 11.5px; }
.actbar { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; margin: 0 22px 14px; }
.actbar button { border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-size: 14px; }
.actbar button.p { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
.actbar .note { font-size: 12px; color: var(--ink3); align-self: center; }
.m.note { max-width: 100%; align-items: center; margin: 4px 0 12px; }
.m.note .bb { background: transparent; border: 1px dashed var(--rule); border-radius: 999px; padding: 3px 12px; font-size: 12px; color: var(--ink2); }
.m.ai .sp { color: var(--accent-ink); }
.m.ai .bb { background: #F2F7F7; border: 1px solid var(--accent-line); }
.steps4 { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 2px; }
.steps4 span { font-size: 11.5px; border-radius: 999px; padding: 1px 9px; background: var(--rule2); color: var(--ink3); }
.steps4 span.on { background: var(--accent); color: #fff; }
.steps4 span.ok { background: var(--accent-surface); color: var(--accent-ink); }
/* 書類 */
.doc { background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; font-size: 12.5px; line-height: 1.6; width: 100%; max-width: 520px; }
.doc.sm { font-size: 11.5px; padding: 10px 12px; }
.doc-h { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 4px; margin-bottom: 6px; }
.doc-h b { font-size: 15px; letter-spacing: .2em; }
.doc-h span { font: 11px var(--latin); color: var(--ink2); }
.doc-to { font-size: 13.5px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.doc-s { color: var(--ink2); margin: 2px 0 6px; }
.doc-t { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.doc-t th, .doc-t td { border-bottom: 1px solid var(--rule2); padding: 4px 6px; text-align: right; }
.doc-t th:first-child, .doc-t td:first-child { text-align: left; }
.doc-t th { background: #FAFBFC; font-weight: 500; }
.doc-sum { display: flex; justify-content: flex-end; gap: 14px; margin-top: 6px; font-family: var(--latin); }

async function typeHtml(el, html, g) {
  el.innerHTML = html;
  var nodes = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  while (w.nextNode()) nodes.push(w.currentNode);
  var full = nodes.map(function (n) { return n.nodeValue; });
  nodes.forEach(function (n) { n.nodeValue = ""; });
  var blocks = Array.prototype.slice.call(el.children);
  blocks.forEach(function (b) { b.style.visibility = "hidden"; });
  el.classList.add("caret");
  for (var i = 0; i < nodes.length; i++) {
    var p = nodes[i].parentElement; while (p && p.parentElement !== el) p = p.parentElement;
    if (p) p.style.visibility = "";
    var s = full[i], k = 0;
    while (k < s.length) {
      if (g !== G) throw "abort";
      k = Math.min(s.length, k + (speed > 1 ? 80 : 4));
      nodes[i].nodeValue = s.slice(0, k); scrollLog();
      await wait(14);
    }
  }
  blocks.forEach(function (b) { b.style.visibility = ""; });
  el.classList.remove("caret"); scrollLog();
}

    else if (a === "sendyes") { var c2 = $(".confirm"); if (c2) c2.remove(); doSend(id); }
    else if (a === "calyes") calYes();
    else if (a === "calno") { S.cal = null; renderThread(); toast("カレンダーには入れませんでした"); }
    else if (a === "dept") actDept(id);
    else if (a === "deptgo") deptGo(id);
    else if (a === "swapai") swapAI();
    else if (a === "hox") { var h = $(".ho"); if (h) h.remove(); }
    else if (a === "share") share();
    else if (a === "stay") $("#closingHost").innerHTML = "";
    return;
  }
  var cta = ev.target.closest("[data-cta]"); if (cta) dlog("cta", { k: cta.getAttribute("data-cta") });
}, false);
$("#rows").addEventListener("click", function (ev) { var b = ev.target.closest(".row"); if (b) openThread(b.getAttribute("data-id")); });
$("#nav").addEventListener("click", function (ev) { var b = ev.target.closest("[data-view]"); if (b) showView(b.getAttribute("data-view")); });
$("#ltabs").addEventListener("click", function (ev) { var b = ev.target.closest("[data-tab]"); if (b) { S.tab = b.getAttribute("data-tab"); renderRows(); } });
$("#autoBtn").addEventListener("click", function () { S.autoOpen = !S.autoOpen; renderAuto(); });
$("#autobox").addEventListener("click", function (ev) { var b = ev.target.closest("[data-uq]"); if (!b) return; S.unquiet[+b.getAttribute("data-uq")] = true; S.demoted = true; mark("trust"); toast("要対応に戻しました。この「外す」判断は外れだったと覚えます"); renderRows(); });
$("#mlist").addEventListener("click", function (ev) { var b = ev.target.closest("[data-tut]"); if (b) startTut(b.getAttribute("data-tut")); });
$("#wzBtn").onclick = function () { openWizard(null); };
$("#page").addEventListener("click", function (ev) {
  var b = ev.target.closest("button,input"); if (!b) return;
  if (b.hasAttribute("data-sw")) { var k = b.getAttribute("data-sw"); S.feat[k] = S.feat[k] === false; b.classList.toggle("on", S.feat[k] !== false); toast(S.feat[k] !== false ? "入れました" : "切りました（今あるものは消しません）"); }
  else if (b.hasAttribute("data-lock")) toast("ここは切れません。送るのは、いつも人です");
  else if (b.hasAttribute("data-seat")) toast("例：営業／経理／法務／総務／情報システム。会話の見出しの［→ 部署］で渡します");
  else if (b.hasAttribute("data-done")) { var t = S.tasks.filter(function (x) { return x.id === b.getAttribute("data-done"); })[0]; if (t) { t.done = true; toast("済みにしました"); showView(S.view); renderRows(); } }
  else if (b.hasAttribute("data-nudge")) toast("確認日を過ぎたものを1通にまとめた、やわらかい催促の下書きを作ります（送るのはあなた）");
  else if (b.hasAttribute("data-ay")) { var q = S.asks.filter(function (x) { return x.id === b.getAttribute("data-ay"); })[0]; q.state = "yes"; S.tasks.push({ id: "k" + q.id, side: q.side, t: q.t, due: "確認日 10/7", who: "なごみ食品", why: "AIの問いに［追加する］と答えました" }); toast("追加しました。AIの判断が合っていたと覚えます"); mark("ask"); showView("mine"); renderRows(); }
  else if (b.hasAttribute("data-an")) { $("#why-" + b.getAttribute("data-an")).classList.add("on"); }
  else if (b.hasAttribute("data-wa")) { var q2 = S.asks.filter(function (x) { return x.id === b.getAttribute("data-wa"); })[0]; q2.state = "no"; toast("「" + b.getAttribute("data-w") + "」と覚えました。似たものは足しにくくなります"); mark("ask"); showView("mine"); }
  else if (b.hasAttribute("data-nightgo")) { S.nightPick = {}; document.querySelectorAll("[data-np]").forEach(function (c) { S.nightPick[+c.getAttribute("data-np")] = c.checked; }); S.nightDone = true; showView("night"); addSys("前夜21時に頼んだ準備 → 今朝6時（体験の早送り）"); }
});
$("#restart").onclick = function () { start(); };
$("#narrowStay").onclick = function () { $("#narrow").classList.add("off"); document.body.classList.add("stay"); };
var input = $("#input");
input.addEventListener("input", function () { input.style.height = "24px"; input.style.height = Math.min(96, input.scrollHeight) + "px"; });
input.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#form").requestSubmit(); } });
$("#form").addEventListener("submit", function (e) {
  e.preventDefault();
  var v = input.value.trim(); if (!v) return;
  input.value = ""; input.style.height = "24px"; addMe(v);
  var t = v.replace(/\s/g, "");
  // チュートリアルの途中なら、チップと同じ扱い（光っているボタンを押す）
  var spot = document.querySelector(".spot");
  if (spot && /頼|作|送|入れ|渡|返/.test(t)) { spot.click(); return; }
  var map = [[/見積|営業|なごみ|依頼|流れ/, "flow"], [/日程|候補|カレンダー|スケジュール/, "sched"], [/経理|法務|総務|部署|渡/, "dept"], [/タスク|やること|約束/, "task"], [/朝|夜|段取り|準備/, "day"], [/任せ|自動/, "trust"], [/AI|替え|変え/, "ai"], [/返事|返信|直/, "reply"]];
  for (var i = 0; i < map.length; i++) if (map[i][0].test(t)) { startTut(map[i][1]); return; }
  bot([], "<p>体験版なので、決まった流れだけをお見せしています。左のメニューから選んでください。</p><p class=\"muted\">本物では「〇〇さんに、来週なら大丈夫と返して」のように、ふだんの言葉でそのまま頼めます。</p>").catch(function () {});
});
function start() {
  G++; WAITS = [];
  var role = WZ ? WZ.role : "ceo";
  S = fresh(role);
  $("#closingHost").innerHTML = ""; $("#overlay").innerHTML = ""; $("#log").innerHTML = "";
  document.querySelectorAll(".dlg,.ho,.wz").forEach(function (e) { e.remove(); });
  showView("inbox"); renderRows(); renderThread(); renderMenu(); setChips([]);
  $("#pv").textContent = PRIVACY;
  setTimeout(function () { startTut("flow"); }, 300);
}
dlog("open", { side: "pc" });
start();

// 確かめ用：#auto=flow,... で早送り（画面の点検に使う。ふだんは動かない）
(function () {
  var m = location.hash.match(/auto=([^&]+)/); if (!m) return;
  var st = document.createElement("style"); st.textContent = "*,*::before,*::after{animation:none!important;transition:none!important}"; document.head.appendChild(st);
  speed = 30; S.fast = true;
  var steps = decodeURIComponent(m[1]).split(",");
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  (async function () {
    await sleep(600);
    for (var i = 0; i < steps.length; i++) {
      var k = steps[i];
      if (k.indexOf("click:") === 0) { var el = document.querySelector(k.slice(6)); if (el) el.click(); await sleep(500); continue; }
      if (k.indexOf("tut:") === 0) { startTut(k.slice(4)); await sleep(800); continue; }
      if (k.indexOf("view:") === 0) { showView(k.slice(5)); continue; }
      if (k === "spot") { var sp = document.querySelector(".spot"); if (sp) sp.click(); await sleep(900); continue; }
      if (k === "wzskip") { var w = document.querySelector("[data-wskip]"); if (w) w.click(); await sleep(600); continue; }
      if (k === "wait") { await sleep(1500); continue; }
      if (k === "closing") { showClosing(); continue; }
      if (k === "ho") { openHandover(); continue; }
    }
  })();
})();
})();
