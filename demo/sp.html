<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>これほし｜体験版（スマホ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3F5F7; --surface: #FFFFFF; --ink: #142333; --ink2: #526170; --ink3: #8592A0;
  --rule: #DCE3E8; --rule2: #E9EEF1; --accent: #006D77; --accent-ink: #00555D; --accent-surface: #E8F3F3; --accent-line: #B9DADC;
  --due: #835433; --due-surface: #F4EEE8; --talk: #EEF2F4;
  --jp: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
  --latin: "Inter", "Noto Sans JP", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--jp); font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; line-break: strict; -webkit-text-size-adjust: 100%; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.num, time { font-family: var(--latin); font-variant-numeric: tabular-nums; }

/* 全体：スマホでは全面。広い画面では中央の列＋左に流れの説明 */
.page { height: 100%; display: flex; justify-content: center; gap: 56px; }
.side { display: none; }
.phone { position: relative; width: 100%; max-width: 440px; height: 100%; background: var(--surface); display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 900px) {
  .page { padding: 28px 24px; align-items: center; }
  .phone { height: min(880px, 100%); border: 1px solid var(--rule); border-radius: 22px; box-shadow: 0 1px 2px rgba(20,35,51,.04), 0 24px 60px -24px rgba(20,35,51,.22); }
  .side { display: block; width: 320px; align-self: center; }
  .side .k { font-size: 12px; color: var(--accent-ink); letter-spacing: .08em; font-weight: 500; }
  .side .nw { white-space: nowrap; }
  .side h1 { font-size: 26px; line-height: 1.45; margin: 8px 0 12px; letter-spacing: -.01em; }
  .side p { color: var(--ink2); font-size: 14.5px; margin: 0 0 22px; }
  .side ol { list-style: none; padding: 0; margin: 0 0 24px; display: grid; gap: 4px; }
  .side li { display: flex; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--ink3); font-size: 14.5px; transition: all .3s; }
  .side li b { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; border: 1px solid currentColor; display: grid; place-items: center; font: 600 11.5px var(--latin); margin-top: 1px; }
  .side li.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(20,35,51,.05); }
  .side li.on b { background: var(--accent); border-color: var(--accent); color: #fff; }
  .side li.done { color: var(--ink2); }
  .side .pc { font-size: 13.5px; color: var(--ink2); }
  .side .pc a { color: var(--accent-ink); }
}

/* 体験版の帯 */
.demobar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 14px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--surface); border-bottom: 1px solid var(--rule2); font-size: 12px; color: var(--ink2); }
.demobar b { color: var(--ink); font-weight: 700; flex: 0 0 auto; }
.demobar .dm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.demobar .lst { margin-left: auto; }
.demobar .restart { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 3px 10px; font-size: 12px; color: var(--ink2); flex: 0 0 auto; }
.apps { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--rule2); }
.apps button { border: 1px solid transparent; background: var(--bg); border-radius: 10px; padding: 6px 8px; font-size: 13px; color: var(--ink2); line-height: 1.3; }
.apps button small { display: block; font-size: 10.5px; color: var(--ink3); }
.apps button.on { background: var(--surface); border-color: var(--ink); color: var(--ink); font-weight: 500; }

.screen { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.hint { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 13px; color: var(--accent-ink); background: var(--accent-surface); }
.hint::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; animation: pulse 1.6s ease-in-out infinite; }
.hint:empty { display: none; }
@keyframes pulse { 50% { opacity: .3; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } }

/* ---------- 公式LINE（本人とのトーク・簡略表示） ---------- */
.talk-head { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--rule2); }
.talk-head .av { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.talk-head .t { font-weight: 700; font-size: 15px; line-height: 1.3; }
.talk-head .s { font-size: 11.5px; color: var(--ink3); }
.talk { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px 18px; background: var(--talk); }
.day { text-align: center; margin: 4px 0 12px; }
.day span { font: 500 11.5px var(--latin); color: var(--ink2); background: rgba(255,255,255,.7); border-radius: 999px; padding: 2px 10px; }
.tm { display: flex; gap: 8px; margin-bottom: 14px; animation: rise .4s ease both; }
.tm .av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; flex: 0 0 auto; }
.tm .col { min-width: 0; flex: 1; max-width: 330px; }
.tm .meta { font-size: 11px; color: var(--ink3); margin: 0 0 3px 2px; }
.tm .bub { background: var(--surface); border-radius: 4px 16px 16px 16px; padding: 10px 13px; font-size: 14.5px; }
.tm.me { justify-content: flex-end; }
.tm.me .bub { background: var(--accent); color: #fff; border-radius: 16px 4px 16px 16px; }
.fx { background: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(20,35,51,.06); }
.fx .fh { padding: 13px 15px 4px; font-weight: 700; font-size: 15.5px; display: flex; align-items: center; gap: 6px; }
.fx .fs { padding: 0 15px 8px; font-size: 13px; color: var(--ink2); }
.fx .fl { padding: 2px 15px 10px; }
.fx .fr { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--rule2); font-size: 14px; align-items: baseline; }
.fx .fr:first-child { border-top: 0; }
.fx .fr .k { flex: 0 0 auto; font-size: 11.5px; border-radius: 5px; padding: 0 7px; line-height: 20px; }
.fx .fr .k.due { background: var(--due-surface); color: var(--due); }
.fx .fr .k.ev { background: var(--rule2); color: var(--ink2); font-family: var(--latin); }
.fx .fr .k.re { background: var(--accent-surface); color: var(--accent-ink); }
.fx .first { margin: 0 15px 12px; padding: 9px 12px; border-radius: 10px; background: var(--bg); font-size: 13.5px; }
.fx .first b { color: var(--accent-ink); font-weight: 500; }
.fx .fb { display: grid; gap: 1px; background: var(--rule2); border-top: 1px solid var(--rule2); }
.fx .fb button { border: 0; background: var(--surface); padding: 12px; font-size: 14.5px; color: var(--accent-ink); font-weight: 500; }
.fx .fb button.main { background: var(--accent); color: #fff; }
.fx .lines { padding: 0 15px 10px; font-size: 14px; color: var(--ink); }
.fx .lines div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx .to { margin: 0 15px 8px; padding: 8px 12px; border-radius: 10px; background: var(--bg); font-size: 13px; }
.fx .to b { font-size: 14.5px; }
.fx .cnt { padding: 0 15px 10px; font-size: 12px; color: var(--ink3); }
.fx.pulse { box-shadow: 0 0 0 2px var(--accent-line), 0 1px 2px rgba(20,35,51,.06); }
.menu { flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rule2); border-top: 1px solid var(--rule2); padding-bottom: env(safe-area-inset-bottom); }
.menu button { border: 0; background: var(--surface); padding: 10px 4px; font-size: 12.5px; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.menu button svg { width: 20px; height: 20px; color: var(--accent); }
.menu .lbl { grid-column: 1 / -1; background: var(--surface); text-align: center; font-size: 10.5px; color: var(--ink3); padding: 4px; }

/* ---------- 受信箱（スマホ版）・さばく ---------- */
.sw { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px 14px 0; background: var(--bg); }
.swtop { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); margin-bottom: 10px; }
.swtop b { color: var(--ink); font-family: var(--latin); }
.stack { position: relative; flex: 1; min-height: 0; margin-bottom: 10px; touch-action: none; }
.card { position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 20px; padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 9px; box-shadow: 0 8px 24px -10px rgba(20,35,51,.18); user-select: none; -webkit-user-select: none; overflow: hidden; touch-action: none; will-change: transform; }
.card.under { transform: scale(.955) translateY(12px); opacity: .55; pointer-events: none; box-shadow: none; }
.card .cm { font-size: 12.5px; color: var(--ink3); display: flex; gap: 8px; align-items: center; }
.card .cm .ch { border: 1px solid var(--rule); border-radius: 5px; padding: 0 6px; line-height: 18px; color: var(--ink2); }
.card .cn { font-size: 22px; font-weight: 700; line-height: 1.35; }
.card .cp { background: var(--accent-surface); color: var(--accent-ink); border-radius: 12px; padding: 9px 12px; font-size: 14.5px; }
.card .cp small { display: block; font-size: 11px; color: var(--accent); }
.card .cw { font-size: 15px; line-height: 1.75; }
.card .cw small, .card .cl small { display: block; font-size: 11px; color: var(--ink3); }
.card .cl { font-size: 14px; color: var(--ink2); border-left: 3px solid var(--rule); padding-left: 10px; }
.card .cf { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink3); }
.card .cf .due { color: var(--due); background: var(--due-surface); border-radius: 5px; padding: 0 7px; }
.stamp { position: absolute; top: 50%; left: 50%; font-size: 24px; font-weight: 700; padding: 6px 16px; border: 2.5px solid; border-radius: 12px; opacity: 0; transform: translate(-50%,-50%) rotate(-6deg); background: rgba(255,255,255,.94); white-space: nowrap; pointer-events: none; transition: opacity .1s; }
.stamp.show { opacity: 1; }
.stamp.right { color: var(--accent); } .stamp.left { color: #A03D32; }
.stamp.up { color: #2F5C8A; } .stamp.down { color: var(--ink2); }
.swbtns { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-bottom: 10px; }
.swbtns button { border: 1px solid var(--rule); background: var(--surface); border-radius: 14px; min-height: 62px; font-size: 12.5px; font-weight: 500; padding: 6px 2px; line-height: 1.3; }
.swbtns button .ar { display: block; font-size: 19px; line-height: 1.2; color: var(--ink2); }
.swbtns button.go { border: 1.5px solid var(--accent); color: var(--accent-ink); }
.swbtns button.go .ar { color: var(--accent); }
.done-all { flex: 1; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--ink2); }
.done-all b { display: block; font-size: 19px; color: var(--ink); margin-bottom: 6px; }
.tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom); }
.tabs button { border: 0; background: transparent; font-size: 11.5px; color: var(--ink3); padding: 9px 2px 8px; position: relative; }
.tabs button.on { color: var(--ink); font-weight: 500; box-shadow: inset 0 2px 0 var(--ink); }
.tabs .b { display: inline-block; min-width: 17px; padding: 0 5px; border-radius: 9px; background: #C9473B; color: #fff; font: 600 10.5px/17px var(--latin); margin-left: 3px; }

/* 下から出る引き出し */
.sheet { position: absolute; inset: 0; background: rgba(20,35,51,.38); z-index: 20; display: flex; align-items: flex-end; animation: fade .2s ease both; }
.sbox { width: 100%; background: var(--surface); border-radius: 20px 20px 0 0; padding: 16px 16px calc(14px + env(safe-area-inset-bottom)); max-height: 86%; overflow-y: auto; animation: rise .25s ease both; }
.sbox .sh { font-size: 17px; font-weight: 700; }
.sbox .ss { font-size: 13px; color: var(--ink2); margin: 2px 0 10px; }
.opt { display: block; width: 100%; text-align: left; border: 1px solid var(--rule); background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; font-size: 15px; }
.opt .tag { display: inline-block; font-size: 11px; border-radius: 5px; padding: 0 6px; margin-right: 8px; background: var(--rule2); color: var(--ink2); vertical-align: 1px; }
.opt.rec { border: 1.5px solid var(--accent); }
.opt.rec .tag { background: var(--accent); color: #fff; }
.sbox textarea { width: 100%; font: inherit; font-size: 15px; border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; background: var(--bg); color: var(--ink); resize: none; margin: 4px 0 8px; }
.cancel { display: block; width: 100%; border: 0; background: transparent; color: var(--ink3); font-size: 14.5px; padding: 10px; }

/* ---------- 指示済み ---------- */
.list { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; background: var(--bg); }
.item { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; animation: rise .3s ease both; }
.item .ti { font-weight: 700; font-size: 15.5px; }
.item .su { font-size: 13px; color: var(--ink2); }
.item .st { display: inline-block; margin-top: 6px; font-size: 12px; border-radius: 6px; padding: 1px 8px; background: var(--rule2); color: var(--ink2); }
.item .st.ok { background: var(--accent-surface); color: var(--accent-ink); }
.item .st.sent { background: var(--bg); color: var(--ink3); }
.item .open { display: block; width: 100%; margin-top: 10px; border: 0; background: var(--accent); color: #fff; border-radius: 12px; padding: 11px; font-size: 15px; font-weight: 500; }
.spin { display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--accent-line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; margin-right: 5px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { padding: 40px 20px; text-align: center; color: var(--ink3); font-size: 14px; }

/* ---------- 確かめて送る ---------- */
.ch-head { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--rule2); }
.ch-head .back { border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-size: 14px; }
.ch-head b { font-size: 16px; }
.cfm { flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 16px; background: var(--bg); }
.dest { position: sticky; top: 0; z-index: 2; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 14px; padding: 10px 14px; margin: 10px 0 12px; }
.dest .l { font-size: 11.5px; color: var(--ink3); }
.dest .w { font-size: 20px; font-weight: 700; line-height: 1.35; }
.dest .k { font-size: 13px; color: var(--ink2); }
.dest .warn { font-size: 12.5px; color: var(--due); margin-top: 2px; }
.dest .mn { font-size: 13px; margin-top: 4px; }
.dest .mn span { color: var(--accent-ink); background: var(--accent-surface); border-radius: 5px; padding: 0 6px; }
.cfm h3 { font-size: 13px; color: var(--ink2); margin: 14px 2px 6px; font-weight: 500; }
.full { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 15px; font-size: 16.5px; line-height: 1.9; white-space: pre-wrap; }
.full mark { background: #FFE9A8; color: inherit; border-radius: 3px; padding: 0 2px; }
.fimg { margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
.fimg img { display: block; width: 100%; }
.fimg figcaption { font-size: 12px; color: var(--ink3); padding: 7px 12px; border-top: 1px solid var(--rule2); }
.sendbar { flex: 0 0 auto; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--rule2); }
.sendbar .n { font-size: 12px; color: var(--ink3); text-align: center; margin-bottom: 6px; }
.sendbtn { display: block; width: 100%; border: 0; background: var(--accent); color: #fff; border-radius: 14px; padding: 15px 12px; font-size: 17px; font-weight: 700; position: relative; }
.sendbtn.ring::after { content: ""; position: absolute; inset: -4px; border-radius: 17px; border: 2px solid var(--accent); animation: ring 1.8s ease-out infinite; pointer-events: none; }
@keyframes ring { 0% { transform: scale(.97); opacity: .6; } 100% { transform: scale(1.04); opacity: 0; } }
.sendbtn:disabled { background: var(--rule); color: var(--ink3); }
.sendbtn:disabled::after { display: none; }
.prog { display: grid; gap: 8px; margin: 14px 0; }
.prog div { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; }
.prog .s { margin-left: auto; font-size: 12.5px; color: var(--ink3); }
.prog .ok .s { color: var(--accent-ink); }
.sent-done { text-align: center; padding: 26px 10px 10px; animation: rise .4s ease both; }
.sent-done .ic { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-surface); color: var(--accent); display: grid; place-items: center; margin: 0 auto 12px; }
.sent-done .ic svg { width: 28px; height: 28px; }
.sent-done b { font-size: 19px; display: block; }
.sent-done p { color: var(--ink2); font-size: 14.5px; margin: 8px 0 0; }
.taskline { margin-top: 16px; text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; font-size: 14px; display: flex; gap: 10px; align-items: baseline; }
.taskline .k { flex: 0 0 auto; font-size: 11.5px; border-radius: 5px; padding: 0 7px; background: var(--due-surface); color: var(--due); }
.taskline .k.hold { background: var(--rule2); color: var(--ink2); }
.btn2 { display: block; width: 100%; margin-top: 12px; border: 1px solid var(--rule); background: var(--surface); border-radius: 14px; padding: 13px; font-size: 15.5px; }

/* 確かめの窓 */
.modal { position: absolute; inset: 0; z-index: 30; background: rgba(20,35,51,.42); display: grid; place-items: center; padding: 20px; animation: fade .2s ease both; }
.mbox { width: 100%; max-width: 360px; background: var(--surface); border-radius: 18px; padding: 20px 18px 14px; animation: rise .25s ease both; }
.mbox h3 { margin: 0 0 8px; font-size: 17px; }
.mbox ul { margin: 0 0 10px; padding-left: 18px; font-size: 14px; color: var(--ink); }
.mbox li { margin: 3px 0; }
.mbox .who { font-size: 13.5px; color: var(--ink2); background: var(--bg); border-radius: 10px; padding: 8px 12px; margin-bottom: 14px; }
.mbox .acts { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
.mbox .acts button { border-radius: 12px; padding: 12px; font-size: 15px; border: 1px solid var(--rule); background: var(--surface); }
.mbox .acts .yes { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }

/* 通知・トースト */
.banner { position: absolute; left: 10px; right: 10px; top: 8px; z-index: 40; background: rgba(255,255,255,.97); border: 1px solid var(--rule); border-radius: 16px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; box-shadow: 0 14px 34px -12px rgba(20,35,51,.35); animation: drop .35s ease both; }
@keyframes drop { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
.banner .av { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: 0 0 auto; }
.banner .t { font-size: 12px; color: var(--ink3); }
.banner .m { font-size: 14px; font-weight: 500; line-height: 1.4; }
.toast { position: absolute; left: 12px; right: 12px; top: 10px; z-index: 35; background: var(--ink); color: #fff; border-radius: 14px; padding: 10px 12px 10px 14px; font-size: 14px; display: flex; align-items: center; gap: 10px; animation: drop .25s ease both; }
.toast .bar { position: absolute; left: 14px; right: 14px; bottom: 5px; height: 2px; background: rgba(255,255,255,.18); border-radius: 2px; overflow: hidden; }
.toast .bar i { display: block; height: 100%; background: #fff; transform-origin: left; animation: shrink linear forwards; }
@keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.toast button { margin-left: auto; border: 1px solid rgba(255,255,255,.6); background: transparent; color: #fff; border-radius: 9px; padding: 4px 11px; font-size: 13px; flex: 0 0 auto; }

/* タスク・今朝・夜の準備 */
.card .tt { font-size: 12px; color: var(--ink3); }
.card .tq { font-size: 13px; font-weight: 700; color: var(--accent-ink); }
.card .tn { font-size: 20px; font-weight: 700; line-height: 1.45; }
.card .tw { font-size: 14px; color: var(--ink2); }
.card .te { font-size: 13.5px; color: var(--ink2); border-left: 3px solid var(--rule); padding-left: 10px; }
.chip2 { display: inline-block; font-size: 12px; border-radius: 6px; padding: 1px 8px; margin-right: 6px; background: var(--rule2); color: var(--ink2); }
.chip2.hot { background: var(--due-surface); color: var(--due); }
.swbtns button:disabled { opacity: .3; }
.mg { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 16px; background: var(--bg); }
.mg h3 { font-size: 12.5px; color: var(--ink2); margin: 14px 2px 6px; font-weight: 700; }
.mg h3:first-child { margin-top: 2px; }
.mi2 { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 11px 13px; margin-bottom: 8px; animation: rise .3s ease both; }
.mi2 .t { font-weight: 700; font-size: 15px; }
.mi2 .w { font-size: 13px; color: var(--ink2); }
.mi2 .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.mi2 .acts button { border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-size: 13.5px; }
.mi2 .acts button.y { background: var(--accent); border-color: var(--accent); color: #fff; }
.mi2.done { opacity: .45; }
.npk { display: flex; gap: 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 11px 13px; margin-bottom: 8px; align-items: flex-start; }
.npk input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); flex: 0 0 auto; }
.npk .t { font-weight: 700; font-size: 15px; }
.npk .w { font-size: 13px; color: var(--ink2); }
.bigbtn { display: block; width: 100%; border: 0; background: var(--accent); color: #fff; border-radius: 14px; padding: 13px; font-size: 16px; font-weight: 700; margin-top: 6px; }
.lst { position: relative; flex: 0 0 auto; }
.lst > button { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 3px 9px; font-size: 12px; color: var(--ink2); white-space: nowrap; }
.lst > button b { font-family: var(--latin); color: var(--accent); }
.lstbox { position: absolute; right: 0; top: 30px; width: 270px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 14px 34px -12px rgba(20,35,51,.35); padding: 10px 12px; z-index: 45; animation: rise .2s ease both; }
.lstbox .h { font-size: 12px; color: var(--ink3); margin-bottom: 4px; }
.lstbox button { display: flex; width: 100%; gap: 8px; align-items: center; text-align: left; border: 0; background: transparent; padding: 6px 2px; font-size: 14px; border-radius: 8px; }
.lstbox .ck { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--rule); flex: 0 0 auto; display: grid; place-items: center; color: #fff; }
.lstbox .ok .ck { background: var(--accent); border-color: var(--accent); }
.lstbox .ok .ck svg { width: 11px; height: 11px; }
.lstbox .ok span:last-child { color: var(--ink3); }

/* 締め */
.closing { position: absolute; inset: 0; z-index: 50; background: rgba(20,35,51,.5); display: flex; align-items: flex-end; animation: fade .3s ease both; }
.cl { width: 100%; background: var(--surface); border-radius: 22px 22px 0 0; padding: 26px 22px calc(20px + env(safe-area-inset-bottom)); animation: rise .4s ease both; }
.cl .k { font-size: 12px; color: var(--accent-ink); letter-spacing: .08em; font-weight: 500; }
.cl h2 { font-size: 25px; line-height: 1.45; margin: 6px 0 10px; letter-spacing: -.01em; }
.cl p { color: var(--ink2); font-size: 14.5px; margin: 0 0 14px; }
.cl .facts { background: var(--bg); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; display: grid; gap: 5px; }
.cl .facts span { font: 600 15px var(--latin); color: var(--accent); display: inline-block; width: 20px; }
.cl a.main { display: block; text-align: center; text-decoration: none; background: var(--accent); color: #fff; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 700; }
.cl .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.cl .row2 a, .cl .row2 button { display: block; text-align: center; text-decoration: none; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 14px; padding: 12px 6px; font-size: 14.5px; }
.cl .stay { display: block; margin: 12px auto 0; border: 0; background: none; color: var(--ink3); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>

function bindSwipe(el, id, opt) {
  var sx = 0, sy = 0, dx = 0, dy = 0, on = false, moved = false;
  var LB = (opt && opt.label) || LABEL, DEC = (opt && opt.decide) || decide, TAP = (opt && opt.tap) || function () { showDetail(id); };
  var dirOf = function (x, y, th) { if (Math.abs(x) >= Math.abs(y)) return x > th ? "right" : x < -th ? "left" : null; return y < -th ? "up" : y > th ? "down" : null; };
  el.addEventListener("pointerdown", function (e) { on = true; moved = false; sx = e.clientX; sy = e.clientY; dx = dy = 0; try { el.setPointerCapture(e.pointerId); } catch (x) {} el.style.transition = "none"; });
  el.addEventListener("pointermove", function (e) {
    if (!on) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    el.style.transform = "translate(" + dx + "px," + dy + "px) rotate(" + (dx / 20) + "deg)";
    var d = dirOf(dx, dy, 40), st = $("#stamp");
    if (d && !LB[d]) d = null;
    st.textContent = d ? LB[d] : ""; st.className = "stamp" + (d ? " show " + d : "");
  });
  var end = function () {
    if (!on) return; on = false;
    var d = dirOf(dx, dy, 90);
    el.style.transition = "transform .22s ease";
    if (!moved) { el.style.transform = ""; TAP(); return; }
    if (d && !LB[d]) d = null;
    if (!d) { el.style.transform = ""; $("#stamp").className = "stamp"; return; }
    DEC(d);
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", function () { on = false; el.style.transform = ""; });
}

}

function commit(id, d, instr, text) {
  flushPending();
  flyOut(d);
  S.deck.shift();
  var p = { id: id, instr: instr, done: false, g: G };
  p.timer = setTimeout(function () { applyPending(p); }, 7000);
  S.pending = p;
  setTimeout(function () { if (S.view === "swipe") renderSwipe(); }, 140);
  if (instr) { S.instr[id] = { state: "making", label: instr }; startDraft(id); mark("s"); }
  toast(text, "取り消す", function () { undo(p); }, 7000);
}
function applyPending(p) { if (p.done) return; p.done = true; clearTimeout(p.timer); if (S.pending === p) S.pending = null; }
function flushPending() { if (S && S.pending) applyPending(S.pending); }
function undo(p) {
  if (p.done || p.g !== G) return;
  p.done = true; clearTimeout(p.timer); S.pending = null;
  S.deck.unshift(p.id);
  if (p.instr) delete S.instr[p.id];
  toast("取り消しました");
  if (S.view === "swipe") renderSwipe();
}

}

function riskCheck(id, n) {

  if (t.img) risks.push("画像も一緒に送ります。中身を確かめましたか。");

  var el = document.createElement("div"); el.className = "modal";
  el.innerHTML = '<div class="mbox"><h3>送る前に確かめてください</h3>' + (risks.length ? "<ul>" + risks.map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ul>" : "")
    + '<div class="who">宛先：<b>' + esc(t.name) + "</b>（" + esc(t.ch) + "）<br>送ったものは取り消せません。体験版なので、実際には送られません。</div>"

function sending(id, n) {

var NIGHT = [
  { t: "青葉製作所へ、見積書の修正版（150個）を送る文", w: "明日10/6が期限の約束", on: true, made: "本文と修正版のファイルを、送る前の下書きに置きました" },
  { t: "ひかり会計へ、年末調整の資料の催促", w: "確認日を過ぎています。やわらかく", on: true, made: "催促の文を、送る前の下書きに置きました" },
  { t: "若葉企画との打ち合わせの論点メモ", w: "これまでのやりとりから1枚に", on: false, made: "論点メモ（A4・1枚）を作りました" }
];
function renderNight() {
  var html = '<div class="hint" id="hint"></div><div class="mg">';
  if (S.night === 2) {
    html += "<h3>朝6:00　頼まれていた準備ができました</h3>" + NIGHT.filter(function (n, i) { return S.nightPick[i]; }).map(function (n) {
      return '<div class="mi2"><div class="t">' + esc(n.t) + '</div><div class="w">' + esc(n.made) + '</div><div class="acts"><button type="button" class="y" data-nop>確かめて送る</button></div></div>';
    }).join("") + '<p style="font-size:12.5px;color:var(--ink3);margin:10px 2px">朝の段取りのLINEの先頭にも「頼まれていた準備：◯件できました」と1行入ります。まだ何も送っていません。</p>';
  } else {
    html += "<h3>21:00　明日のために、作っておけるもの</h3>"
      + NIGHT.map(function (n, i) { return '<label class="npk"><input type="checkbox" data-np="' + i + '"' + (n.on ? " checked" : "") + '><div><div class="t">' + (i + 1) + "．" + esc(n.t) + '</div><div class="w">' + esc(n.w) + "</div></div></label>"; }).join("")
      + '<button type="button" class="bigbtn" data-ngo>印を付けたものを頼む</button>'
      + '<p style="font-size:12.5px;color:var(--ink3);margin:10px 2px">頼んだものだけを夜のうちに作ります。返事がなければ何も作りません。公式LINEに「1,2」「全部」と返すだけでも頼めます。</p>';
  }
  html += "</div>" + tabs("night");
  $("#screen").innerHTML = html; bindTabs(); setHint(S.night === 2 ? "" : "作っておくものに印を付けて［頼む］。");
  $(".mg").onclick = function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    if (b.hasAttribute("data-ngo")) {
      S.nightPick = {}; document.querySelectorAll("[data-np]").forEach(function (c) { S.nightPick[+c.getAttribute("data-np")] = c.checked; });
      if (!Object.keys(S.nightPick).some(function (k) { return S.nightPick[k]; })) { toast("印が付いていません"); return; }
      S.night = 2; mark("n"); toast("夜のうちに作ります（体験版では、すぐ朝6時に進めます）"); renderNight();
    } else if (b.hasAttribute("data-nop")) toast("本物では、ここから全文を確かめて送ります");
  };
}

// ---------------- 体験リスト ----------------
var LST = [["m", "朝の段取りを見る"], ["s", "はじいて返事を頼む"], ["c", "全文を確かめて、自分で送る"], ["f", "下書きを直す（LINEの［直す］）"], ["t", "タスクをはじいて答える"], ["n", "夜の準備を頼む"]];
function mark(k) { if (S && !S.tried[k]) { S.tried[k] = true; renderList(); } }
function renderList() {
  var n = LST.filter(function (x) { return S.tried[x[0]]; }).length;
  $("#lst").innerHTML = '<button type="button" data-lsttoggle>体験リスト <b>' + n + "/" + LST.length + "</b></button>"
    + (S.lstOpen ? '<div class="lstbox"><div class="h">押すと、その体験に進みます。</div>' + LST.map(function (x) {
      return '<button type="button" class="' + (S.tried[x[0]] ? "ok" : "") + '" data-lst="' + x[0] + '"><span class="ck">' + (S.tried[x[0]] ? ICON.ok : "") + "</span><span>" + esc(x[1]) + "</span></button>";
    }).join("") + "</div>" : "");
}
$("#lst").addEventListener("click", function (ev) {
  var it = ev.target.closest("[data-lst]");
  if (it) {
    S.lstOpen = false; var k = it.getAttribute("data-lst");
    if (k === "m") go("talk"); else if (k === "s") go("swipe"); else if (k === "t") go("tasks"); else if (k === "n") go("night");
    else if (k === "c" || k === "f") { var r = Object.keys(S.instr).filter(function (x) { return S.instr[x].state === "ready" && !S.sent[x]; })[0]; if (r) go("talk", r); else { toast("先に「さばく」で右か上にはじいて、返事を頼んでください"); go("swipe"); } }
    renderList(); return;
  }
  if (ev.target.closest("[data-lsttoggle]")) { S.lstOpen = !S.lstOpen; renderList(); }
});
// ---------------- つなぐ ----------------
$("#screen").addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-act]"); if (!b) return;
  var a = b.getAttribute("data-act");
  if (a === "swipe") go("swipe");
  else if (a === "instr") go("instr");
  else if (a === "open") { setStep(3); go("confirm", b.getAttribute("data-id")); }
  else if (a === "fix") openFix(b.getAttribute("data-id"));
  else if (a === "today") { S.talk.push({ me: "今日やること" }); S.talk.push({ t: "10:10", text: "今日のやること：①本日中 三ツ星不動産へ契約書の控えを送る ②10:00 青葉製作所 打ち合わせ。返事が必要な連絡は" + S.deck.length + "件です。" }); renderTalk(); }
  else toast("体験版では、ここは動きません。");
});
$("#apps").addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-app]"); if (!b) return;
  if (b.getAttribute("data-app") === "line") go("talk"); else go(S.view === "instr" ? "instr" : "swipe");
});
function start() {
  G++;
  document.querySelectorAll(".sheet,.modal,.closing,.banner,.toast").forEach(function (e) { e.remove(); });
  S = fresh(); setStep(1); go("talk");
}
$("#restart").onclick = start;
start();

// 確かめ用：#auto=swipe,R,wait,line,open:aoba,send … で流れを早送りする（ふだんは動かない）
(function () {
  var m = location.hash.match(/auto=([^&]+)/); if (!m) return;
  var st = document.createElement("style"); st.textContent = "*,*::before,*::after{animation:none!important;transition:none!important}"; document.head.appendChild(st);
  var steps = decodeURIComponent(m[1]).split(",");
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  (async function () {
    await sleep(300);
    for (var i = 0; i < steps.length; i++) {
      var k = steps[i], a = k.split(":");
      if (k === "swipe") go("swipe");
      else if (k === "line") go("talk");
      else if (k === "instr") go("instr");
      else if (k === "L") decide("left");
      else if (k === "D") decide("down");
      else if (k === "R" || k === "U") { decide(k === "R" ? "right" : "up"); await sleep(200); var rec = document.querySelector(".sheet .opt.rec") || document.querySelector(".sheet .opt"); if (rec && a.length < 2) rec.click(); }
      else if (k === "Ropen" || k === "Uopen") { decide(k === "Ropen" ? "right" : "up"); }
      else if (a[0] === "open") { setStep(3); go("confirm", a[1]); }
      else if (k === "send") { document.querySelector("#sendNow").click(); await sleep(200); var y = document.querySelector("[data-yes]"); if (y) y.click(); await sleep(3000); }
      else if (k === "risk") { document.querySelector("#sendNow").click(); }
      else if (k === "closing") showClosing();
      else if (a[0] === "view") go(a[1]);
      else if (k === "lst") { S.lstOpen = true; renderList(); }
      else if (k === "wait") await sleep(4200);
      await sleep(400);
    }
  })();
})();
})();
</script>
</body>
</html>
