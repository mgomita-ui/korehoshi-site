  $("#detail").innerHTML =
    '<div class="dhead"><b>貼って下書き</b></div>'
    + '<div id="msgs" style="display:block">'
    + '<p class="hint" style="margin-bottom:9px">相手から届いた文面を貼ると、返信案を作ります。'
    + '「きまり」と、これまで実際に送った文面を読むので、他のやりとりと同じ書き方になります。'
    + 'ここで作ったものは会話として残りません。送るのはご自身で貼り付けてください。</p>'
    + '<textarea id="pIn" style="min-height:150px" placeholder="メッセンジャーやメールの本文を、そのまま貼り付けてください"></textarea>'
    + '<div class="row" style="margin-top:8px">'
    + (state.accounts.length > 1
        ? '<select id="pAcct">' + state.accounts.map(function (a) {
            return '<option value="' + esc(a.id) + '">' + esc(a.label) + "</option>";
          }).join("") + "</select>"
        : "")
    + '<select id="pForm"><option value="chat">チャット（短く）</option><option value="mail">メール（宛名と署名）</option></select>'
    + '<input id="pInst" placeholder="指示があれば（例: 料金には触れない）" style="flex:1">'
    + '</div>'
    + '<textarea id="pOut" style="min-height:190px;margin-top:10px" placeholder="ここに返信案が出ます"></textarea>'
    + "</div>"
    + '<div class="panel"><div class="row">'
    + '<button class="act go" id="pGo">下書きを作る</button>'
    + '<button class="act" id="pCopy">返信案をコピー</button>'
    + '<span class="hint">送信はしません。</span>'
    + "</div></div>";

  $("#pGo").onclick = async function (e) {
    var t = $("#pIn").value.trim();
    if (!t) { toast("相手の文面を貼ってください"); return; }
    e.target.disabled = true; e.target.textContent = "考えています…";
    var r = await api("/draft-paste", { method: "POST", body: JSON.stringify({
      pasted: t, form: $("#pForm").value, instruction: $("#pInst").value,
      account: $("#pAcct") ? $("#pAcct").value : null }) });
    e.target.disabled = false; e.target.textContent = "下書きを作る";
    if (r && r.text) { $("#pOut").value = r.text; $("#pOut").focus(); }
  };

  $("#pCopy").onclick = function () {
    var v = $("#pOut").value;
    if (!v) return;
    // クリップボードが使えない場合でも、選択だけはしておく。
    $("#pOut").select();
    if (navigator.clipboard) navigator.clipboard.writeText(v).then(function () { toast("コピーしました"); });
    else toast("選択しました。Ctrl+Cでコピーしてください");
  };
};

// きまりは2段。共通は書き方の作法、事業ごとは名乗り方や料金の書き方。
// 社保削減とホワイト財団では言ってよいことが違うので、1枚に混ぜない。
$("#houseNote").onclick = function () { openHouse("common"); };

async function openHouse(which) {
  var d = await api("/house-note" + (which === "common" ? "" : "?account=" + encodeURIComponent(which)));
  if (!d) return;
  state.tab = "house"; state.current = null;
  $("#tabInbox").classList.remove("on"); $("#tabTasks").classList.remove("on"); $("#tabWaits").classList.remove("on");
  $("#main").classList.add("viewing");

  var tabs = [{ id: "common", label: "共通（全事業）" }].concat(
    state.accounts.map(function (a) { return { id: a.id, label: a.label }; }));

  var isCommon = which === "common";
  var ph = isCommon
    ? "例&#10;・文の途中で改行しない&#10;・Markdownの記号は使わない&#10;・急ぎと言われたら、いつまでに返すかを必ず書く&#10;・助成金の可否は断定せず、確認事項を挙げる"
    : "例&#10;・初回の相手には事業名から名乗る&#10;・料金は必ず「税別」と書く&#10;・この事業では〇〇の話には触れない&#10;・よく聞かれること と その答え方";

  $("#detail").innerHTML =
    '<div class="dhead"><b>きまり</b>'
    + '<span class="tag">' + esc(isCommon ? "共通" : accountLabel(which)) + "</span></div>"
    + '<div id="msgs" style="display:block">'
    + (tabs.length > 1
        ? '<div class="chips" style="margin-bottom:10px">'
          + tabs.map(function (x) {
              return '<button data-h="' + esc(x.id) + '"' + (x.id === which ? ' class="on"' : "") + ">"
                + esc(x.label) + "</button>";
            }).join("")
          + "</div>"
        : "")
    + '<p class="hint" style="margin-bottom:9px">'
    + (isCommon
        ? "全事業の下書きに効きます。書き方の作法をここに。"
        : "この事業の下書きだけに効きます。共通のきまりと合わせて読まれます。ノウハウはここに溜めてください。")
    + '相手ごとの覚え書きは、各会話の「メモ」に書いてください。</p>'
    + '<textarea id="hn" style="min-height:300px" placeholder="' + ph + '">'
    + esc(d.body || "") + "</textarea></div>"
    + '<div class="panel"><div class="row">'
    + '<button class="act go" id="saveHn">保存</button>'
    + '<span class="hint">書き足すほど、下書きが自分の書き方に寄っていきます。</span>'
    + "</div></div>";

  $("#msgs").onclick = function (ev) {
    var b = ev.target.closest("[data-h]"); if (!b) return;
    openHouse(b.dataset.h);
  };

  if (isCommon) showCandidates();
  $("#saveHn").onclick = async function () {
    await api("/house-note", { method: "POST", body: JSON.stringify({
      body: $("#hn").value, account: which === "common" ? null : which }) });
    toast("保存しました");
  };
}

/**
 * 直され方から出てきた、きまりの候補を出す。
 * 押すまではどこにも効かない。溜まるだけで効き始めると、
 * 誰も読まない長い文書になって、かえって下書きが悪くなる。
 */
async function showCandidates() {
  var d = await api("/rules/pending");
  if (!d || !d.rules || !d.rules.length) return;
  var host = document.createElement("div");
  host.className = "cand";
  host.innerHTML = '<div class="head">下書きの直され方から見つけたもの（押すまで効きません）</div>'
    + d.rules.map(function (r) {
        return '<div class="r"><div class="txt">' + esc(r.rule)
          + '<div class="why">' + esc(r.why || "") + (r.from ? "　／ " + esc(r.from) : "") + "</div></div>"
          + '<button class="mini" data-ok="' + esc(r.rule) + '">入れる</button>'
          + '<button class="mini" data-ng="' + esc(r.rule) + '">いらない</button></div>';
      }).join("");
  $("#msgs").insertBefore(host, $("#msgs").firstChild);

  host.onclick = async function (ev) {
    var ok = ev.target.closest("[data-ok]"), ng = ev.target.closest("[data-ng]");
    var b = ok || ng; if (!b) return;
    b.disabled = true;
    await api("/rules/pending", { method: "POST", body: JSON.stringify({
      rule: ok ? ok.dataset.ok : ng.dataset.ng, accept: !!ok }) });
    toast(ok ? "きまりに入れました" : "消しました");
    openHouse("common");
  };
}

// やりとりの文字の大きさ。5段階を押すたびに回す。この端末にだけ覚える。
var FONT_STEPS = [12, 13.5, 15, 16.5, 18];
var FONT_NAMES = ["極小", "小", "標準", "大", "特大"];
function applyFont(i) {
  document.documentElement.style.setProperty("--msgfs", FONT_STEPS[i] + "px");
}
var fontIdx = 2;
try { var fs0 = Number(localStorage.getItem("msgFont")); if (fs0 >= 0 && fs0 < 5 && localStorage.getItem("msgFont") !== null) fontIdx = fs0; } catch (e) {}
applyFont(fontIdx);
// ヘッダーの「その他」。押すと開き、外を押すか中の項目を押すと閉じる（文字の大きさは続けて押せるよう開いたまま）。
$("#moreBtn").onclick = function (e) {
  e.stopPropagation();
  $("#more").classList.toggle("open");
};
$("#moreBox").addEventListener("click", function (e) {
  var b = e.target.closest("button, a");
  if (b && b.id !== "fontBtn") $("#more").classList.remove("open");
});
document.addEventListener("click", function (e) {
  if (!e.target.closest("#more")) $("#more").classList.remove("open");
  // 会話の設定も、外を押したら閉じる。
  var ts = document.getElementById("thSet");
  if (ts && ts.open && !e.target.closest("#thSet") && !e.target.closest(".ask")) ts.open = false;
});

$("#fontBtn").onclick = function () {
  fontIdx = (fontIdx + 1) % FONT_STEPS.length;
  applyFont(fontIdx);
  try { localStorage.setItem("msgFont", String(fontIdx)); } catch (e) {}
  toast("文字の大きさ：" + FONT_NAMES[fontIdx] + "（" + (fontIdx + 1) + "/5）");
};

$("#selftest").onclick = async function (e) {
  // e.target だと中のSVGや文字が返る。押されたボタン自身の見た目は変えず、busy で示す。
  var sb = e.currentTarget;
  sb.disabled = true; sb.classList.add("busy");
  var r = await api("/selftest?account=" + encodeURIComponent(state.account || "default"));
  sb.disabled = false; sb.classList.remove("busy");
  if (!r) return;
  var mark = function (v) { return v === true ? "OK" : v === false ? "NG" : "未確認"; };
  // 取り込みが止まっていないか。最後に取りに行った（届いた）時刻を出す。
  var ago = function (ms) {
    if (!ms) return "記録なし";
    var m = Math.round((Date.now() - ms) / 60000);
    return m < 60 ? m + "分前" : m < 1440 ? Math.round(m / 60) + "時間前" : Math.round(m / 1440) + "日前";
  };
  var ik = r.intake || {};
  var nl = String.fromCharCode(10);
  var intakeTxt = ("取り込みの状態" + nl
    + "  LINE：最後に届いたのは " + ago(ik.line) + nl
    + "  チャットワーク：最後の巡回は " + ago(ik.chatwork) + nl
    + "  メール・議事録：最後の巡回は " + ago(ik.google && ik.google.at)
    + (ik.google && ik.google.result ? "（" + ik.google.result + "）" : "") + nl
    + "  メッセンジャー：自動では取りに行きません。必要なときにコピーして貼ってください" + nl + nl);
  alert(intakeTxt + [
    "LINEのアクセストークン: " + mark(r.lineToken.ok), "  " + r.lineToken.detail, "",
    "ClaudeのAPIキー: " + mark(r.anthropic.ok), "  " + r.anthropic.detail, "",
    "LINEのチャネルシークレット: " + mark(r.channelSecret.ok), "  " + r.channelSecret.detail, "",
    "チャットワーク: " + mark(r.chatwork.ok), "  " + r.chatwork.detail
  ].join("\n"));
};

$("#sweep").onclick = async function (e) {
  // e.target だと中のSVGが返る。押されたボタン自身を持つ。
  var b = e.currentTarget;
  b.disabled = true; b.classList.add("busy");
  try {
    var r = await api("/chatwork/sweep", { method: "POST" });
    if (!r) return;
    toast(r.checked + "部屋を見て、未返信 " + r.pending + "件");
    loadList();
  } finally {
    b.disabled = false; b.classList.remove("busy");
  }
};

$("#gsweep").onclick = async function (e) {
  var b = e.currentTarget;
  b.disabled = true; b.classList.add("busy");
  try {
    var r = await api("/google/sweep", { method: "POST" });
    if (!r) return;
    if (r.error) { toast(r.error); return; }
    var lines = [];
    if (r.mail && r.mail.error) lines.push("メール: " + r.mail.error);
    else if (r.mail) lines.push("メール " + r.mail.checked + "件中 " + r.mail.added + "件（相槌 " + r.mail.quiet + "件）");
    if (r.minutes && r.minutes.error) lines.push("議事録: " + r.minutes.error);
    else if (r.minutes) lines.push("議事録 " + r.minutes.checked + "件中 " + r.minutes.added + "件");
    toast(lines.join(" / "));
    loadList();
  } finally {
    b.disabled = false; b.classList.remove("busy");
  }
};

$("#toast").onclick = function (e) { if (e.target.id === "toast") hideToast(); };

// 本文まで探す。会話の見出しだけでは見つからないものが多い。
// LINEのグループ名は相手の名前を含まないことが多く、
// 「小田原さんのZoomのURL」が見出しでは引っかからなかった（2026-09-21）。
var qTimer = null;
$("#q").addEventListener("input", function () {
  clearTimeout(qTimer);
  var v = $("#q").value.trim();
  if (v.length < 2) { state.hits = null; renderList(); return; }
  // 打つたびに叩かない。手が止まってから探す。
  qTimer = setTimeout(async function () {
    var r = await api("/search?q=" + encodeURIComponent(v));
    state.hits = (r && r.hits) || [];
    renderList();
  }, 300);
});

// 外から届いた送信セットの確認用リンク（/inbox?thread=…）で来たら、その会話を開く。
Promise.resolve(loadList()).then(function () {
  var q = new URLSearchParams(location.search).get("thread");
  if (q) openThread(q);
});
// 新着に気づけるよう、静かに読み直す。開いている会話の本文は触らない。
setInterval(async function () {
  if (state.tab !== "inbox") return;
  if (!state.current) { loadList(); return; }
  // 会話を開いたまま Claude Code から送信セットが届くことがある。
  // 届いたのに画面が古いままだと気づけないので、ここだけ確かめる。
  var got = await api("/prep-set?id=" + encodeURIComponent(state.current));
  var id = got && got.set ? got.set.setId : null;
  if (id === state.prepSetId) return;
  var box = $("#reply");
  // 書きかけがあるときは開き直さない。消えてしまうため、知らせるだけにする。
  if (box && box.value && box.value.trim()) { toast("送信セットが届きました。開き直すと出ます"); return; }
  openThread(state.current);
}, 30000);
</script>
