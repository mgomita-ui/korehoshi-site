<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <style>
    text { font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", system-ui, sans-serif; fill: #1a1a1a; }
    .t { font-size: 30px; font-weight: 700; }
    .k { font-size: 15px; fill: #6b7280; }
    .h { font-size: 17px; font-weight: 700; }
    .s { font-size: 14px; fill: #4b5563; }
    .tm { font-size: 14px; font-weight: 700; fill: #06c755; }
  </style>
  <rect width="800" height="600" fill="#f6f7f9"/>
  <rect x="0" y="0" width="800" height="96" fill="#ffffff"/>
  <rect x="0" y="95" width="800" height="1" fill="#e5e7eb"/>
  <text class="t" x="48" y="52">図解の例 3/3</text>
  <text class="k" x="48" y="78">入れたあとの1日の使い方</text>

  <path d="M120 150 V540" stroke="#e5e7eb" stroke-width="2"/>

  <g>
    <circle cx="120" cy="188" r="9" fill="#06c755"/>
    <text class="tm" x="48" y="193">9:00</text>
    <text class="h" x="152" y="182">要対応を上から開く</text>
    <text class="s" x="152" y="208">件数と、手のかかり具合の札を見て、順番を決める</text>

    <circle cx="120" cy="272" r="9" fill="#06c755"/>
    <text class="tm" x="48" y="277">9:30</text>
    <text class="h" x="152" y="266">すぐ返せるものを返す</text>
    <text class="s" x="152" y="292">下書きが入っているので、直して送るだけ</text>

    <circle cx="120" cy="356" r="9" fill="#06c755"/>
    <text class="tm" x="48" y="361">11:00</text>
    <text class="h" x="152" y="350">判断が要るものを決める</text>
    <text class="s" x="152" y="376">「これが決まれば書けます」に答えると、下書きができる</text>

    <circle cx="120" cy="440" r="9" fill="#06c755"/>
    <text class="tm" x="48" y="445">15:00</text>
    <text class="h" x="152" y="434">やることを片付ける</text>
    <text class="s" x="152" y="460">今日・所要時間で絞って、すき間の時間に合うものから</text>

    <circle cx="120" cy="524" r="9" fill="#06c755"/>
    <text class="tm" x="48" y="529">18:00</text>
    <text class="h" x="152" y="518">本日を閉じる</text>
    <text class="s" x="152" y="544">未判断・期限切れ・催促どき・送り忘れがゼロかを点検する</text>
  </g>
</svg>
