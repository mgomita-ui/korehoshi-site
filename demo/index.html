<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>受信箱（見本・架空のデータ）</title>
<style>
  :root {
    color-scheme: light;
    --bg:#f6f7f9; --card:#fff; --fg:#1a1a1a; --muted:#6b7280; --line:#e5e7eb;
    --accent:#06c755; --warn:#dc2626; --in:#fff; --out:#dcf7c5;
  }
  @media (prefers-color-scheme: never-xyz) {
    :root { --bg:#16181d; --card:#1e2128; --fg:#e8eaed; --muted:#9aa0a6; --line:#2e323a;
            --in:#2a2e36; --out:#2c4a30; }
  }
  * { box-sizing:border-box; }
  body { margin:0; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
         background:var(--bg); color:var(--fg);
         font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif; font-size:14px; }

  header { display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line);
           background:var(--card); flex-shrink:0; }
  header h1 { font-size:15px; margin:0; font-weight:700; }
  header nav { display:flex; gap:3px; }
  header nav button { border:0; background:transparent; color:var(--muted); padding:5px 8px; border-radius:7px;
                      cursor:pointer; font-size:12px; font-weight:700; display:inline-flex; align-items:center; gap:3px; }
  header nav button svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8;
                          stroke-linecap:round; stroke-linejoin:round; }
  header nav .navn:empty { display:none; }
  header nav button.on { background:var(--bg); color:var(--fg); }
  header .sp { flex:1; }
  .mini { border:1px solid var(--line); background:transparent; color:var(--muted); padding:5px 10px;
          border-radius:7px; cursor:pointer; font-size:12px; }

  /* 見出しの並び。幅が足りないと文字が縦積みになって読めなくなるので、
     折り返しを止め、右側の道具はアイコンだけにしてある。名前は title で出る。 */
  header nav button, header > .mini { white-space:nowrap; flex-shrink:0; }
  .mini.ico { padding:0; width:32px; height:30px; display:inline-flex; align-items:center; justify-content:center; }
  .mini.ico svg { width:17px; height:17px; fill:none; stroke:currentColor;
                  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .mini.ico:hover { color:var(--fg); border-color:var(--fg); }
  .mini.ico:disabled { opacity:.45; cursor:default; }
  .mini.ico.busy svg { animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* minmax(0,1fr) にしないと、長いグループ名のぶんだけ右の列が広がり、
     送信ボタンが画面の外へ押し出される。1fr の既定は min-width:auto。 */
  main { flex:1; display:grid; grid-template-columns:330px minmax(0, 1fr); min-height:0; }
  @media (max-width:820px) {
    main { grid-template-columns:1fr; }
    main.viewing #list { display:none; }
    main:not(.viewing) #detail { display:none; }
  }

  #list { border-right:1px solid var(--line); overflow-y:auto; background:var(--card); }
  .filters { padding:9px 12px; border-bottom:1px solid var(--line); position:sticky; top:0;
             background:var(--card); z-index:2; }
  .states { display:flex; gap:5px; }
  .states button { flex:1; border:1px solid var(--line); background:transparent; color:var(--muted);
                   font-size:12px; padding:6px 2px; border-radius:8px; cursor:pointer; font-weight:600;
                   white-space:nowrap; }
  .states button.on { background:var(--fg); color:var(--card); border-color:var(--fg); }
  /* 経路の絞り込み。LINEを見たいときにメールが挟まらないように。
     0件の経路は出さない。押せるのに何も起きないボタンは邪魔なだけ。 */
  .states.chan { margin-top:7px; }
  .states.chan button { font-weight:500; font-size:12px; }
  .states.chan button .n { opacity:.6; margin-left:3px; font-size:11px; }
  .filters input.q { width:100%; margin-bottom:7px; padding:7px 10px; font-size:13px;
                     border:1px solid var(--line); border-radius:8px;
                     background:var(--bg); color:var(--fg); }
  /* 探した結果。会話ではなく「見つかった行」を並べる。
     どの会話の、いつの発言かが分かれば、あとは開けばよい。 */
  .hit { padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .hit:hover { background:var(--bg); }
  .hit .top { display:flex; gap:8px; align-items:baseline; }
  .hit .top b { font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hit .top .when { color:var(--muted); font-size:11px; flex-shrink:0; }
  .hit .body { color:var(--muted); font-size:12px; line-height:1.55; margin-top:3px;
               display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .hit mark { background:var(--warn); color:#fff; border-radius:3px; padding:0 2px; }

  .filters select { width:100%; margin-top:7px; padding:6px 9px; font-size:12.5px; border:1px solid var(--line);
                    border-radius:8px; background:var(--bg); color:var(--fg); }
  .count { margin-top:7px; font-size:11.5px; color:var(--muted); }

  .thread { padding:11px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .thread:hover { background:var(--bg); }
  .thread.on { background:var(--bg); box-shadow:inset 3px 0 0 var(--accent); }
  .thread .top { display:flex; align-items:baseline; gap:8px; }
  .alias { font-size:10px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 3px; margin-left:5px; }
  .thread .name { font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .thread .when { color:var(--muted); font-size:11px; flex-shrink:0; }
  .thread .sum { color:var(--muted); margin-top:3px; font-size:12.5px; line-height:1.5;
                 display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .thread .tags { display:flex; gap:5px; margin-top:6px; align-items:center; flex-wrap:wrap; }
  .tag { font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted);
         white-space:nowrap; flex-shrink:0; }
  .tag.task { background:var(--warn); color:#fff; border-color:var(--warn); font-weight:700; }
  .tag.who { color:var(--fg); border-color:var(--accent); }
  .gf { position:relative; display:inline-block; }
  .gfbox { position:absolute; z-index:30; top:100%; left:0; margin-top:4px; width:320px; max-width:80vw;
           background:var(--card); border:1px solid var(--line); border-radius:8px;
           box-shadow:0 6px 20px rgba(0,0,0,.14); padding:8px; }
  .gfbox input[type=text] { width:100%; margin-bottom:6px; box-sizing:border-box; }
  .gflist { max-height:320px; overflow:auto; }
  .gfi { display:flex; gap:6px; align-items:center; padding:3px 2px; font-size:13px; cursor:pointer; }
  .gfi span:first-of-type { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gfi .n { color:var(--muted); font-size:11px; }
  .gfall { border-bottom:1px solid var(--line); margin-bottom:4px; padding-bottom:6px; }
  .tag.done { opacity:.5; }

  #detail { display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden; }
  .dhead { padding:9px 14px; border-bottom:1px solid var(--line); background:var(--card); display:flex;
           align-items:center; gap:9px; flex-shrink:0; }
  .dhead .back { display:none; }
  @media (max-width:820px) { .dhead .back { display:block; } }
  /* flex の子は既定で中身より狭くならない。min-width:0 がないと ellipsis が効かない。 */
  .dhead b { font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
             min-width:0; flex:0 1 auto; }
  .dhead .sp { flex:1; }

  #msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:9px; }
  .msg { max-width:min(560px, 80%); padding:9px 13px; border-radius:14px; line-height:1.65; white-space:pre-wrap;
         font-size:var(--msgfs, 15px);
         word-break:break-word; }
  .msg.in { background:var(--in); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px; }
  .msg.out { background:var(--out); align-self:flex-end; border-bottom-right-radius:4px; }
  .msg img { max-width:100%; border-radius:8px; display:block; margin-bottom:5px; }
  .meta { font-size:10.5px; color:var(--muted); margin-top:4px; }
  .filecard { display:flex; gap:7px; margin-top:7px; flex-wrap:wrap; }

  .sit { border-bottom:1px solid var(--line); background:var(--card); flex-shrink:0; }
  .sit > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; flex-wrap:nowrap;
                   padding:5px 14px; font-size:11.5px; color:var(--muted); overflow:hidden; white-space:nowrap; }
  .sit > summary::-webkit-details-marker { display:none; }
  .sit .sitk { font-weight:700; color:var(--fg); }
  .sit .sitv { overflow:hidden; text-overflow:ellipsis; }
  .sit .sitmore { margin-left:auto; color:var(--accent); }
  .sit[open] .sitmore { visibility:hidden; }
  .sit .routebar, .sit .leadbar, .sit .dest { border-top:1px solid var(--line); }
  .panel { border-top:1px solid var(--line); background:var(--card); padding:6px 12px;
           flex-shrink:0; min-width:0; }
  .tabs { display:flex; gap:2px; margin-bottom:5px; }
  .tabs button { border:0; background:transparent; color:var(--muted); font-size:12px; font-weight:600;
                 padding:3px 9px; border-radius:6px; cursor:pointer; }
  .tabs button.on { background:var(--bg); color:var(--fg); }

  textarea { width:100%; min-height:60px; padding:8px 10px; font-size:14px; font-family:inherit; resize:vertical;
             border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--fg); line-height:1.65; }
  input[type=text] { flex:1; min-width:140px; padding:8px 11px; font-size:14px; border:1px solid var(--line);
                     border-radius:8px; background:var(--bg); color:var(--fg); }
  .row { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
  .row.main { margin-top:5px; }
  .row.main .sp { flex:1; }
  button.act { border:1px solid var(--line); background:var(--bg); color:var(--fg); padding:8px 13px;
               border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; }
  button.act.on { background:var(--fg); color:var(--card); border-color:var(--fg); }
  button.go { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.act:disabled { opacity:.5; cursor:default; }

  /* 返信の道具。文字で並べると本文欄が押し潰されるのでアイコンにする。
     送信だけは文字のまま残す。押すと取り消せない唯一のボタンなので、
     アイコンにして間違って押させるわけにはいかない。 */
  button.act.ico { padding:5px; width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; }
  button.act.ico svg { width:15px; height:15px; fill:none; stroke:currentColor;
                       stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  button.act.ico.on svg { stroke:var(--card); }

  .drawer { display:none; margin-top:8px; padding:9px; border:1px solid var(--line); border-radius:9px;
            background:var(--bg); }
  .drawer.open { display:block; }
  .emoji { display:flex; gap:2px; flex-wrap:wrap; }
  .emoji button { border:0; background:transparent; font-size:20px; line-height:1; padding:4px 5px;
                  border-radius:6px; cursor:pointer; }
  .emoji button:hover { background:var(--card); }
  .keep { margin-top:9px; padding:9px 11px; border:1px solid var(--line); border-radius:9px;
          background:var(--bg); font-size:13px; }
  .keep b { display:block; margin-bottom:5px; }
  .keep .q { color:var(--muted); margin-bottom:7px; word-break:break-all; }
  .ask { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex;
         align-items:center; justify-content:center; padding:18px; z-index:60; }
  .askbox { background:var(--card); border:1px solid var(--line); border-radius:12px;
            padding:16px; max-width:420px; width:100%; }
  .askbox p { margin:0 0 13px; white-space:pre-wrap; line-height:1.6; }
  .askbox .row { justify-content:flex-end; }
  .askbox .fills { display:flex; flex-direction:column; gap:8px; margin:0 0 12px; }
  .askbox .fill { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:3px; }
  .askbox .fill input { font-size:14px; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
                        background:var(--bg); color:var(--fg); }
  .dg h3 { font-size:13px; color:var(--muted); margin:16px 0 7px; font-weight:600; }
  .dg .lead { font-size:15px; line-height:1.7; padding:12px 14px; border-radius:9px;
              background:var(--bg); border-left:3px solid var(--accent); }
  .dg .row2 { display:flex; gap:9px; align-items:flex-start; padding:8px 0;
              border-bottom:1px solid var(--line); }
  .dg .due { flex-shrink:0; font-size:11px; padding:1px 7px; border-radius:999px;
             border:1px solid var(--line); color:var(--muted); margin-top:2px; min-width:66px; text-align:center; }
  .dg .due.over { border-color:#d33; color:#d33; font-weight:600; }
  .dg .who { font-weight:600; }
  .dg .what { color:var(--muted); font-size:13px; }
  /* 振り分けの帯。タブを切り替えても見えるよう、やりとりの上に置く。
     Jevが何と見て、どのモデルで用意したのか（あるいは、なぜ用意しなかったのか）。 */
  .routebar { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
              padding:7px 14px; border-bottom:1px solid var(--line);
              background:var(--card); font-size:11.5px; color:var(--muted); flex-shrink:0; }
  .routebar .arrow { opacity:.5; }

  .prep { margin:0 0 10px; padding:10px 12px; border:1px solid var(--line);
          border-left:3px solid var(--accent); border-radius:8px; background:var(--bg); font-size:13px; }
  .prep .head { font-size:11px; color:var(--muted); margin-bottom:6px; }
  /* 外から届いた送信セット。送る前に、全部がここで見える。 */
  .pset { margin:0 0 10px; padding:12px; border:2px solid var(--go, #06c755); border-radius:12px; background:var(--card); }
  .pset .head { font-weight:700; margin-bottom:2px; }
  .pset .sub { font-size:12px; color:var(--muted); margin-bottom:9px; }
  .pset .it { display:flex; gap:9px; align-items:flex-start; padding:8px 0; border-top:1px dashed var(--line); }
  .pset .no { flex:0 0 22px; height:22px; border-radius:50%; background:var(--line); display:grid; place-items:center; font-size:12px; font-weight:700; }
  .pset .it.sent { opacity:.55; } .pset .it.failed .no { background:#e5484d; color:#fff; }
  .pset .st { font-size:11px; color:var(--muted); margin-left:auto; white-space:nowrap; }
  .pset textarea { width:100%; min-height:96px; height:96px; }
  .pset .big { max-height:132px; max-width:100%; border-radius:8px; border:1px solid var(--line); display:block; }
  /* 返信の欄は中身に合わせて伸び、外側ははみ出しを切る。カードが画面より高いと
     下のファイルと送信ボタンが見えなくなるので、カードの中で流し、ボタンは下に貼り付ける。 */
  .pset { max-height:56vh; overflow-y:auto; padding-bottom:0; }
  .pset .files { display:flex; flex-wrap:wrap; gap:10px; padding:8px 0; border-top:1px dashed var(--line); }
  .pset .fi { width:104px; } .pset .fi.sent { opacity:.55; } .pset .fi.failed .no { background:#e5484d; color:#fff; }
  .pset .fi .cap { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .pset .fi .sub { word-break:break-all; font-size:11px; }
  .pset .fi .doc { display:block; padding:14px 6px; border:1px solid var(--line); border-radius:8px; text-align:center; font-size:12px; }
  .pset .foot { display:flex; gap:9px; align-items:center; margin-top:4px; flex-wrap:wrap;
    position:sticky; bottom:0; background:var(--card); padding:9px 0 11px; border-top:1px solid var(--line); }
  .prep .plan { line-height:1.65; }
  .prep .fix { margin-top:7px; }
  .dest { padding:7px 14px 9px; border-bottom:1px solid var(--line); font-size:12.5px; }
  .dest .dhint { margin-bottom:6px; }
  .dest .why { color:var(--muted); margin-left:8px; }
  .dest .dbtns { display:flex; flex-wrap:wrap; gap:6px; }
  .dest .chip, .dform .chip { border:1px solid var(--line); background:var(--card); border-radius:14px;
                  padding:4px 11px; font-size:12px; cursor:pointer; }
  .dest .chip.on, .dform .chip.on { background:var(--fg); color:var(--card); border-color:var(--fg); }
  .dform:empty { display:none; }
  .dform { margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .dform .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .dform input[type=text] { flex:1; min-width:120px; }
  .subtabs { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:2px 0 8px; }
  .subtabs .sp { flex:1; }
  .subtabs .chip, .task .chip { border:1px solid var(--line); background:var(--card); border-radius:14px;
                  padding:2px 10px; font-size:11.5px; cursor:pointer; }
  .subtabs .chip.on, .task .chip.on { background:var(--fg); color:var(--card); border-color:var(--fg); }
  .task > span .tag { display:inline-block; width:auto; margin-left:6px; }
  .task .nx { display:inline-flex; gap:6px; margin-left:8px; vertical-align:middle; }
  .task .nx select { padding:1px 4px; font-size:11.5px; }
  .load { margin:2px 0 6px; font-weight:600; }
  .load.over { color:#c62828; }
  .feat { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .leadbar { display:flex; flex-wrap:wrap; align-items:center; gap:6px 9px; padding:6px 14px;
             font-size:12px; border-bottom:1px solid var(--line); }
  .leadbar .story { color:var(--muted); flex-basis:100%; }
  .leadbar.ask1 { background:#fff8e1; }
  .leadbar .chip { border:1px solid var(--line); background:var(--bg); border-radius:12px;
                   padding:2px 9px; font-size:11.5px; cursor:pointer; }
  .lnk { border:0; background:transparent; color:var(--accent); cursor:pointer;
         font-size:11.5px; padding:0; text-decoration:underline; }
  .prep .fix > button { border:0; background:transparent; color:var(--muted);
                        font-size:11.5px; cursor:pointer; padding:0; text-decoration:underline; }
  .prep .fixbox { display:none; margin-top:7px; }
  .prep .fixbox.open { display:block; }
  .prep .fixbox textarea { width:100%; min-height:56px; padding:7px 9px; font-size:13px;
                           border:1px solid var(--line); border-radius:8px;
                           background:var(--bg); color:var(--fg); font-family:inherit; line-height:1.6; }
  .prep .tk { display:flex; gap:7px; align-items:flex-start; margin-top:8px; }
  .prep .tk .by { flex-shrink:0; font-size:10px; padding:1px 6px; border-radius:999px;
                  border:1px solid var(--line); color:var(--muted); margin-top:2px; }
  .prep .tk .by.human { border-color:var(--accent); color:var(--accent); }
  .prep .tk .how { color:var(--muted); font-size:12px; }
  /* 判断が要る件の問い。答えると残るメモに入って、次からはその前提で書く。 */
  .ask { margin:0 0 10px; padding:10px 12px; border:1px solid var(--accent);
         border-radius:10px; background:var(--card); }
  .ask .head { font-size:11px; color:var(--accent); margin-bottom:8px; font-weight:700; }
  .ask .q { margin-top:9px; }
  .ask .q:first-of-type { margin-top:0; }
  .ask .q label { display:block; font-size:13px; line-height:1.6; }
  .ask .q .why { color:var(--muted); font-size:11.5px; margin-top:2px; }
  .ask .q input { width:100%; margin-top:5px; padding:6px 9px; font-size:13px;
                  border:1px solid var(--line); border-radius:7px;
                  background:var(--bg); color:var(--fg); }
  .ask .foot { margin-top:10px; display:flex; align-items:center; gap:9px; }
  .ask .foot .hint { margin:0; }
  /* 一覧から直接アーカイブする。会話を開かないと押せないのでは、
     溜まったものを片付けるのに使えない。 */
  .thread .arch { border:0; background:transparent; color:var(--muted); cursor:pointer;
                  padding:2px 4px; margin-left:4px; border-radius:6px; line-height:0;
                  opacity:0; transition:opacity .12s; flex-shrink:0; align-self:center; }
  .thread:hover .arch, .thread .arch:focus { opacity:.75; }
  .thread .arch:hover { opacity:1; background:var(--bg); color:var(--fg); }
  .thread .arch svg { width:15px; height:15px; fill:none; stroke:currentColor;
                      stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  @media (hover: none) { .thread .arch { opacity:.6; } }
  /* 直され方から出てきた、きまりの候補。自動では入れない。 */
  .cand { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .cand .head { font-size:11px; color:var(--muted); margin-bottom:8px; font-weight:700; }

  /* 今日、自動で外したもの。隠した事実そのものを見せる場所。 */
  .quiet.warn { background:#fff4e5; color:#8a4b00; }
  .calnote { padding:5px 14px; font-size:12px; background:var(--card); border-bottom:1px solid var(--line); color:var(--muted); }

  .jev { display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:2px 7px;

  .pset .chip { border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:14px;

         cursor:pointer; }
  .opt:hover { border-color:var(--accent); }
  .opt .label { font-size:11.5px; font-weight:700; color:var(--accent); margin-bottom:4px; }

  .tones button:hover { border-color:var(--fg); color:var(--fg); }
  .tones button:disabled { opacity:.45; cursor:default; }
  .hint { color:var(--muted); font-size:11px; margin-top:4px; }
  .hint.oneline { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panel .row.main button.act:not(.ico) { padding:6px 11px; font-size:12.5px; }
  .empty { color:var(--muted); padding:44px 20px; text-align:center; }
  .task { display:flex; gap:9px; align-items:flex-start; padding:7px 0; border-bottom:1px solid var(--line); }
  .task.done span { text-decoration:line-through; color:var(--muted); }
  .task .x { margin-left:auto; border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:15px; }

  header h1, header nav button { white-space:nowrap; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--fg);
           color:var(--card); padding:10px 16px; border-radius:10px; font-size:13px; display:none;

                  font-size:13px; padding:0; }

<script>
var CFG = {"owner":"湊","aliases":[],"staff":["内田 千尋"]};
// 本人（とその別名）かどうか。担当の候補から外すのに使う。
function isMe(name) {
  if (!name) return false;
  if (CFG.owner && name.indexOf(CFG.owner) >= 0) return true;
  return CFG.aliases.indexOf(name) >= 0;
}
var $ = function (s, r) { return (r || document).querySelector(s); };
var state = { threads: [], tasks: [], categories: [], tones: [], accounts: [], account: "",
              status: "todo", taskSide: "mine", category: "", channel: "", current: null, hits: null,
              tab: "inbox", panel: "reply", drawer: "" };

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function when(ms) {
  var d = new Date(ms), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleDateString("ja-JP", { month: "numeric", day: "numeric" });
}

var toastTimer = null;
function toast(text, actionLabel, action) {
  $("#toastText").textContent = text;
  var b = $("#toastAct");
  if (actionLabel) {
    b.textContent = actionLabel; b.style.display = "";
    b.onclick = function () { hideToast(); action(); };
  } else { b.style.display = "none"; }
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 8000 : 3000);
}
function hideToast() { $("#toast").classList.remove("show"); }

// 通信の失敗をここで受け止める。投げっぱなしにすると、呼んだ側の
// 「ボタンを元に戻す」処理まで届かず、押せないまま固まる。実際に固まった。
// 失敗は必ず { error } として返し、null は返さない。
// 確認は画面の中で出す。ブラウザ標準の confirm はこの枠だと表示されず、
// 黙って「いいえ」になる。それで送信が何も起きないまま止まった。
function ask(msg, okLabel) {
  return new Promise(function (resolve) {
    var w = document.createElement("div");
    w.className = "ask";
    w.innerHTML = '<div class="askbox"><p></p><div class="row">'
      + '<button class="act" data-no>やめる</button>'
      + '<button class="act go" data-yes></button></div></div>';
    w.querySelector("p").textContent = msg;
    w.querySelector("[data-yes]").textContent = okLabel || "このまま進める";
    w.onclick = function (ev) {
      if (ev.target.closest("[data-yes]")) { w.remove(); resolve(true); }
      else if (ev.target.closest("[data-no]") || ev.target === w) { w.remove(); resolve(false); }
    };
    document.body.appendChild(w);
    w.querySelector("[data-yes]").focus();
  });
}

// 空欄を聞いて埋める画面（2026-09-23）。
// ［〇月〇日］のような未記入は、送る直前にここで聞く。止めて戻らせるより早い。
// fields: [{ label, value }]。やめたら null、埋めたら値の配列を返す。
function askFill(msg, fields, okLabel) {
  return new Promise(function (resolve) {
    var w = document.createElement("div");
    w.className = "ask";
    w.innerHTML = '<div class="askbox"><p></p><div class="fills"></div><div class="row">'
      + '<button class="act" data-no>やめる</button>'
      + '<button class="act go" data-yes></button></div></div>';
    w.querySelector("p").textContent = msg;
    w.querySelector("[data-yes]").textContent = okLabel || "埋めて進む";
    var box = w.querySelector(".fills");
    fields.forEach(function (f, i) {
      var lab = document.createElement("label");
      lab.className = "fill";
      lab.textContent = f.label;
      var inp = document.createElement("input");
      inp.type = "text";
      inp.value = f.value || "";
      inp.dataset.i = String(i);
      lab.appendChild(inp);
      box.appendChild(lab);
    });
    function done(ok) {
      var vals = ok ? Array.prototype.map.call(box.querySelectorAll("input"), function (x) { return x.value; }) : null;
      w.remove(); resolve(vals);
    }
    w.onclick = function (ev) {
      if (ev.target.closest("[data-yes]")) done(true);
      else if (ev.target.closest("[data-no]") || ev.target === w) done(false);
    };
    w.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); done(true); }
      if (ev.key === "Escape") done(false);
    });
    document.body.appendChild(w);
    var first = box.querySelector("input");
    if (first) first.focus();
  });
}

// 本文の［ ］を順に聞いて埋める。やめたら null。空で進めた欄は［ ］を消す。
async function fillHoles(text) {
  var holes = text.match(/［[^］]*］/g);
  if (!holes) return text;
  var uniq = holes.filter(function (h, i) { return holes.indexOf(h) === i; });
  var vals = await askFill("まだ埋まっていないところがあります。中身を入れてください。"
    + String.fromCharCode(10) + "空のまま進めると、その［ ］は消します。",
    uniq.map(function (h) { return { label: h.slice(1, -1) || "（空欄）", value: "" }; }), "埋めて進む");
  if (!vals) return null;
  var out = text;
  uniq.forEach(function (h, i) { out = out.split(h).join(vals[i].trim()); });
  return out;
}

async function api(path, opts) {
  var o = opts || {};
  o.headers = Object.assign({ "Content-Type": "application/json" }, o.headers || {});
  var r;
  try {
    r = await fetch("/inbox/api" + path, o);
  } catch (e) {
    return { error: "通信できませんでした。電波かネットワークを確かめて、もう一度押してください。" };
  }
  if (r.status === 401) { location.href = "/inbox"; return null; }
  try {
    return await r.json();
  } catch (e) {
    return { error: "サーバーの応答を読めませんでした（" + r.status + "）。もう一度お試しください。" };
  }
}

async function loadList() {
  var d = await api("/threads");
  if (!d || d.error) return;
  state.threads = d.threads; state.tasks = d.tasks; state.categories = d.categories;
  state.tones = d.tones || [];
  state.accounts = d.accounts || [];
  state.features = d.features || {};
  // 見出しの数は自分がやることだけ。やってもらうことまで数えると、自分の残りが分からない。
  var mineN = d.tasks.filter(function (k) { return k.side !== "theirs"; }).length;
  $("#taskCount").textContent = String(mineN);
  var waitN = d.tasks.length - mineN;
  $("#waitCount").textContent = String(waitN);
  renderFilters(); renderList(); renderQuiet(); renderCalBar(); renderOpsBar(); renderHealth();
}

/**
 * 今日、自動で外したものを件数で出す。
 *
 * 自動で隠す以上、何件隠したかが見えていないと、間違って隠しても気づけない。
 * 開けば相手と抜粋が並び、押せば要対応に戻る。
 */
// 取り込みが止まっていないか。静かな日と、止まった日を区別するため（2026-09-23）。
async function renderHealth() {
  var bar = $("#healthbar");
  if (!bar) return;
  var d = await api("/health");
  var warn = (d && d.warn) || [];
  if (!warn.length) { bar.style.display = "none"; return; }
  bar.style.display = "";
  bar.innerHTML = "<span>⚠ " + warn.map(esc).join(" ／ ") + "</span>";
}

// 今日の自動処理。AIが自分で決めたこと・外したことを1本の帯にまとめる（2026-09-23）。
// 別々の帯が3本並んでいて読まれなかった。自動でやるなら、やった事実が見えていないと間違いに気づけない。
// 種類ごとの件数は開かなくても見せ、中で1件ずつ取り消せる。取り込みの異常（healthbar）とは混ぜない。
var OPKIND = { close: "完了にした", move: "やってもらうことへ移した", revise: "書き直した" };
var DESTNAME = { noreply: "返信不要", mine: "自分がやる", assign: "振る", wait: "相手待ち" };
state.auto = { quiet: [], ops: [], cal: [], asks: [], dest: [] };
state.autoOpen = false;
// 自動でカレンダーに入れたもの。入れた事実が見えていないと、間違いに気づけない。
var CAL = null;
async function loadCal() {
  var d = await api("/calendar/auto");
  CAL = (d && d.entries) || [];
  return CAL;
}
function calWhen(e) {
  var wd = "日月火水木金土";
  var d = new Date(e.start + ":00+09:00");
  return (d.getMonth() + 1) + "/" + d.getDate() + "(" + wd.charAt(d.getDay()) + ") "
    + e.start.slice(11, 16) + "〜" + e.end.slice(11, 16);
}
async function undoCal(eventId) {
  if (!(await ask("カレンダーからこの予定を取り消しますか？", "取り消す"))) return;
  var r = await api("/calendar/auto/undo", { method: "POST", body: JSON.stringify({ eventId: eventId }) });
  if (!r || r.error) { toast((r && r.error) || "取り消せませんでした"); return; }
  toast("カレンダーから取り消しました");
  await loadCal(); renderCalBar();
  var n = $("#calNote"); if (n) n.innerHTML = "";
}
var autoTimer = null;
function renderAutoAll() {
  // 一覧を読み直すたびに何度も呼ばれるので、まとめて1回にする。
  clearTimeout(autoTimer);
  autoTimer = setTimeout(fetchAuto, 60);
}
function renderQuiet() { renderAutoAll(); }
function renderOpsBar() { renderAutoAll(); }
function renderCalBar() { renderAutoAll(); }
async function fetchAuto() {
  var day = 24 * 3600000;
  var res = await Promise.all([
    api("/quieted"), api("/task-ops"), loadCal(), api("/calendar/asks"), api("/auto-dest")
  ]);
  state.auto = {
    quiet: (res[0] && res[0].threads) || [],
    ops: ((res[1] && res[1].ops) || []).filter(function (o) { return !o.undone && Date.now() - o.at < day; }),
    cal: (res[2] || []).filter(function (e) { return !e.undone && Date.now() - e.at < 3 * day; }),
    asks: (res[3] && res[3].asks) || [],
    dest: ((res[4] && res[4].ops) || []).filter(function (o) { return !o.undone && Date.now() - o.at < day; })
  };
  drawAuto();
}
function drawAuto() {
  var bar = $("#autobar"), list = $("#autolist");
  if (!bar) return;
  var A = state.auto;
  var parts = [];
  if (A.asks.length) parts.push("<b>カレンダー確認待ち " + A.asks.length + "件</b>");
  if (A.dest.length) parts.push("行き先を決めた " + A.dest.length + "件");
  if (A.ops.length) parts.push("やることを片付けた " + A.ops.length + "件");
  if (A.quiet.length) parts.push("一覧から外した " + A.quiet.length + "件");
  if (A.cal.length) parts.push("予定に入れた " + A.cal.length + "件");
  if (state.status !== "todo" || !parts.length) { bar.style.display = "none"; list.style.display = "none"; return; }
  bar.style.display = "";
  bar.innerHTML = "<span>今日の自動処理：" + parts.join("・") + "</span>"
    + '<div style="flex:1"></div><button id="autoToggle">' + (state.autoOpen ? "閉じる" : "確認") + "</button>";
  $("#autoToggle").onclick = function () { state.autoOpen = !state.autoOpen; drawAuto(); };
  if (!state.autoOpen) { list.style.display = "none"; return; }
  list.style.display = "";
  function sec(title, rows) { return rows ? '<div class="qh">' + title + "</div>" + rows : ""; }
  function row(main, sub, who, btn) {
    return '<div class="q"><div class="t"><b>' + main + "</b><span>" + sub + "</span></div>"
      + '<div class="x">' + who + "</div>" + btn + "</div>";
  }
  list.innerHTML =
    sec("カレンダーに入れるか確認", A.asks.map(function (q, i) {
      return row(esc(q.title), esc(String(q.start || "").replace("T", " ").slice(0, 16)) + (q.missing ? "・" + esc(q.missing) : ""),
        esc(shortName(q.name)), '<button data-ask="' + i + '">確認する</button>');
    }).join(""))
    + sec("AIが行き先を決めたもの", A.dest.map(function (o) {
      return row(esc(DESTNAME[o.kind] || o.kind) + (o.who ? "（" + esc(o.who) + "）" : ""),
        esc(o.task || "") + (o.reason ? "・" + esc(o.reason) : ""),
        esc(shortName(o.thread)), '<button data-dundo="' + esc(o.id) + '">取り消す</button>');
    }).join(""))
    + sec("AIが片付けたやること", A.ops.map(function (o) {
      return row(esc(o.title), esc(OPKIND[o.kind] || o.kind) + (o.newTitle ? " → " + esc(o.newTitle) : "") + "・" + esc(o.why),
        esc(shortName(o.thread)), '<button data-op="' + esc(o.id) + '">取り消す</button>');
    }).join(""))
    + sec("一覧から外したもの（返事が要らないと判断）", A.quiet.map(function (r) {
      return row(esc(shortName(r.name)), esc(CHNAME[r.channel] || r.channel) + "・" + esc(String(r.preview || "").slice(0, 60)),
        "", '<button data-back="' + esc(r.id) + '">対応が必要</button>');
    }).join(""))
    + sec("カレンダーに入れた予定", A.cal.map(function (e) {
      return row(esc(e.title), esc(calWhen(e)) + (e.moved ? "・日時を変更" : ""),
        esc(shortName(e.name)), '<button data-undo="' + esc(e.eventId) + '">取り消す</button>');
    }).join(""));
  list.onclick = async function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    var r = null;
    if (b.dataset.ask !== undefined) { await calPopup(A.asks[+b.dataset.ask]); return; }
    if (b.dataset.undo) { undoCal(b.dataset.undo); return; }
    b.disabled = true;
    if (b.dataset.dundo) r = await api("/auto-dest/undo", { method: "POST", body: JSON.stringify({ id: b.dataset.dundo }) });
    else if (b.dataset.op) r = await api("/task-ops/undo", { method: "POST", body: JSON.stringify({ id: b.dataset.op }) });
    else if (b.dataset.back) r = await api("/status", { method: "POST", body: JSON.stringify({ id: b.dataset.back, status: "open" }) });
    if (!r || r.error) { b.disabled = false; toast((r && r.error) || "戻せませんでした"); return; }
    toast(b.dataset.back ? "要対応に戻しました" : "取り消しました");
    await loadList();
  };
}

// 日程が決まったら、ポップアップで聞いてから入れる（2026-09-23、黙って入れるのをやめた）。
// ［やめる］で入れない（聞いたものは消える）。日時は直してから入れられる。
state.calAsked = {};
async function calPopup(q) {
  if (!q) return;
  var nl = String.fromCharCode(10);
  var sp = function (v) { return String(v || "").replace("T", " ").slice(0, 16); };
  var noTime = !!q.missing && /T00:00/.test(q.start || "");
  var v = await askFill("日程が決まったようです。カレンダーに入れますか？" + nl
    + "会話：" + shortName(q.name) + nl
    + (q.basis ? "根拠：" + q.basis + nl : "")
    + (q.missing ? "※" + q.missing + "。直してから入れてください。" + nl : "")
    + "入れない場合は［やめる］。",
    [{ label: "件名", value: q.title || "" },
     { label: "開始（例 2026-09-28 15:00）", value: noTime ? sp(q.start).slice(0, 10) + " " : sp(q.start) },
     { label: "終了", value: noTime ? sp(q.end).slice(0, 10) + " " : sp(q.end) },
     { label: "場所・URL", value: q.location || "" }], "カレンダーに入れる");
  if (!v) {
    await api("/calendar/ask?id=" + encodeURIComponent(q.threadId), { method: "DELETE" });
    toast("カレンダーには入れませんでした");
    renderAutoAll();
    return;
  }
  var r = await api("/calendar/ask", { method: "POST", body: JSON.stringify({
    id: q.threadId, title: v[0].trim(), start: v[1], end: v[2], location: v[3].trim() }) });
  if (!r || r.error) { toast((r && r.error) || "入れられませんでした"); return; }
  toast("カレンダーに入れました");
  renderAutoAll();
}
// 置き換えられた書きかけを、あとからでも戻せるようにする。
function renderPrevNote(t) {
  var box = $("#prevNote");
  if (!box) return;
  var raw = null;
  try { raw = localStorage.getItem("prev:" + t.id); } catch (e) {}
  var p = raw ? JSON.parse(raw) : null;
  if (!p || Date.now() - p.at > 24 * 3600000) { box.innerHTML = ""; return; }
  box.innerHTML = '<button class="lnk" id="prevBack">書きかけに戻す</button>';
  $("#prevBack").onclick = function () {
    var now = $("#reply").value;
    $("#reply").value = p.text; renderTones(); $("#reply").focus();
    try { localStorage.setItem("prev:" + t.id, JSON.stringify({ text: now, at: Date.now() })); } catch (e) {}
    renderPrevNote(t);
  };
}

async function renderCalNote(t) {
  var box = $("#calNote");
  if (!box) return;
  // 日程が決まったようなら、会話を開いたとき（送信したあとも含む）にポップアップで聞く。1件につき1回。
  var a = await api("/calendar/ask?id=" + encodeURIComponent(t.id));
  if (a && a.ask) {
    var key = t.id + ":" + a.ask.at;
    box.innerHTML = '<div class="calnote">日程が決まったようです：<b>' + esc(a.ask.title) + "</b> "
      + '<button class="lnk" id="calAskOpen">カレンダーに入れるか確認</button></div>';
    $("#calAskOpen").onclick = function () { calPopup(a.ask).then(function () { renderCalNote(t); }); };
    if (!state.calAsked[key]) { state.calAsked[key] = 1; calPopup(a.ask).then(function () { renderCalNote(t); }); }
    return;
  }
  var rows = CAL || (await loadCal());
  var e = rows.filter(function (x) { return x.threadId === t.id && !x.undone && Date.now() - x.at < 7 * 86400000; })[0];
  if (!e) { box.innerHTML = ""; return; }
  box.innerHTML = '<div class="calnote">カレンダーに' + (e.moved ? "日時を変更して" : "") + "入れました："
    + "<b>" + esc(calWhen(e)) + "</b> " + esc(e.title)
    + ' <button class="lnk" id="calUndo">取り消す</button></div>';
  $("#calUndo").onclick = function () { undoCal(e.eventId); };
}

var CHNAME = { line: "LINE", chatwork: "チャット", gmail: "メール",
               messenger: "メッセンジャー", minutes: "議事録" };

function renderFilters() {
  var states = [["todo", "要対応"], ["task", "タスク"], ["archived", "アーカイブ"], ["all", "すべて"]];
  $("#states").innerHTML = states.map(function (s) {
    var n = s[0] === "todo" ? state.threads.filter(function (t) { return dueWaits(t.id) > 0 || t.status === "open"; }).length
          : s[0] === "archived" ? state.threads.filter(function (t) { return t.status === "done"; }).length : 0;
    return '<button data-s="' + s[0] + '" class="' + (state.status === s[0] ? "on" : "") + '">' + s[1]
      + (n ? '<span class="n">' + n + "</span>" : "") + "</button>";
  }).join("")
    // タスクは自分と他人で分ける。自分のぶんが終われば自分の仕事は終わり。
    // 他人のぶんは念のため進み具合を見る場所。
    + (state.status === "task"
        ? '<div style="grid-column:1/-1;display:flex;gap:6px">'
          + [["mine", "自分", countSide("mine")], ["theirs", "他人", countSide("theirs")]].map(function (x) {
              return '<button data-ts="' + x[0] + '" style="flex:1" class="' + (state.taskSide === x[0] ? "on" : "") + '">'
                + x[1] + '<span class="n">' + x[2] + "</span></button>";
            }).join("")
          + "</div>"
        : "");
  $("#states").onclick = function (e) {
    var ts = e.target.closest("[data-ts]");
    if (ts) { state.taskSide = ts.dataset.ts; renderFilters(); renderList(); return; }
    var b = e.target.closest("[data-s]"); if (!b) return;
    state.status = b.dataset.s; renderFilters(); renderList(); renderQuiet();
  };

  // 経路は、いま受信箱にあるものだけを出す。件数は絞り込み前の全体で数える。
  var CH = [["line", "LINE"], ["chatwork", "チャット"], ["gmail", "メール"],
            ["messenger", "メッセンジャー"], ["minutes", "議事録"]];
  var box = $("#channels");
  // 経路の件数は、いまの欄に出ているものを数える。
  // 欄と数が食い違うと、押しても0件という行き止まりができる。
  var pool = state.threads.filter(function (t) {
    if (state.status === "todo") return dueWaits(t.id) > 0 || t.status === "open";
    if (state.status === "task") return sideTasks(t.id, state.taskSide) > 0;
    // 片付いたものは全部ここ。手で仕舞ったものも、返信して自動で落ちたものも。
    // アーカイブ＝片付けたものを念のため確認する欄。消し込むとここから消える（［すべて］には残る）。
    if (state.status === "archived") return t.status === "done" && !t.hold_until;
    return true;
  });
  // LINE・チャット・メール・議事録は、0件でも出しておく。あるか無いかが一目で分かるように。
  // メッセンジャーは繋いでいないので、入っているときだけ出す。
  var have = CH.filter(function (c) {
    return c[0] !== "messenger" || pool.some(function (t) { return t.channel === c[0]; });
  });
  // 選んだ経路がこの欄に無いなら、絞り込みを解く。
  // 残したままにすると、0件なのに行ごと消えて、
  // なぜ出ないのかも、どう戻すのかも分からなくなる。
  if (state.channel && !have.some(function (c) { return c[0] === state.channel; })) {
    state.channel = "";
  }
  if (have.length) {
    box.style.display = "";
    box.innerHTML = '<button data-c="" class="' + (state.channel ? "" : "on") + '">すべて</button>'
      + have.map(function (c) {
          var n = pool.filter(function (t) { return t.channel === c[0]; }).length;
          return '<button data-c="' + c[0] + '" class="' + (state.channel === c[0] ? "on" : "") + '">'
            + c[1] + '<span class="n">' + n + "</span></button>";
        }).join("");
    box.onclick = function (e) {
      var b = e.target.closest("[data-c]"); if (!b) return;
      state.channel = b.dataset.c; renderFilters(); renderList();
    };
  } else {
    box.style.display = "none";
  }

  var acc = $("#account");
  if (state.accounts.length > 1) {
    acc.style.display = "";
    acc.innerHTML = '<option value="">アカウント：すべて</option>'
      + state.accounts.map(function (a) {
          return '<option value="' + esc(a.id) + '">' + esc(a.label) + "</option>";
        }).join("");
    acc.value = state.account;
    acc.onchange = function () { state.account = acc.value; renderList(); };
  } else {
    acc.style.display = "none";
  }

  var sel = $("#category");
  sel.innerHTML = '<option value="">区分：すべて</option>'
    + state.categories.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + "</option>"; }).join("");
  sel.value = state.category;
  sel.onchange = function () { state.category = sel.value; renderList(); };
}

/**
 * 一覧と見出しに出す名前。
 *
 * LINEのグループに名前が付いていないと、メンバー全員の並びがそのまま名前になる。
 * 「穐山　功祐, 東恩納巧 TAKUMI HIGAONNA, 五味田匡功, masayosii」のように長く、
 * 幅を食うわりに誰との話か分かりにくい。先頭ひとりと人数に畳む。
 */
// グループ名は「参加者の名前の列」で届く。本人（五味田匡功・masayosii）を先頭に出すと、
// どの会話も「五味田匡功 ほか2名」になって見分けがつかなかった（鈴木516さんの資料が見つからなかった、2026-09-23）。
// 本人を外し、相手の名前を先に出す。
function shortName(name) {
  var s = String(name || "").trim();
  if (!s) return "名称未取得";
  var parts = s.split(/,s*/).map(function (x) { return x.trim(); }).filter(Boolean);
  if (parts.length < 2) return s;
  var others = parts.filter(function (x) { return !isMe(x); });
  if (!others.length) return s;
  var joined = others.join("、");
  if (joined.length <= 22) return joined;
  return others[0] + " ほか" + (others.length - 1) + "名";
}

function accountLabel(id) {
  var a = state.accounts.filter(function (x) { return x.id === id; })[0];
  return a ? a.label : id;
}

/**
 * その会話に、まだ片付いていない「やること」が登録されているか。
 *
 * AIの仕分け（has_task）ではなく、**人が登録したもの**で見る。
 * 要対応の欄で1件ずつ見て、やることに振り分けたらタスクの欄へ移る、
 * という流れにするため。AIが「やることを含む」と見ただけでは動かさない。
 */
// 自分のぶん（mine）か、他人に頼んでいるぶん（theirs）か。他人のぶんは期日前も数える。
function sideTasks(id, side) {
  return state.tasks.filter(function (k) {
    return k.thread_id === id && !k.done && (side === "theirs" ? k.side === "theirs" : k.side !== "theirs");
  }).length;
}
function countSide(side) {
  return state.threads.filter(function (t) { return sideTasks(t.id, side) > 0; }).length;
}

function openTasks(id) {
  return state.tasks.filter(function (k) { return k.thread_id === id && !k.done; }).length;
}

// 自分が動くぶん。登録したらすぐ要対応に出る。
function myTasks(id) {
  return state.tasks.filter(function (k) {
    return k.thread_id === id && !k.done && k.side !== "theirs";
  }).length;
}

// 相手に頼んで待っているぶん。期日が来たものだけ数える。
// 頼んだ直後から急かしても仕方がないので、期日までは出さない。
function dueWaits(id) {
  var now = Date.now();
  return state.tasks.filter(function (k) {
    return k.thread_id === id && !k.done && k.side === "theirs"
      && k.due_at && k.due_at <= now;
  }).length;
}

function waits(id) {
  return state.tasks.filter(function (k) {
    return k.thread_id === id && !k.done && k.side === "theirs";
  }).length;
}

// 「9月19日から」のような、待ち始めた日。
function since(ms) {
  var d = new Date(ms + 9 * 3600 * 1000);
  return (d.getUTCMonth() + 1) + "月" + d.getUTCDate() + "日";
}

function visible() {
  return state.threads.filter(function (t) {
    if (state.account && t.account_id !== state.account) return false;
    if (state.category && t.category !== state.category) return false;
    if (state.channel && t.channel !== state.channel) return false;
    // ── 2つの軸を分けてある ──
    //
    // 「手が要るか」（要対応・タスク）と「会話を仕舞ったか」（アーカイブ）は別の話。
    // 1列に並べていたので、やることが残ったままアーカイブしたものが
    // どちらに出るべきか決まらなかった。
    //
    // アーカイブは会話を見ないという意思表示であって、宿題が消えたという意味ではない。
    // だから「やることが残っている」ものは、仕舞っても要対応に出し続ける。

    // 要対応 … 押して移すものではなく、次のどれかで自動的に決まる。
    //   ・まだ返していない（Jevが返信要と見て、その受信に返事をしていない）
    //   ・やることが残っている
    // 返せば消え、片付ければ消える。仕分けのボタンは要らない。
    if (state.status === "todo") {
      // 要対応は「まだ返していない」か「催促どき」のどちらか。
      //
      // 自分のやることが残っていても、ここには出さない。
      // 出していたときは、対応済みを押しても消えず、
      // ボタンが効いていないのと同じに見えた。
      // やることは［やること］の欄で見る。
      if (dueWaits(t.id) > 0) return true;
      return t.status === "open";
    }
    // タスク … やることが残っているものだけ。
    if (state.status === "task") return sideTasks(t.id, state.taskSide) > 0;
    // アーカイブ … 片付いたもの全部。
    // 手で仕舞ったものも、返信して自動で落ちたものもここに入る。
    // アーカイブ＝片付けたものを念のため確認する欄。消し込むとここから消える（［すべて］には残る）。
    if (state.status === "archived") return t.status === "done" && !t.hold_until;
    // すべて … 仕舞ったものも含めた全件。探す場所。
    return true;
  });
}

function renderList() {
  // 探しているあいだは、会話ではなく「見つかった行」を出す。
  if (state.hits) { renderHits(); return; }
  var rows = visible();
  $("#count").textContent = rows.length + " 件";
  // ［本日を閉じる］。未判断・期限切れ・催促どき・送っていない送信セットがゼロかを点検する。
  if (state.status === "todo" && (state.features || {}).close !== false) {
    $("#count").innerHTML = rows.length + ' 件　<button class="mini" id="closeDay">本日を閉じる</button>';
    $("#closeDay").onclick = async function () {
      var r = await api("/close-check");
      if (!r || r.error) { toast((r && r.error) || "点検できませんでした"); return; }
      var nl = String.fromCharCode(10);
      var parts = [];
      function add(label, arr) {
        if (arr && arr.length) parts.push("■" + label + "（" + arr.length + "）" + nl + arr.slice(0, 8).map(function (x) { return "・" + x; }).join(nl)
          + (arr.length > 8 ? nl + "…ほか" + (arr.length - 8) + "件" : ""));
      }
      add("行き先が決まっていない", r.open);
      add("締切を過ぎたやること", r.overdueMine);
      add("催促どきのやってもらうこと", r.dueWaits);
      add("送っていない送信セット", r.unsent);
      var hm = new Date(Date.now() + 9 * 3600e3).toISOString().slice(11, 16);
      if (!parts.length) { toast("本日 " + hm + " の時点で要対応ゼロです。お疲れさまでした"); return; }
      await ask("まだ残っています。" + nl + nl + parts.join(nl + nl), "閉じる");
    };
  }
  // 見直しの曜日には、要対応の横から見直しへ入れるようにする。
  var ff = state.features || {};
  if (state.status === "todo" && ff.weekly !== false
      && new Date(Date.now() + 9 * 3600e3).getUTCDay() === (ff.weeklyDay == null ? 5 : ff.weeklyDay)) {
    $("#count").insertAdjacentHTML("beforeend", ' <button class="mini" id="goReview">今日は週次の見直し</button>');
    $("#goReview").onclick = function () { state.todayView = "review"; $("#tabTasks").click(); state.todayView = "review"; renderAllTasks(); };
  }
  // 返信不要候補（AIが「返信不要」を勧めているもの）を、要対応の上でまとめて片付ける。
  var bulkRows = state.status === "todo" && (state.features || {}).bulk !== false
    ? rows.filter(function (t) { var dd = prepDest(t); return t.status === "open" && dd && dd.kind === "noreply"; })
    : [];
  if (bulkRows.length) {
    $("#count").insertAdjacentHTML("beforeend", ' <button class="mini" id="bulkNo" title="AIが返信不要を勧めているもの">返信不要の候補 '
      + bulkRows.length + "件をまとめてアーカイブ</button>");
    $("#bulkNo").onclick = async function (e) {
      var names = bulkRows.map(function (t) { return "・" + shortName(t.display_name); }).join(String.fromCharCode(10));
      if (!(await ask("次の" + bulkRows.length + "件を返信不要としてアーカイブします。" + String.fromCharCode(10, 10) + names
          + String.fromCharCode(10, 10) + "［アーカイブ］で念のため確認できます。", "アーカイブする"))) return;
      var mails = bulkRows.filter(function (t) { return t.channel === "gmail"; });
      var rule = false;
      if (mails.length && (state.features || {}).senderRule !== false) {
        var from = mails.map(function (t) { return String(t.display_name || "").split("｜")[0]; })
          .filter(function (v, i, a) { return a.indexOf(v) === i; });
        rule = await ask("メールの送り元（" + from.join("、") + "）を、次回から自動でアーカイブしますか？"
          + String.fromCharCode(10) + "［機能］からいつでも外せます。", "次回から自動にする");
      }
      e.currentTarget && (e.currentTarget.disabled = true);
      var r = await api("/bulk-archive", { method: "POST", body: JSON.stringify({
        ids: bulkRows.map(function (t) { return t.id; }), rule: rule }) });
      if (!r || r.error) { toast((r && r.error) || "片付けられませんでした"); return; }
      toast(r.count + "件をアーカイブしました" + (rule ? "。送り元を次回から自動にしました" : ""));
      await loadList();
    };
  }
  // アーカイブ欄では、確認し終えたものをまとめて消し込める。消し込んでも［すべて］には残る。
  if (state.status === "archived" && rows.length) {
    $("#count").innerHTML = rows.length + ' 件　<button class="mini" id="clearAll" title="いま表示している会話を、確認済みとして消し込みます">表示中をすべて消込</button>';
    $("#clearAll").onclick = async function (e) {
      var b = e.currentTarget;
      if (!(await ask(rows.length + "件を確認済みとして消し込みますか？" + String.fromCharCode(10) + "［すべて］からはいつでも見られます。", "消し込む"))) return;
      b.disabled = true;
      for (var i = 0; i < rows.length; i++) {
        await api("/status", { method: "POST", body: JSON.stringify({ id: rows[i].id, status: "archived" }) });
      }
      toast(rows.length + "件を消し込みました");
      await loadList();
    };
  }
  $("#threads").innerHTML = rows.length
    ? rows.map(function (t) {
        var nt = openTasks(t.id);
        return '<div class="thread ' + (state.current === t.id ? "on" : "") + '" data-id="' + esc(t.id) + '">'
          + '<div class="top"><span class="name" title="' + esc(t.display_name || "") + '">'
          + (t.label ? esc(t.label) + '<span class="alias">別名</span>' : esc(shortName(t.display_name))) + "</span>"
          + '<span class="when">' + when(t.last_message_at) + "</span>"
          // ［すべて］は探す場所なので、行に操作を置かない。
          // 仕舞ったものとそうでないものが混ざるので、
          // 同じ位置のボタンが行によって「仕舞う」と「戻す」で入れ替わり、
          // 探しているだけのときに押して消してしまう。
          + (state.status === "all" ? "" :
              '<button class="arch" data-arch="' + esc(t.id) + '" title="'
              + (t.status === "archived" ? "戻す" : t.status === "done" ? "消し込む（確認済み）" : "アーカイブする（念のため確認に回す）")
              + '" aria-label="アーカイブ"><svg viewBox="0 0 24 24">'
              + (t.status === "archived"
                  ? '<path d="M3 7.5h18v3H3z"/><path d="M5 10.5V20h14v-9.5"/><path d="m12 17.5-3-3M12 17.5l3-3M12 17.5v-5"/>'
                  : t.status === "done"
                  ? '<path d="m5 12.5 4.5 4.5L19 7.5"/>'
                  : '<path d="M3 4.5h18v3.5H3z"/><path d="M5 8v11.5h14V8"/><path d="M9.5 12h5"/>')
              + "</svg></button>")
          + "</div>"
          + '<div class="sum">' + esc(t.summary || t.last_preview || "") + "</div>"
          + '<div class="tags">'
          + (state.accounts.length > 1 ? '<span class="tag">' + esc(accountLabel(t.account_id)) + "</span>" : "")
          + jevTag(t)
          + (t.category ? '<span class="tag">' + esc(t.category) + "</span>" : "")
          + (myTasks(t.id) ? '<span class="tag task">やること ' + myTasks(t.id) + "</span>" : "")
          + (dueWaits(t.id) ? '<span class="tag task">催促どき ' + dueWaits(t.id) + "</span>"
              : waits(t.id) ? '<span class="tag">待ち ' + waits(t.id) + "</span>" : "")
          + (!nt && t.status === "open" && t.urgency === "high"
              ? '<span class="tag task">急ぎ</span>' : "")
          + (t.status !== "open" ? '<span class="tag done">対応済み</span>' : "")
          + "</div></div>";
      }).join("")
    : '<div class="empty">該当する会話はありません</div>';

  $("#threads").onclick = async function (e) {
    // アーカイブのボタンが先。会話を開いてしまわないように止める。
    var a = e.target.closest("[data-arch]");
    if (a) {
      e.stopPropagation();
      a.disabled = true;
      var id = a.dataset.arch;
      var cur = state.threads.filter(function (x) { return x.id === id; })[0];
      // 要対応 → アーカイブ（確認待ち）→ 消込（archived）の順に進む。
      var next = !cur ? "done" : cur.status === "open" ? "done" : cur.status === "done" ? "archived" : "open";
      var r = await api("/status", { method: "POST", body: JSON.stringify({ id: id, status: next }) });
      if (!r || r.error) { a.disabled = false; toast((r && r.error) || "変えられませんでした"); return; }
      toast(next === "done" ? "アーカイブしました。念のため［アーカイブ］で確認できます" : next === "archived" ? "消し込みました" : "戻しました");
      await loadList();
      if (state.current === id) closeThread();
      return;
    }
    var row = e.target.closest(".thread"); if (!row) return;
    openThread(row.dataset.id);
  };
}

/**
 * 開いている会話を閉じて、一覧だけの状態に戻す。
 *
 * 狭い画面では viewing を外すだけで一覧に戻るが、広い画面は左右に並んでいるので、
 * 右側を空にしないと、片付けたはずの会話がそのまま残って見える。
 */
function closeThread() {
  state.current = null;
  $("#main").classList.remove("viewing");
  $("#detail").innerHTML = '<div class="empty">左から会話を選んでください</div>';
  renderList();
}

function renderHits() {
  var q = $("#q").value.trim();
  $("#count").textContent = state.hits.length + " 件";
  $("#threads").innerHTML = state.hits.length
    ? state.hits.map(function (h) {
        return '<div class="hit" data-id="' + esc(h.threadId) + '">'
          + '<div class="top"><b>' + esc(shortName(h.threadName)) + "</b>"
          + '<span class="when">' + (h.where === "note" ? "メモ・" : "") + when(h.at) + "</span></div>"
          + '<div class="body">' + mark(h.body, q) + "</div></div>";
      }).join("")
    : '<div class="empty">見つかりませんでした</div>';
  $("#threads").onclick = function (e) {
    var row = e.target.closest(".hit"); if (!row) return;
    openThread(row.dataset.id);
  };
}

// 探した言葉に色を付ける。どこで当たったのかが分かるように。
function mark(body, q) {
  var t = esc(String(body || "").slice(0, 300));
  if (!q) return t;
  var needle = esc(q);
  var at = t.indexOf(needle);
  if (at < 0) return t;
  // 当たった前後を切り出す。頭から出すと、当たりが見えないことがある。
  var from = Math.max(0, at - 40);
  var cut = (from ? "…" : "") + t.slice(from, from + 220);
  return cut.split(needle).join("<mark>" + needle + "</mark>");
}

async function openThread(id) {
  state.current = id; state.tab = "inbox";
  // いま開いている会話をサーバーにも残す。
  // チャットから手伝うときに「このグループに」が通じるようにするため。
  // 返事は待たない。画面の速さに影響させない。
  api("/viewing", { method: "POST", body: JSON.stringify({ id: id }) });
  // 開いている会話をサーバーにも残す。
  // チャットから手伝うときに「このグループに」が通じるように。
  api("/viewing", { method: "POST", body: JSON.stringify({ id: id }) });
  $("#main").classList.add("viewing");
  renderList();
  var d = await api("/thread?id=" + encodeURIComponent(id));
  if (!d || d.error) return;
  renderThread(d);
}

function renderThread(d) {
  var t = d.thread;
  var open = d.tasks.filter(function (k) { return !k.done; }).length;

  var msgs = d.messages.map(function (m) {
    // 受信箱から送った画像は、預けたファイル（file:<id>）から出す。LINEから届いたものはLINEの保管分から。
    var own = !!m.external_id && m.external_id.indexOf("file:") === 0;
    var src = own ? "img/" + encodeURIComponent(m.external_id.slice(5))
                  : "/inbox/api/media?messageId=" + encodeURIComponent(m.external_id || "");
    var media = m.kind === "image" && m.external_id
      ? '<a href="' + src + '" target="_blank" rel="noopener"><img src="' + src + '" loading="lazy"></a>' : "";
    var card = (m.kind === "image" || m.kind === "file") && m.external_id
      ? '<div class="filecard">'
        + '<a class="act" style="text-decoration:none" target="_blank" rel="noopener" href="/inbox/api/media?messageId='
        + encodeURIComponent(m.external_id) + '">開く</a>'
        + '<button class="act" data-read="' + encodeURIComponent(m.external_id)
        + '" data-name="' + encodeURIComponent(m.file_name || "") + '">AIに読ませる</button></div>'
      : "";
    return '<div class="msg ' + m.direction + '">' + media + esc(m.body || "") + card
      + '<div class="meta">' + when(m.created_at) + (m.kind === "ack" ? " ・自動受付" : "") + "</div></div>";
  }).join("");

  $("#detail").innerHTML =
    '<div class="dhead">'
    + '<button class="mini back" id="back">←</button>'
    + '<b title="' + esc(t.display_name || "") + '" id="thName">'
    + (t.label ? esc(t.label) : esc(shortName(t.display_name))) + "</b>"
    + (t.category ? '<span class="tag">' + esc(t.category) + "</span>" : "")
    // 付けた設定は見えるままにする。変える操作だけを［設定］にたたむ（2026-09-23）。
    + (t.lead ? '<span class="tag">主担当：' + esc(t.lead) + "</span>" : "")
    + (t.account_id && t.account_id !== "default" ? '<span class="tag">' + esc(accountLabel(t.account_id)) + "</span>" : "")
    + '<div class="sp"></div>'
    + '<details class="thset" id="thSet"><summary class="mini" title="別名・主担当・事業">設定 ▾</summary>'
    + '<div class="thsetbox">'
    + '<label>受信箱での別名（表示だけ。宛先は変わりません）'
    + '<button class="mini" id="thLabel">' + (t.label ? "別名を直す：" + esc(t.label) : "別名を付ける") + "</button></label>"
    + "<label>主担当（本人以外にすると、名指しの発言だけ要対応に出ます）" + leadSelect(t, d) + "</label>"
    + (state.accounts.length > 1
        ? "<label>事業（下書きが読むきまりが変わります）"
          + '<select class="mini" id="thAcct">'
          + state.accounts.map(function (a) {
              return '<option value="' + esc(a.id) + '"' + (a.id === t.account_id ? " selected" : "") + ">"
                + esc(a.label) + "</option>";
            }).join("")
          + "</select></label>"
        : "")
    + "</div></details>"
    + "</div>"
    // 状況（Jevの判定・担当・行き先）は1行にたたむ。開けば今までどおり全部出る。
    // 積み重なると履歴が読めなくなるため（2026-09-22）。
    + '<details class="sit" id="sit"' + (sitOpen() ? " open" : "") + "><summary>" + sitLine(t) + "</summary>"
    + routeBar(t)
    + leadBar(t, d)
    + destBlock(t)
    + "</details>"
    + '<div id="calNote"></div>'
    + '<div id="msgs">' + (msgs || '<div class="empty">まだやりとりがありません</div>') + "</div>"
    + '<div class="panel"><div class="tabs">'
    + '<button data-p="reply" class="' + (state.panel === "reply" ? "on" : "") + '">返信</button>'
    // AIの読みを独立させる。下書きはここを土台に作られるので、
    // ここを直せば下書きが変わる、という関係が見えるようにする。
    + '<button data-p="ai" class="' + (state.panel === "ai" ? "on" : "") + '">AIの読み'
    + (prepTasks(t).length || t.prep_questions && t.prep_questions !== "[]" ? " ●" : "") + "</button>"
    + '<button data-p="tasks" class="' + (state.panel === "tasks" ? "on" : "") + '">やること'
    + " (" + myOpen(d) + ")</button>"
    + '<button data-p="waits" class="' + (state.panel === "waits" ? "on" : "") + '">やってもらうこと'
    + " (" + theirOpen(d) + ")</button>"
    + '<button data-p="note" class="' + (state.panel === "note" ? "on" : "") + '">メモ</button>'
    + '</div><div id="panelBody"></div></div>';

  $("#msgs").scrollTop = $("#msgs").scrollHeight;
  $("#back").onclick = function () { $("#main").classList.remove("viewing"); };
  // 主担当を付け替える。本人以外にすると、本人が名指しされた発言だけが要対応に出る。
  if ($("#thLead")) $("#thLead").onchange = async function (ev) {
    var v = ev.target.value;
    var r = await api("/thread-lead", { method: "POST", body: JSON.stringify({ id: t.id, lead: v }) });
    if (r && r.error) { toast(r.error); return; }
    toast(v ? "主担当を " + v + " にしました。名指しされたときだけ要対応に出ます" : "主担当を本人に戻しました");
    await loadList(); openThread(t.id);
  };

  wireDest(t);
  renderCalNote(t);
  if ($("#thLabel")) $("#thLabel").onclick = async function () {
    // 別名は受信箱の中の付箋。LINE側の名前も宛先も変えない。
    var got = await askFill("受信箱での別名（空にすると元の名前に戻ります）" + String.fromCharCode(10)
      + "元の名前：" + (t.display_name || "名称未取得") + String.fromCharCode(10)
      + "表示だけが変わります。宛先は変わりません。",
      [{ label: "別名", value: t.label || "" }], "保存");
    if (got === null) return;
    var now = got[0];
    var r = await api("/thread-label", { method: "POST", body: JSON.stringify({ id: t.id, label: now }) });
    if (!r || r.error) { toast((r && r.error) || "付けられませんでした"); return; }
    t.label = r.label;
    $("#thName").textContent = r.label || shortName(t.display_name);
    toast(r.label ? "別名を付けました（宛先は変わりません）" : "別名を外しました");
    loadList();
  };
  if ($("#sit")) $("#sit").ontoggle = function () {
    try { localStorage.setItem("sitOpen", $("#sit").open ? "1" : "0"); } catch (e) {}
  };

  // 担当の確定。推定をそのまま確定するか、分からないときに選ぶ。
  document.querySelectorAll("[data-lead]").forEach(function (b) {
    b.onclick = async function () {
      var v = b.dataset.lead === "本人" ? "" : b.dataset.lead;
      var r = await api("/thread-lead", { method: "POST", body: JSON.stringify({ id: t.id, lead: v }) });
      if (r && r.error) { toast(r.error); return; }
      toast(v ? "担当を " + v + " で確定しました。名指しされたときだけ要対応に出ます" : "担当を本人で確定しました");
      await loadList(); openThread(t.id);
    };
  });
  if ($("#inferLead")) $("#inferLead").onclick = async function (e) {
    var b = e.currentTarget; b.disabled = true; b.textContent = "読んでいます…";
    await api("/infer-leads", { method: "POST", body: JSON.stringify({ ids: [t.id] }) });
    await loadList(); openThread(t.id);
  };

  // 事業を付け替える。下書きが読む「きまり」と文体の手本が、ここで決まる。
  if ($("#thAcct")) $("#thAcct").onchange = async function (ev) {
    var r = await api("/thread-account", { method: "POST", body: JSON.stringify({
      id: t.id, account: ev.target.value }) });
    if (r && r.error) { toast(r.error); return; }
    toast(accountLabel(ev.target.value) + " に移しました");
    await loadList(); openThread(t.id);
  };

  $("#msgs").onclick = async function (ev) {
    var b = ev.target.closest("[data-read]"); if (!b) return;
    b.disabled = true; b.textContent = "読んでいます…";
    var r = await api("/read-attachment", { method: "POST", body: JSON.stringify({
      id: t.id, messageId: decodeURIComponent(b.dataset.read), fileName: decodeURIComponent(b.dataset.name) }) });
    b.disabled = false; b.textContent = "AIに読ませる";
    if (!r) return;
    if (r.error) { toast(r.error); return; }
    toast("読み取りました。メモに入れています。");
    state.panel = "note"; openThread(t.id);
  };
  $(".tabs").onclick = function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.panel = b.dataset.p; state.drawer = ""; renderThread(d);
  };
  renderPanel(d);
}

function myOpen(d) {
