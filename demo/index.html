}
function theirOpen(d) {
  return d.tasks.filter(function (k) { return !k.done && k.side === "theirs"; }).length;
}

function renderPanel(d) {
  var t = d.thread, body = $("#panelBody");
  // 複数人の場に返すとき、誰宛てかを指せる場所。
  // LINEはグループ・ルーム、チャットワークは部屋がそれにあたる。
  var isGroup = t.channel === "chatwork"
    || t.external_id[0] === "C" || t.external_id[0] === "R";

  if (state.panel === "reply") { renderReply(t, d, isGroup, body); return; }
  if (state.panel === "ai") { renderAi(t, body); return; }

  if (state.panel === "tasks" || state.panel === "waits") {
    // 自分が動くものと、相手に頼んで待っているものを、別の欄にする。
    // 混ぜると、こちらから出した宿題が埋もれて催促の時期を逃す。
    var wait = state.panel === "waits";
    // 終わったものは出さない。チェックを付けた時点で消える。
    var mine = d.tasks.filter(function (k) { return !k.done && k.side !== "theirs"; });
    var theirs = d.tasks.filter(function (k) { return !k.done && k.side === "theirs"; });

    body.innerHTML = prepTaskBlock(t, wait ? "theirs" : "mine")
      + (wait ? "" : '<div class="tasklist" id="tl">'
          + (mine.length ? mine.map(taskRow).join("")
                         : '<p class="hint">ありません。</p>')
          + "</div>")
      + (wait ? '<p class="hint" style="margin:0 0 6px">'
          + '期日が来ると要対応に出ます。それまでは黙っています。</p>' : "")
      // やってもらうことは［やってもらうこと］の欄だけに出す。両方に出すと同じものが二重に見える。
      + (wait ? '<div class="tasklist" id="tlw">'
          + (theirs.length ? theirs.map(taskRow).join("")
                           : '<p class="hint">ありません。</p>')
          + "</div>" : "")
      + '<div class="row" style="margin-top:12px">'
      + '<input type="text" id="newTask" placeholder="内容">'
      + '<input type="text" class="mini" id="taskWho" list="peopleList" placeholder="相手" style="max-width:9em">'
      + '<select class="mini" id="taskSide">'
      + '<option value="mine"' + (wait ? "" : " selected") + '>自分がやる</option>'
      + '<option value="theirs"' + (wait ? " selected" : "") + '>やってもらう</option></select>'
      + '<input type="date" class="mini" id="taskDue" title="期日">'
      + '<button class="act" id="addTask">追加</button>'
      + '<button class="act" id="aiTasks">AIに拾わせる</button></div>';
    wireTasks(t.id);
    wirePrepTasks(body, t.id);
    return;
  }

  body.innerHTML = '<p class="hint" style="margin-bottom:7px"><b>残るメモ</b>（AIは書き換えません。資料の読み取り結果もここに入ります）</p>'
    + '<textarea id="note" style="min-height:110px" placeholder="この相手について、自分で決めている扱い。例：料金は最初に出す、メールではなくLINEで。ここに書いたことが優先されます。">'
    + esc(d.note && d.note.human ? d.note.human : "") + "</textarea>"
    + '<div class="row" style="margin-top:8px"><button class="act" id="saveNote">メモを保存</button>'
    + '<span class="hint">事務所内のみ。相手には送られません。</span></div>'
    + '<p class="hint" style="margin:15px 0 7px"><b>AIの記録</b>'
    + '（送信のたびに丸ごと作り直されます。残したいことは上のメモへ）</p>'
    + '<textarea id="aiNote" style="min-height:190px" placeholder="やりとりを重ねると、ここに溜まっていきます。">'
    + esc(d.note && d.note.ai ? d.note.ai : "") + "</textarea>"
    + '<div class="row" style="margin-top:8px">'
    + '<button class="act" id="doRemember">いまのやりとりから作り直す</button></div>';
  $("#saveNote").onclick = async function () {
    await api("/note", { method: "POST", body: JSON.stringify({ id: t.id, body: $("#note").value }) });
    toast("メモを保存しました");
  };
  $("#doRemember").onclick = async function (e) {
    e.target.disabled = true; e.target.textContent = "読んでいます…";
    var r = await api("/remember", { method: "POST", body: JSON.stringify({ id: id }) });
    e.target.disabled = false; e.target.textContent = "いまのやりとりから作り直す";
    if (!r || r.error) { toast((r && r.error) || "うまくいきませんでした"); return; }
    $("#aiNote").value = r.note || "";
    toast("記録を作り直しました");
  };
}

// Jevが振り分けて、先回りで用意したものを見せる。
// 何もしていないように見えると、裏で走っている意味が伝わらない。
var BY = { ai: "AI", browser: "画面操作", human: "人" };

// 判断が要る件でAIが挙げた問い。答えると残るメモに入る。
function askBlock(t) {
  var qs = [];
  try { qs = JSON.parse(t.prep_questions || "[]"); } catch (e) { qs = []; }
  if (!qs.length) return "";
  return '<div class="ask"><div class="head">これが決まれば書けます</div>'
    + qs.map(function (q, i) {
        return '<div class="q"><label>' + esc(q.ask)
          + '<div class="why">' + esc(q.why || "") + "</div>"
          + '<input type="text" data-q="' + i + '" placeholder="ここに答える"></label></div>';
      }).join("")
    + '<div class="foot"><button class="act" id="doAnswer">答えて下書きを作る</button>'
    + '<span class="hint">答えは［メモ］の残るメモに入ります。次から同じことは聞きません。</span></div></div>';
}

function prepTasks(t) {
  try { return JSON.parse(t.prep_tasks || "[]"); } catch (e) { return []; }
}

// 読んだあとに新しい発言が来ているか。
// そのときの読みと下書きは、最新の発言を知らない。出すと、ずれた案がそのまま送られる。
function stale(t) {
  return !!(t.prep_at && t.last_message_at && t.last_message_at > t.prep_at);
}

// 主担当の選択。候補はこの会話で発言したことのある人。
// 本人の2つのアカウント（公式・個人）は候補に出さない。
function leadSelect(t, d) {
  if (t.channel === "gmail") return "";
  var names = [];
  (d.speakers || []).forEach(function (s) {
    if (s.name && names.indexOf(s.name) < 0 && !isMe(s.name)) names.push(s.name);
  });
  if (t.lead && names.indexOf(t.lead) < 0) names.push(t.lead);
  var confirmed = !!t.lead_confirmed;
  return '<select class="mini" id="thLead" title="主担当。本人以外にすると、本人が名指しされた発言だけが要対応に出る">'
    + (confirmed ? "" : '<option value="__none" selected disabled>主担当：未確定</option>')
    + '<option value=""' + (confirmed && !t.lead ? " selected" : "") + '>主担当：本人</option>'
    + names.map(function (n) {
        return '<option value="' + esc(n) + '"' + (confirmed && n === t.lead ? " selected" : "") + ">主担当：" + esc(n) + "</option>";
      }).join("")
    + "</select>";
}

// 担当と経緯。AIが読み取って出し、人が確定する。確定するまで振り分けには使わない。
// 分からなければ聞く。外れた推定で要対応から消えるのが一番の事故なので、そこは人が決める。
function leadBar(t, d) {
  if (t.channel === "gmail") return "";
  var story = t.lead_story ? '<span class="story">' + esc(t.lead_story) + "</span>" : "";
  if (t.lead_confirmed) {
    return '<div class="leadbar"><b>担当：' + esc(t.lead || "本人") + ' ✓</b>' + story + "</div>";
  }
  if (!t.lead_guess) {
    return '<div class="leadbar">担当と経緯はまだ読んでいません'
      + '<button class="lnk" id="inferLead">読ませる</button></div>';
  }
  if (t.lead_guess === "不明") {
    var names = ["本人"];
    (d.speakers || []).forEach(function (sp) {
      if (sp.name && names.indexOf(sp.name) < 0 && !isMe(sp.name)) names.push(sp.name);
    });
    return '<div class="leadbar ask1"><b>担当が読み取れません。誰が動く会話ですか？</b>'
      + names.map(function (n) {
          return '<button class="chip" data-lead="' + esc(n) + '">' + esc(n) + "</button>";
        }).join("")
      + story + "</div>";
  }
  return '<div class="leadbar"><span>担当（AIの推定）：<b>' + esc(t.lead_guess) + "</b></span>"
    + '<button class="chip" data-lead="' + esc(t.lead_guess) + '">この担当で確定</button>'
    + '<span class="hint" style="margin:0">違えば右上の［主担当］で選んでください</span>'
    + story + "</div>";
}

// 行き先。会話を開いたら1つ決めて、要対応から安心して出す（GTDの「処理」）。
// AIは勧めるだけ。押すまで何も変わらない。
var DEST = [["reply", "返信する"], ["mine", "自分がやる"], ["assign", "振る"],
            ["wait", "相手待ち"], ["hold", "保留"], ["noreply", "返信不要"]];

function prepDest(t) {
  if (!t.prep_dest || stale(t)) return null;
  try { return JSON.parse(t.prep_dest); } catch (e) { return null; }
}

function destBlock(t) {
  if (t.status !== "open") return "";
  var f = state.features || {};
  var d = prepDest(t);
  var label = function (k) { return (DEST.filter(function (x) { return x[0] === k; })[0] || ["", ""])[1]; };
  return '<div class="dest">'
    + '<div class="dhint">' + (d
        ? "AIの判断：<b>" + esc(label(d.kind)) + "</b>"
          + (d.who ? "（" + esc(d.who) + "）" : "") + (d.reason ? '<span class="why">' + esc(d.reason) + "</span>" : "")
        : '行き先を決めると要対応から外れます <button class="lnk" id="destAsk">AIに提案させる</button>')
    + "</div>"
    + '<details class="dmore"' + (d ? "" : " open") + '><summary class="lnk">ほかの処理 ▾</summary>'
    + '<div class="dbtns">' + DEST.filter(function (x) { return x[0] !== "hold" || f.hold !== false; }).map(function (x) {
        return '<button class="chip' + (d && d.kind === x[0] ? " on" : "") + '" data-dest="' + x[0] + '">' + x[1] + "</button>";
      }).join("") + "</div>"
    + ((state.features || {}).aiPrep !== false
        ? '<div class="dbtns aip"><span class="hint" style="margin:0">AIに準備させる：</span>'
          + '<button class="chip" data-aip="schedule">日程の予定案</button>'
          + '<button class="chip" data-aip="nudge">催促の送信セット</button></div>'
        : "")
    + "</details>"
    + '<div class="dform" id="destForm"></div></div>';
}

// Googleカレンダーの登録画面を開くリンク。登録ボタンを押すのは人。
function gcalLink(sc) {
  function z(iso) { var t = new Date(iso); if (isNaN(t)) return ""; var x = t.toISOString().slice(0, 19);
    return x.split("-").join("").split(":").join("") + "Z"; }
  var a = z(sc.start), b = z(sc.end) || a;
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(sc.title || "")
    + (a ? "&dates=" + a + "/" + b : "")
    + "&details=" + encodeURIComponent(sc.notes || "")
    + "&location=" + encodeURIComponent(sc.place || "");
}

function holdDates() {
  function at(days) {
    var j = new Date(Date.now() + 9 * 3600e3);
    j.setUTCDate(j.getUTCDate() + days); j.setUTCHours(9, 0, 0, 0);
    return j.getTime() - 9 * 3600e3;
  }
  var dow = new Date(Date.now() + 9 * 3600e3).getUTCDay();
  var toFri = (5 - dow + 7) % 7 || 7, toMon = (1 - dow + 7) % 7 || 7;
  return [["明日", at(1)], ["金曜", at(toFri)], ["来週月曜", at(toMon)]];
}

function wireDest(t) {
  if ($("#destAsk")) $("#destAsk").onclick = async function (e) {
    var b = e.currentTarget; b.disabled = true; b.textContent = "読んでいます…";
    await api("/prepare-test", { method: "POST", body: JSON.stringify({ id: t.id, weight: t.route_weight || "normal", save: true }) });
    await loadList(); openThread(t.id);
  };
  var form = $("#destForm"); if (!form) return;
  document.querySelectorAll("[data-aip]").forEach(function (b) {
    b.onclick = async function () {
      var kind = b.dataset.aip;
      b.disabled = true; var label = b.textContent; b.textContent = "準備しています…";
      var r = await api("/ai-prep", { method: "POST", body: JSON.stringify({ id: t.id, kind: kind }) });
      b.disabled = false; b.textContent = label;
      if (!r || r.error) { toast((r && r.error) || "準備できませんでした"); return; }
      if (kind === "nudge") { toast("催促の送信セットを置きました。中身を確認して送ってください"); openThread(t.id); return; }
      var sc = r.schedule;
      if (!sc || !sc.found) { form.innerHTML = '<p class="hint">やりとりの中に、決まった予定は見つかりませんでした。</p>'; return; }
      var when2 = new Date(sc.start);
      form.innerHTML = '<div class="pset"><div class="head">予定案（まだ登録していません）</div>'
        + "<div><b>" + esc(sc.title) + "</b></div>"
        + "<div>" + esc(isNaN(when2) ? sc.start : when2.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" }))
        + (sc.place ? "　" + esc(sc.place) : "") + "</div>"
        + (sc.notes ? '<div class="hint" style="margin:4px 0 0">' + esc(sc.notes) + "</div>" : "")
        + '<div class="row" style="margin-top:8px"><a class="act go" style="text-decoration:none" target="_blank" rel="noopener" href="'
        + esc(gcalLink(sc)) + '">Googleカレンダーで開いて登録</a></div>'
        + '<p class="hint" style="margin:4px 0 0">開いた画面で中身を確かめて［保存］を押すと登録されます。</p></div>';
    };
  });
  var d = prepDest(t) || {};
  async function go(body) {
    body.id = t.id;
    var r = await api("/dest", { method: "POST", body: JSON.stringify(body) });
    if (!r || r.error) { toast((r && r.error) || "決められませんでした"); return; }
    var msg = { noreply: "返信不要にしました。念のため［アーカイブ］で確認できます",
                mine: "やることに入れました", assign: "やってもらうことに入れました",
                wait: "相手待ちにしました。確認日に要対応へ戻ります", hold: "保留にしました。戻ってくる日に要対応へ戻ります" }[body.kind];
    toast(msg || "決めました");
    await loadList(); closeThread();
  }
  document.querySelectorAll("[data-dest]").forEach(function (b) {
    b.onclick = function () {
      var k = b.dataset.dest;
      if (k === "reply") { state.panel = "reply"; openThread(t.id); setTimeout(function () { if ($("#reply")) $("#reply").focus(); }, 50); return; }
      if (k === "noreply") { go({ kind: "noreply" }); return; }
      var same = d.kind === k;
      if (k === "hold") {
        form.innerHTML = '<div class="row">'
          + ["情報が足りない", "自分の判断待ち", "今はやらない"].map(function (r, i) {
              return '<button class="chip' + (i === 0 ? " on" : "") + '" data-hr="' + r + '">' + r + "</button>"; }).join("")
          + "</div>"
          + '<input type="text" id="holdNote" placeholder="メモ（何を待つか、何が足りないか）" value="' + esc(same ? d.reason || "" : "") + '">'
          + '<div class="row">' + holdDates().map(function (x) {
              return '<button class="act" data-until="' + x[1] + '">' + x[0] + "に戻す</button>"; }).join("")
          + '<input type="date" class="mini" id="holdDate"><button class="act" id="holdGo">この日に戻す</button></div>';
        var reason = "情報が足りない";
        form.querySelectorAll("[data-hr]").forEach(function (c) {
          c.onclick = function () {
            form.querySelectorAll("[data-hr]").forEach(function (x) { x.classList.remove("on"); });
            c.classList.add("on"); reason = c.dataset.hr;
          };
        });
        function hold(until) {
          var note = $("#holdNote").value.trim();
          go({ kind: "hold", reason: reason + (note ? "：" + note : ""), until: until });
        }
        form.querySelectorAll("[data-until]").forEach(function (u) { u.onclick = function () { hold(+u.dataset.until); }; });
        $("#holdGo").onclick = function () {
          var v = $("#holdDate").value; if (!v) { toast("日付を選んでください"); return; }
          hold(Date.parse(v + "T09:00:00+09:00"));
        };
        return;
      }
      var needWho = k === "assign" || k === "wait";
      var who = same && d.who ? d.who : (k === "assign" ? (t.lead || CFG.staff[0] || "") : "");
      form.innerHTML = '<div class="row">'
        + (needWho ? '<input type="text" id="destWho" style="max-width:34%" placeholder="' + (k === "assign" ? "誰に振るか" : "誰を待つか") + '" value="' + esc(who) + '">' : "")
        + '<input type="text" id="destTask" placeholder="' + (k === "mine" ? "何をするか" : k === "assign" ? "何をしてもらうか" : "何を待つか") + '" value="' + esc(same ? d.task || "" : "") + '">'
        + '<button class="act go" id="destGo">決める</button></div>'
        + (k === "mine" && (state.features || {}).nextStep !== false
            ? '<div class="row"><span class="hint" style="margin:0">所要時間</span>'
              + [["5", "5分"], ["15", "15分"], ["30", "30分"], ["60", "1時間"]].map(function (e) {
                  return '<button class="chip" data-mest="' + e[0] + '">' + e[1] + "</button>"; }).join("")
              + '<label class="hint" style="margin:0 0 0 8px"><input type="checkbox" id="destToday"> 今日やる</label></div>'
            : "")
        + (needWho ? '<p class="hint" style="margin:4px 0 0">' + ((state.features || {}).checkDays || 3) + "営業日後に確かめます（［機能］で変えられます）</p>" : "");
      $("#destTask").focus();
      var est = null;
      form.querySelectorAll("[data-mest]").forEach(function (c) {
        c.onclick = function () {
          form.querySelectorAll("[data-mest]").forEach(function (x) { x.classList.remove("on"); });
          c.classList.add("on"); est = +c.dataset.mest;
        };
      });
      $("#destGo").onclick = function () {
        go({ kind: k, who: needWho ? $("#destWho").value : "", task: $("#destTask").value,
             estMin: est, planAt: $("#destToday") && $("#destToday").checked ? todayAt9() : null });
      };
    };
  });
}

// 状況の1行。担当と行き先がひと目で分かるだけにする。
function sitOpen() {
  try { return localStorage.getItem("sitOpen") === "1"; } catch (e) { return false; }
}
function sitLine(t) {
  var dd = prepDest(t);
  var label = dd ? (DEST.filter(function (x) { return x[0] === dd.kind; })[0] || ["", ""])[1] : "";
  var lead = t.lead_confirmed ? (t.lead || "本人")
    : t.lead_guess && t.lead_guess !== "不明" ? t.lead_guess + "（推定）" : "未確定";
  return '<span class="sitk">状況</span>' + jevTag(t)
    + '<span class="sitv">担当：' + esc(lead) + "</span>"
    + (t.status === "open" ? '<span class="sitv">行き先：' + (label ? "AIは「" + esc(label) + "」" : "未決定") + "</span>" : "")
    + '<span class="sitmore">詳しく</span>';
}

// 会話の上に出す一行。タブを切り替えても消えない。
// 「静かになった」「下書きが無い」の理由が、ここを見れば分かるようにしておく。
function routeBar(t) {
  if (!t.route_kind && !t.prep_at) return "";
  var right = stale(t)
    ? '<span class="arrow">→</span> 新しい発言のあと、まだ読んでいません'
    : t.prep_draft
    ? '<span class="arrow">→</span> ' + esc(t.prep_model || "AI") + " で下書きを用意済み"
    : t.prep_at
      ? '<span class="arrow">→</span> 判断が要るので下書きは作っていません'
      : "";
  var n = prepTasks(t).length;
  return '<div class="routebar">' + jevTag(t) + right
    + (n ? '<span class="arrow">・</span>やること候補 ' + n + " 件" : "") + "</div>";
}

// 返信の欄に出すのは、なぜこの下書きなのかという経緯だけ。
// やること候補は［やること］に置いてある。1画面に積むと、書く場所が下に押し出される。
function prepBlock(t) {
  if (!t.prep_plan || stale(t)) return "";
  // 判断が要る件では下書きを作っていない。そこで「下書きの狙い」と出すと、
  // 無いものを指している言葉になる。中身に合わせて見出しを変える。
  var head = t.prep_draft ? "この下書きの狙い" : "この件の進め方（下書きは作っていません）";
  return '<div class="prep"><div class="head">' + head + "</div>"
    + '<div class="plan">' + esc(t.prep_plan) + "</div>"
    + '<div class="fix"><button id="fixPlan">進め方が違う</button></div>'
    + '<div class="fixbox" id="fixBox">'
    + '<textarea id="fixText" placeholder="正しい進め方を書いてください。例：日程調整は事務所の担当者の仕事。担当者は本人のカレンダーを見られるので、担当者から先方へ直接連絡する"></textarea>'
    + '<div class="foot" style="margin-top:7px;display:flex;gap:9px;align-items:center">'
    + '<button class="act" id="doFixPlan">直して覚える</button>'
    + '<span class="hint" style="margin:0">次から同じ取り違えをしません。社内の役割分担なら［きまり］の候補に入ります。</span>'
    + "</div></div></div>";
}

// ［やること］の頭に出す、AIからの候補。押して初めてやることになる。
function prepTaskBlock(t, side) {
  var tasks = prepTasks(t).filter(function (k) {
    // AIの候補は by（誰が片付けるか）しか持っていない。
    // human は人が動くものなので「自分がやること」側、
    // ai / browser も受信箱の中で片付ける＝自分側に置く。
    // 相手に頼むものは、いまのところ候補には出てこない。
    return side === "theirs" ? false : true;
  });
  if (!tasks.length) return "";
  return '<div class="prep"><div class="head">AIからの候補（押すとやることに入ります）</div>'
    + tasks.map(function (k) {
        return '<div class="tk"><span class="by' + (k.by === "human" ? " human" : "") + '">'
          + esc(BY[k.by] || k.by) + "</span><div><div>" + esc(k.title) + "</div>"
          + '<div class="how">' + esc(k.how || "") + "</div></div>"
          + '<div style="flex:1"></div>'
          + '<button class="mini" data-addtask="' + esc(k.title) + '">やることに追加</button></div>';
      }).join("")
    + "</div>";
}

/**
 * AIの読み。
 *
 * 下書きはここを土台に作られる。だから、下書きを直すより先にここを直したほうが早い。
 * 読みが違っていれば、いくら文面を直しても次も同じところで外す。
 *
 * ここでの訂正は覚える。相手固有のことは相手のメモへ、
 * 社内の役割分担のように全体に効くことは［きまり］の候補へ回る。
 */
function renderAi(t, body) {
  var qs = [];
  try { qs = JSON.parse(t.prep_questions || "[]"); } catch (e) { qs = []; }
  var tasks = prepTasks(t);

  if (stale(t) || (!t.prep_plan && !t.prep_draft && !qs.length)) {
    body.innerHTML = '<p class="hint">'
      + (stale(t)
          ? when(t.prep_at) + "に読んだあと、新しい発言が来ています。前の読みは最新の発言を知らないので出していません。"
          : "まだ読んでいません。")
      + '［この会話を読ませる］を押すと、状況の整理と下書きを用意します。</p>'
      + '<div class="row" style="margin-top:8px">'
      + '<button class="act" id="doPrep">この会話を読ませる</button></div>';
    wirePrep(t);
    return;
  }

  body.innerHTML =
    '<div class="prep"><div class="head">Jevの判定</div>'
    + '<div class="plan">' + (jevTag(t) || "（未判定）")
    + (t.prep_model ? '<span class="tag" style="margin-left:7px">' + esc(t.prep_model) + " で用意</span>" : "")
    + (t.prep_at ? '<span class="tag" style="margin-left:7px">' + when(t.prep_at) + "</span>" : "")
    + "</div></div>"

    + (t.prep_plan
        ? '<div class="prep"><div class="head">この件の読み</div>'
          + '<div class="plan">' + esc(t.prep_plan) + "</div>"
          + '<div class="fix"><button id="fixPlan">読みが違う</button></div>'
          + '<div class="fixbox" id="fixBox">'
          + '<textarea id="fixText" placeholder="正しい読みを書いてください。誰が動くのか、何が先か、を具体的に"></textarea>'
          + '<div class="foot" style="margin-top:7px;display:flex;gap:9px;align-items:center">'
          + '<button class="act" id="doFixPlan">直して覚える</button>'
          + '<span class="hint" style="margin:0">次から同じ取り違えをしません。</span>'
          + "</div></div></div>"
        : "")

    + askBlock(t)

    + (tasks.length
        ? '<div class="prep"><div class="head">やることの候補</div>'
          + tasks.map(function (k) {
              return '<div class="tk"><span class="by' + (k.by === "human" ? " human" : "") + '">'
                + esc(BY[k.by] || k.by) + "</span><div><div>" + esc(k.title) + "</div>"
                + '<div class="how">' + esc(k.how || "") + "</div></div></div>";
            }).join("")
          + '<p class="hint" style="margin:8px 0 0">［やること］で押すと登録されます。</p></div>'
        : "")

    + '<div class="row" style="margin-top:10px">'
    + '<button class="act" id="doPrep">この読みで下書きを作り直す</button>'
    + '<span class="hint">読みを直したあとに押すと、そこから書き直します。</span></div>';

  wireAskAndFix(t);
  wirePrep(t);
}

/** 読みを作り直す。判断が要る件では下書きを作らず、読みだけを更新する。 */
function wirePrep(t) {
  if (!$("#doPrep")) return;
  $("#doPrep").onclick = async function (e) {
    var b = e.currentTarget;
    b.disabled = true; b.textContent = "読んでいます…";
    try {
      var r = await api("/prepare-test", { method: "POST", body: JSON.stringify({
        id: t.id, weight: t.route_weight || "normal", save: true }) });
      if (!r || r.error) { toast((r && r.error) || "うまくいきませんでした"); return; }
      toast("読み直しました");
      await loadList(); openThread(t.id);
    } finally {
      b.disabled = false; b.textContent = "この読みで下書きを作り直す";
    }
  };
}

/**
 * 読みへの手入れを配線する。
 * 「読みが違う」で直すと覚える。問いに答えると残るメモに入り、下書きが作り直される。
 */
function wireAskAndFix(t) {
  if ($("#fixPlan")) $("#fixPlan").onclick = function () {
    var box = $("#fixBox");
    box.classList.toggle("open");
    if (box.classList.contains("open")) {
      if (!$("#fixText").value) $("#fixText").value = t.prep_plan || "";
      $("#fixText").focus();
    }
  };
  if ($("#doFixPlan")) $("#doFixPlan").onclick = async function (e) {
    var b = e.currentTarget;
    var v = $("#fixText").value.trim();
    if (!v) { toast("読みを書いてください"); return; }
    b.disabled = true; b.textContent = "覚えています…";
    try {
      var r = await api("/fix-plan", { method: "POST", body: JSON.stringify({ id: t.id, correction: v }) });
      if (!r || r.error) { toast((r && r.error) || "うまくいきませんでした"); return; }
      if (r.lesson && r.lesson.scope === "house") toast("覚えました。［きまり］に候補として置きました");
      else if (r.lesson) toast("覚えました。この相手のメモに入れました");
      else toast("読みを直しました");
      await loadList(); openThread(t.id);
    } finally {
      b.disabled = false; b.textContent = "直して覚える";
    }
  };

  if ($("#doAnswer")) $("#doAnswer").onclick = async function (e) {
    var b = e.currentTarget;
    var qs = [];
    try { qs = JSON.parse(t.prep_questions || "[]"); } catch (err) { qs = []; }
    var qa = [];
    document.querySelectorAll("[data-q]").forEach(function (el) {
      var q = qs[+el.dataset.q];
      if (q && el.value.trim()) qa.push({ ask: q.ask, answer: el.value.trim() });
    });
    if (!qa.length) { toast("答えを入れてください"); return; }
    b.disabled = true; b.textContent = "考えています…";
    try {
      var r = await api("/answer", { method: "POST", body: JSON.stringify({ id: t.id, qa: qa }) });
      if (!r || r.error) { toast((r && r.error) || "うまくいきませんでした"); return; }
      toast("覚えました。次からはこの前提で書きます");
      state.panel = "reply";
      await loadList(); openThread(t.id);
    } finally {
      b.disabled = false; b.textContent = "答えて下書きを作る";
    }
  };
}

function renderReply(t, d, isGroup, body) {
  body.innerHTML =
    // 読みと問いは［AIの読み］にある。ここは書いて送るための場所に絞る。
    (t.prep_plan && !stale(t)
      ? '<p class="hint oneline" style="margin:0 0 5px"><button class="lnk" id="toAi">AIの読み</button> '
        + esc(String(t.prep_plan)) + "</p>"
      : "")
    + '<div id="prepSet"></div>'
    + '<textarea id="reply" placeholder="返信を書く（Shift/Ctrl + Enter で送信。送るまで相手には届きません）"></textarea>'
    + '<div class="row main">'
    + '<button class="act ico" id="btnEmoji" title="絵文字" aria-label="絵文字"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01"/></svg></button>'
    + '<button class="act ico" id="btnAi" title="AIに下書き" aria-label="AIに下書き"><svg viewBox="0 0 24 24"><path d="M4 20.5 15.2 9.3l-2.5-2.5L1.5 18v2.5z" transform="translate(2.5 1) scale(.92)"/><path d="M14.5 4.5 17 2l5 5-2.5 2.5z"/></svg></button>'
    + '<button class="act ico" id="btnFile" title="添付" aria-label="添付"><svg viewBox="0 0 24 24"><path d="M20.5 11.5 12 20a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L9.6 17.3a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg></button>'
    + '<button class="act ico" id="btnCmd" title="AIに指示" aria-label="AIに指示"><svg viewBox="0 0 24 24"><path d="M12 2.5 13.9 8l5.6 1.9-5.6 1.9L12 17.4 10.1 11.8 4.5 9.9 10.1 8z"/><path d="M18.5 15.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/></svg></button>'
    + (isGroup ? '<button class="act ico" id="btnMention" title="メンション" aria-label="メンション"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 5.5 1.7A9.5 9.5 0 1 0 17.5 20"/></svg></button>' : "")
    + '<div class="sp"></div>'
    // 読んだあとにすることは「返す」か「片付ける」の2つ。並べて置く。
    // 見出しに置いていたが、名前と札で幅が足りず押しにくかった。
    // アイコンだと何のボタンか伝わらなかったので、文字に戻している。
    // 片付けるボタンは1つ。
    // 「対応済み」と「アーカイブ」を別にしていたが、
    // ［すべて］が全件を出すようになった時点で違いがなくなった。
    // どちらも要対応から消え、相手から届けば戻ってくる。
    + '<button class="act" id="doArchive" title="'
    + (t.status === "open"
        ? (t.channel === "gmail"
            ? "一覧から消します。メールは戻ってきません"
            : "一覧から消します。相手から届けば戻ってきます")
        : "未対応に戻します")
    + '">' + (t.status === "open" ? "対応済みにする" : "未対応に戻す") + "</button>"
    + '<button class="act go" id="doSend">送信</button>'
    + "</div>"
    + '<div class="drawer" id="dwEmoji"><div class="emoji" id="emoji"></div></div>'
    + '<div class="drawer" id="dwAi"><div class="row">'
    + '<input type="text" id="instruction" placeholder="AIへの指示（相手には送られません）例: 料金には触れずに、来週の候補を3つ">'
    + '<button class="act" id="doDraft">下書きを作る</button>'
    + '<button class="act" id="doOptions">3案を出す</button></div>'
    + '<div class="opts" id="opts"></div>'
    + '<div id="keepRule"></div></div>'
    + '<div class="drawer" id="dwCmd"><div class="row">'
    + '<input type="text" id="command" placeholder="例: 賃金台帳を読んで要点をまとめて / 先週の見積書を送る準備をして / 日程候補を3つ入れて">'
    + '<button class="act" id="doCmd">実行</button></div>'
    + '<div class="report" id="report"></div>'
    + '<p class="hint">AIは送信できません。下書きや添付を用意するところまでです。</p></div>'
    + '<div class="drawer" id="dwFile"><input type="file" id="pickFile" style="display:none">'
    + '<div class="row"><button class="act" id="pick">ファイルを選ぶ</button>'
    + '<span class="lbl" id="attachState">本文欄にスクショを貼り付け（Ctrl+V）するか、ここにドロップもできます</span></div></div>'
    + (isGroup ? '<div class="drawer" id="dwMention"><div class="chips" id="mentions"></div>'
        + '<p class="hint">このグループで発言したことのある人から選べます。</p></div>' : "")
    + '<div class="tones" id="tones"></div>'
    + '<div id="prevNote" class="hint"></div>';

  // アーカイブ。一覧から消すだけで、記録は残る。
  // 新しく届けば recordIncoming が status を open に戻すので、自然に出てくる。
  $("#doArchive").onclick = async function (e) {
    var b = e.currentTarget;
    b.disabled = true;
    var next = t.status === "open" ? "done" : "open";
    var r = await api("/status", { method: "POST", body: JSON.stringify({ id: t.id, status: next }) });
    if (!r || r.error) { b.disabled = false; toast((r && r.error) || "変えられませんでした"); return; }
    toast(next === "done" ? "対応済みにしました。念のため［アーカイブ］で確認できます" : "未対応に戻しました");
    await loadList();
    if (next === "done") closeThread();
    else openThread(t.id);
  };

  if ($("#toAi")) $("#toAi").onclick = function () {
    state.panel = "ai"; openThread(t.id);
  };



  var picked = new Set();

  // グループでは、最後に話しかけてきた人を最初からメンションしておく。
  // 下書きは本文に名前を書かない決まりにしたので、ここで指さないと宛先が消える。
  if (isGroup) {
    for (var mi = d.messages.length - 1; mi >= 0; mi--) {
      var mm = d.messages[mi];
      if (mm.direction === "in" && mm.speaker_id) { picked.add(mm.speaker_id); break; }
    }
  }
  var attached = null;

  function drawer(name) {
    state.drawer = state.drawer === name ? "" : name;
    ["emoji", "ai", "file", "mention", "cmd"].forEach(function (n) {
      var cap = n.charAt(0).toUpperCase() + n.slice(1);
      var el = $("#dw" + cap), btn = $("#btn" + cap);
      if (!el) return;
      var on = state.drawer === n;
      el.classList.toggle("open", on);
      if (btn && n !== "mention" && n !== "file") btn.classList.toggle("on", on);
    });
  }
  $("#btnEmoji").onclick = function () { drawer("emoji"); };
  $("#btnAi").onclick = function () { drawer("ai"); };
  $("#btnFile").onclick = function () { drawer("file"); };
  $("#btnCmd").onclick = function () { drawer("cmd"); };
  if (isGroup) $("#btnMention").onclick = function () { drawer("mention"); };

  // AIに指示を出す。返ってくるのは「やったことの報告」と、用意された下書き・添付。
  async function runCommand() {
    var instruction = $("#command").value.trim(); if (!instruction) return;
    var btn = $("#doCmd");
    btn.disabled = true; btn.textContent = "作業中…";
    $("#report").classList.remove("show");
    var r = await api("/command", { method: "POST", body: JSON.stringify({ id: t.id, instruction: instruction }) });
    btn.disabled = false; btn.textContent = "実行";
    if (!r) return;
    if (r.error) { toast(r.error); return; }

    $("#report").textContent = r.report || "完了しました。";
    $("#report").classList.add("show");

    if (r.draft) { $("#reply").value = r.draft; renderTones(); }
    if (r.attach) {
      attached = { fileId: r.attach.fileId, name: r.attach.name, isImage: r.attach.isImage };
      $("#attachState").innerHTML = "<b>" + esc(r.attach.name) + "</b> を添付（送信で送られます）";
      $("#btnFile").classList.add("on");
    }
    if (r.changed) { loadList(); }
  }
  $("#doCmd").onclick = runCommand;
  $("#command").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { ev.preventDefault(); runCommand(); }
  });

  $("#emoji").innerHTML = EMOJI.map(function (e) {
    return '<button type="button" data-e="' + e + '">' + e + "</button>";
  }).join("");
  $("#emoji").onclick = function (ev) {
    var b = ev.target.closest("[data-e]"); if (!b) return;
    var el = $("#reply"), at = el.selectionStart, to = el.selectionEnd;
    el.value = el.value.slice(0, at) + b.dataset.e + el.value.slice(to);
    el.selectionStart = el.selectionEnd = at + b.dataset.e.length;
    el.focus();
  };

  if (isGroup) {
    var people = (t.channel === "chatwork" ? [] : [{ id: "__all__", name: "全員" }])
      .concat(d.speakers || []);
    $("#mentions").innerHTML = people.map(function (p) {
      return '<button type="button" data-m="' + esc(p.id) + '"'
        + (picked.has(p.id) ? ' class="on"' : "") + ">" + esc(p.name) + "</button>";
    }).join("");
    // 最初から誰かを指しているので、たたんだままでも分かるようにしておく。
    $("#btnMention").classList.toggle("on", picked.size > 0);
    $("#mentions").onclick = function (ev) {
      var b = ev.target.closest("[data-m]"); if (!b) return;
      var id = b.dataset.m;
      if (picked.has(id)) { picked["delete"](id); b.classList.remove("on"); }
      else { picked.add(id); b.classList.add("on"); }
      $("#btnMention").classList.toggle("on", picked.size > 0);
    };
  }

  $("#pick").onclick = function () { $("#pickFile").click(); };
  $("#pickFile").onchange = function (ev) { upload(ev.target.files[0]); };

  // 添付の入口は3つ（選ぶ・貼り付ける・落とす）あるが、処理は1つにまとめる。
  async function upload(f) {
    if (!f) return;
    if (f.size > 10 * 1024 * 1024) { toast("10MBを超えるファイルは送れません"); return; }
    drawer("file");
    $("#attachState").textContent = "アップロード中…";
    // スクショを貼り付けると名前の無いファイルで来るので、こちらで付ける。
    var name = f.name || ("screenshot-" + Date.now() + "." + ((f.type || "image/png").split("/")[1] || "png"));
    var r = await fetch("/inbox/api/upload?name=" + encodeURIComponent(name), {
      method: "POST", headers: { "Content-Type": f.type || "application/octet-stream" }, body: f
    }).then(function (x) { return x.json(); }).catch(function () { return null; });
    if (!r || r.error) { $("#attachState").textContent = "失敗しました"; return; }
    var isImage = (f.type || "").indexOf("image/") === 0;
    attached = { fileId: r.fileId, name: r.name, isImage: isImage };
    // 何を送ろうとしているのか、送る前に見えるようにする。
    $("#attachState").innerHTML =
      (isImage ? '<img class="thumb" src="img/' + r.fileId + '">' : "")
      + "<b>" + esc(r.name) + "</b> を添付（送信で送られます）"
      + ' <button class="mini" id="unattach">取り消す</button>';
    $("#btnFile").classList.add("on");
    $("#unattach").onclick = function () {
      attached = null;
      $("#attachState").textContent = "取り消しました";
      $("#btnFile").classList.remove("on");
    };
  }

  // 本文欄にそのまま貼り付ける。スクショを送るときの一番短い道。
  $("#reply").addEventListener("paste", function (ev) {
    var items = (ev.clipboardData && ev.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file") {
        var f = items[i].getAsFile();
        if (f) { ev.preventDefault(); upload(f); return; }
      }
    }
  });

  // 返信欄に落としても同じ。
  var drop = $("#reply");
  drop.addEventListener("dragover", function (ev) { ev.preventDefault(); drop.classList.add("pasting"); });
  drop.addEventListener("dragleave", function () { drop.classList.remove("pasting"); });
  drop.addEventListener("drop", function (ev) {
    ev.preventDefault(); drop.classList.remove("pasting");
    if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]) upload(ev.dataTransfer.files[0]);
  });

  // 指示を出したら、その場で「次回以降も使うか」を聞く。
  // 別の設定画面に行かせると、忙しいときは絶対に書かれない。実際に空のままだった。
  // 保存先はAIに決めさせず、人が選ぶ。指示文から適用範囲は読み取れないため。
  function offerRule(text) {
    var q = (text || "").trim();
    if (!q) { $("#keepRule").innerHTML = ""; return; }
    $("#keepRule").innerHTML = '<div class="keep"><b>次回以降も使いますか？</b>'
      + '<div class="q">' + esc(q) + "</div>"
      + '<div class="chips">'
      + '<button data-s="common">ぜんぶの返信で</button>'
      + '<button data-s="account">' + esc(accountLabel(t.account_id)) + ' だけ</button>'
      + '<button data-s="thread">この相手だけ</button>'
      + '<button data-s="no">今回だけ</button>'
      + "</div></div>";
    $("#keepRule").onclick = async function (ev) {
      var b = ev.target.closest("[data-s]"); if (!b) return;
      if (b.dataset.s === "no") { $("#keepRule").innerHTML = ""; return; }
      var r = await api("/rule", { method: "POST", body: JSON.stringify({
        text: q, scope: b.dataset.s, id: t.id }) });
      if (!r || r.error) { toast((r && r.error) || "保存できませんでした"); return; }
      $("#keepRule").innerHTML = "";
      toast(r.where + " に入れました");
    };
  }

  // 返し方の異なる案を3つ出す。選ぶと本文欄に入る。
  $("#doOptions").onclick = async function (e) {
    e.target.disabled = true; e.target.textContent = "考えています…";
    var r = await api("/draft-options", { method: "POST", body: JSON.stringify({
      id: t.id, instruction: $("#instruction").value }) });
    e.target.disabled = false; e.target.textContent = "3案を出す";
    if (!r || !r.options || !r.options.length) { toast("案を出せませんでした"); return; }
    offerRule($("#instruction").value);
    $("#opts").innerHTML = r.options.map(function (o, i) {
      return '<div class="opt" data-i="' + i + '">'
        + '<div class="label">' + esc(o.label) + "</div>"
        + '<div class="text">' + esc(o.text) + "</div></div>";
    }).join("");
    $("#opts").onclick = function (ev) {
      var c = ev.target.closest("[data-i]"); if (!c) return;
      $("#reply").value = r.options[+c.dataset.i].text;
      $("#opts").innerHTML = "";
      drawer("ai");
      $("#reply").focus();
      renderTones();
    };
  };

  // 本文のニュアンスを変える。中身の事実は変えない。
  function renderTones() {
    var has = $("#reply").value.trim().length > 0;
    // 6つ並べていたのを1つの選択にまとめた（2026-09-23）。選んだらすぐ直す。
    if (!has) { $("#tones").innerHTML = ""; return; }
    if ($("#toneSel")) return;
    $("#tones").innerHTML = '<select class="mini" id="toneSel" title="本文の言い回しを直す（事実は変えません）">'
      + '<option value="">文章を直す ▾</option>'
      + state.tones.map(function (t2) { return '<option value="' + esc(t2) + '">' + esc(t2) + "</option>"; }).join("")
      + "</select>";
  }
  $("#tones").onchange = async function (ev) {
    var sel = ev.target.closest("#toneSel"); if (!sel || !sel.value) return;
    var tone = sel.value;
    var text = $("#reply").value.trim(); if (!text) { sel.value = ""; return; }
    var before = $("#reply").value;
    sel.disabled = true; sel.options[0].textContent = "「" + tone + "」に直しています…"; sel.value = "";
    var r = await api("/rewrite", { method: "POST", body: JSON.stringify({
      id: t.id, text: text, tone: tone }) });
    sel.disabled = false; sel.options[0].textContent = "文章を直す ▾";
    if (!r) return;
    if (r.error) { toast(r.error); return; }
    $("#reply").value = r.text;
    $("#reply").focus();
    toast("「" + tone + "」に直しました", "元に戻す", function () { $("#reply").value = before; $("#reply").focus(); });
  };
  // 書きかけを端末に残す。移動中に閉じても消えないように（2026-09-23）。
  var DKEY = "draft:" + t.id;
  try {
    var saved = localStorage.getItem(DKEY);
    if (saved && !$("#reply").value.trim()) { $("#reply").value = saved; renderTones(); }
  } catch (e) {}
  var dTimer = null;
  $("#reply").addEventListener("input", function () {
    clearTimeout(dTimer);
    dTimer = setTimeout(function () {
      try { localStorage.setItem(DKEY, $("#reply").value); } catch (e) {}
    }, 600);
  });
  $("#reply").addEventListener("input", renderTones);
  renderTones();

  $("#doDraft").onclick = async function (e) {
    // 確認の画面は出さない。置き換えてから［元に戻す］を出す。
    // 画面いっぱいの確認が毎回挟まるのが邪魔だった（2026-09-22）。
    var cur = $("#reply").value;
    e.target.disabled = true; e.target.textContent = "考えています…";
    var r = await api("/draft", { method: "POST", body: JSON.stringify({ id: t.id, instruction: $("#instruction").value }) });
    e.target.disabled = false; e.target.textContent = "下書きを作る";
    if (r && r.text) {
      $("#reply").value = r.text; drawer("ai"); $("#reply").focus(); renderTones();
      offerRule($("#instruction").value);
      if (cur.trim()) {
        // トーストは移動中に見逃す。24時間は［書きかけに戻す］から戻せるようにする。
        try { localStorage.setItem("prev:" + t.id, JSON.stringify({ text: cur, at: Date.now() })); } catch (e) {}
        renderPrevNote(t);
        toast("書きかけをAIの下書きに置き換えました", "元に戻す", function () {
          $("#reply").value = cur; renderTones(); $("#reply").focus();
        });
      }
    }
  };

  // 失敗しても必ずボタンを戻す。戻し忘れると、画面を開き直すまで押せなくなる。
  // 返事が読めなかったときに「送信しました」と出すのも禁物。送れていないのに
  // 送れたと思わせるほうが、押せないことより害が大きい。
  renderPrevNote(t);

  // 送っている途中・確認の窓が開いている間は、もう一度押しても何もしない（二重送信を防ぐ、2026-09-23）。
  var sendBusy = false;
  $("#doSend").onclick = async function (e) {
    if (sendBusy) return;
    sendBusy = true;
    try { await doSendImpl(e); } finally { sendBusy = false; }
  };
  async function doSendImpl(e) {
    var text = $("#reply").value.trim();
    if (!text && !attached) return;
    // ［ ］は「まだ埋めていない」印。そのまま送らせない。
    // 止めて戻らせるのは手間なので、その場で中身を聞いて埋める（2026-09-23）。
    if (/［[^］]*］/.test(text)) {
      var filled = await fillHoles(text);
      if (filled === null) return;
      text = filled.trim();
      $("#reply").value = text; renderTones();
    }

    // 宛先を見てから送る。別名を付けていても、ここでは元の会話名を出す。
    var names = [];
    picked.forEach(function (id) {
      if (id === "__all__") { names.push("全員"); return; }
      var sp = (d.speakers || []).filter(function (x) { return x.id === id; })[0];
      names.push(sp ? sp.name : id);
    });
    var toWho = (t.display_name || t.id)
      + (t.label ? String.fromCharCode(10) + "受信箱の別名：" + t.label : "")
      + (names.length ? String.fromCharCode(10) + "メンション：" + names.join("、") : "")
      + (attached ? String.fromCharCode(10) + "添付：" + attached.name : "");
    if (!(await ask("この宛先に送ります。" + String.fromCharCode(10, 10) + toWho
        + String.fromCharCode(10, 10) + "送ったものは取り消せません。", "送信する"))) return;

    var btn = e.target;
    btn.disabled = true;
    btn.textContent = "送信中…";
    try {
      if (attached) {
        // ファイルはログインなしで開けるリンクとして届く。社外に出してよいかを一度聞く。
        var okPublic = attached.isImage || (await ask(
          "「" + attached.name + "」は、ログインなしで開けるリンクとして届きます。"
          + String.fromCharCode(10) + "転送されると、その先の人も開けます。"
          + String.fromCharCode(10, 10) + "社外秘の書類は、Driveの限定共有で渡してください。",
          "公開リンクで送る"));
        if (!okPublic) { toast("ファイルは送っていません。"); return; }
        var res = await api(attached.isImage ? "/send-image" : "/send-file", {
          method: "POST", body: JSON.stringify({ id: t.id, fileId: attached.fileId, name: attached.name, public: okPublic }) });
        if (!res || res.error) { toast((res && res.error) || "送れませんでした。もう一度お試しください。"); return; }
      }
      var sent = null;
      if (text) {
        var r = await api("/send", { method: "POST", body: JSON.stringify({
          id: t.id, text: text,
          mentionAll: picked.has("__all__"),
          mentionUserIds: Array.from(picked).filter(function (x) { return x !== "__all__"; })
        }) });
        if (!r || r.error) { toast((r && r.error) || "送れませんでした。本文はそのまま残しています。"); return; }
        sent = r;
        // 送れたら書きかけの控えを消す。残っていると、開き直したときに送った文が返信欄に戻っていた（2026-09-23）。
        clearTimeout(dTimer);
        try { localStorage.removeItem(DKEY); } catch (e2) {}
        $("#reply").value = "";
      }
      // 送っている間に相手から届いていたときは、未対応のままにしてある。
      // 黙って対応済みにすると、その1通が誰にも気づかれずに消える。
      if (sent && sent.arrived) {
        toast("送信しました。送っている間に新しく届いたので、未対応のままにしています。");
      } else {
        toast("送信しました。対応済みにしました。", "未対応に戻す", async function () {
          await api("/status", { method: "POST", body: JSON.stringify({ id: t.id, status: "open" }) });
          await loadList(); openThread(t.id);
        });
      }
      await loadList(); openThread(t.id);
      // 「次に動く人」の判断と日程の読み取りは、送信のあと裏で進む。少し待って読み直す。
      setTimeout(async function () {
        await loadList();
        if (state.current === t.id) renderCalNote(t);
      }, 9000);
    } finally {
      btn.disabled = false;
      btn.textContent = "送信";
    }
  };

  // 外（Claude Code など）から届いた送信セット。本文と複数のファイルを、確認1回で順に送る。
  // 届いただけでは何も送られない。ここで全部を見せて、押したときだけ既存の送信口を通す。
  // 返信欄には流し込まない。書きかけの本文を消さないため。
  (async function loadPrepSet() {
    var box = $("#prepSet");
    if (!box) return;
    var got = await api("/prep-set?id=" + encodeURIComponent(t.id));
    var set = got && got.set;
    // いま画面に出している送信セットを覚えておく。あとで届いた分に気づくため。
    state.prepSetId = set ? set.setId : null;
    if (!set) { box.innerHTML = ""; return; }

    var NL = String.fromCharCode(10);
    var hasText = set.textState !== "none";
    var left = (hasText && set.textState !== "sent" ? 1 : 0)
      + set.items.filter(function (x) { return x.state !== "sent"; }).length;
    var order = (hasText ? ["本文"] : []).concat(set.items.map(function (x, i) {
      return (x.isImage ? "画像" : "ファイル") + (i + 1);
    })).join(" → ");
    var LABEL = { pending: "未送信", sent: "送信済み", failed: "失敗。未送信です" };
    var n = 0;
    var html = '<div class="pset"><div class="head">' + esc(set.source) + "から届いた送信セット</div>"
      + '<div class="sub">宛先：' + esc(t.display_name || t.id) + "　／　計" + ((hasText ? 1 : 0) + set.items.length)
      + "通：" + esc(order) + (set.note ? "　／　" + esc(set.note) : "") + "</div>";
    if (hasText) {
      n++;
      html += '<div class="it ' + set.textState + '"><span class="no">' + n + "</span>"
        + '<div style="flex:1"><textarea id="psetText"' + (set.textState === "sent" ? " disabled" : "") + "></textarea></div>"
        + '<span class="st">' + LABEL[set.textState] + "</span></div>";
    }
    // メンション（本文にだけ付く）。発言したことのある人だけ並ぶ。押して付け外しする（2026-09-23）。
    var pm = new Set(set.mentionUserIds || []);
    if (set.mentionAll) pm.add("__all__");
    var sps = d.speakers || [];
    var canMention = hasText && set.textState !== "sent" && sps.length > 0;
    if (canMention) {
      html += '<div class="sub" id="psetMen" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0">'
        + '<span>メンション（本文に付けます）：</span>'
        + sps.map(function (sp) {
            return '<button type="button" class="chip' + (pm.has(sp.id) ? " on" : "") + '" data-pm="' + esc(sp.id) + '">@' + esc(sp.name) + "</button>";
          }).join("")
        + '<button type="button" class="chip' + (pm.has("__all__") ? " on" : "") + '" data-pm="__all__">@全員</button>'
        + "</div>";
    }
    function pmNames() {
      var out = [];
      pm.forEach(function (id) {
        if (id === "__all__") { out.push("全員"); return; }
        var sp = sps.filter(function (x) { return x.id === id; })[0];
        out.push(sp ? sp.name : id);
      });
      return out;
    }
    // ファイルは横に並べる。縦に積むと3つ目あたりで画面の外に出て、送信ボタンごと見えなくなる。
    if (set.items.length) html += '<div class="files">';
    set.items.forEach(function (x) {
      n++;
      html += '<div class="fi ' + x.state + '"><div class="cap"><span class="no">' + n + "</span>"
        + '<span class="st">' + LABEL[x.state] + "</span></div>"
        + (x.isImage
            ? '<a href="img/' + x.fileId + '" target="_blank" rel="noopener"><img class="big" src="img/' + x.fileId + '"></a>'
            : '<a class="doc" href="img/' + x.fileId + '" target="_blank" rel="noopener">開いて確かめる</a><div class="sub" style="margin:2px 0 0">リンクで送られます</div>')
        + '<div class="sub" style="margin:4px 0 0">' + esc(x.name) + "　" + Math.round(x.size / 1024) + "KB</div></div>";
    });
    if (set.items.length) html += "</div>";
    if (set.closes && set.closes.length) {
      html += '<div class="sub" style="margin:6px 0">送り終えたら完了にするやること：'
        + set.closes.map(function (c) { return "「" + esc(c.title) + "」"; }).join("、") + "</div>";
    }
    html += '<div class="foot"><button class="act go" id="psetSend">'
      + (left ? "宛先と" + left + "通の中身を確認して送信" : "すべて送信済み") + "</button>"
      + '<button class="act" id="psetDrop">' + (left ? "このセットを破棄" : "片付ける") + "</button>"
      + '<span class="hint" style="margin:0">画像は押すと大きく見られます。</span></div></div>';
    box.innerHTML = html;
    if (hasText) $("#psetText").value = set.text;
    if ($("#psetMen")) $("#psetMen").onclick = function (ev) {
      var c = ev.target.closest("[data-pm]"); if (!c) return;
      var k = c.dataset.pm;
      if (pm.has(k)) pm.delete(k); else pm.add(k);
      c.classList.toggle("on", pm.has(k));
    };
    if (!left) $("#psetSend").disabled = true;

    $("#psetDrop").onclick = async function () {
      if (left && !(await ask("この送信セットを破棄します。相手には何も送られません。", "破棄する"))) return;
      await api("/prep-set?id=" + encodeURIComponent(t.id), { method: "DELETE" });
      box.innerHTML = "";
    };

    $("#psetSend").onclick = async function (e) {
      // 押した瞬間に押せなくする。確認の窓が開いている間に2回目を押すと、2回送られていた（2026-09-23）。
      var btn = e.currentTarget;
      if (btn.disabled) return;
      btn.disabled = true;
      var ok = await psetSend(btn);
      if (!ok) btn.disabled = false;
    };
    async function psetSend(btn) {
      var text = hasText && set.textState !== "sent" ? $("#psetText").value.trim() : "";
      if (hasText && set.textState !== "sent" && !text) { toast("本文が空です。消すなら、このセットを破棄してください。"); return false; }
      if (/［[^］]*］/.test(text)) {
        var filled2 = await fillHoles(text);
        if (filled2 === null) return false;
        text = filled2.trim();
        $("#psetText").value = text;
      }
      var docs = set.items.filter(function (x) { return !x.isImage && x.state !== "sent"; });
      var menNames = text ? pmNames() : [];
      var yes = await ask("「" + (t.display_name || t.id) + "」へ、" + left + "通を続けて送ります。" + NL
        + "順番：" + order + NL
        + (menNames.length ? "メンション：" + menNames.join("、") + "（本文に付けます）" + NL : "メンション：なし" + NL)
        + NL
        + (docs.length
            ? "ファイル（" + docs.map(function (x) { return x.name; }).join("、")
              + "）は、ログインなしで開けるリンクとして届きます。転送されると、その先の人も開けます。" + NL
              + "社外秘はDriveの限定共有で渡してください。" + NL + NL
            : "")
        + "送ったものは取り消せません。", left + "通を送信する");
      if (!yes) return false;
      var okPublicSet = docs.length > 0;

      var mark = function (index, st, body) {
        return api("/prep-set/mark", { method: "POST", body: JSON.stringify({ id: t.id, setId: set.setId, index: index, state: st, text: body }) });
      };
      var failed = "";
      try {
        if (text) {
          btn.textContent = "本文を送信中…";
          var r = await api("/send", { method: "POST", body: JSON.stringify({ id: t.id, text: text,
            mentionAll: pm.has("__all__"),
            mentionUserIds: Array.from(pm).filter(function (x) { return x !== "__all__"; }) }) });
          if (!r || r.error) {
            var lost = r && /通信できません/.test(r.error);
            failed = lost
              ? "通信が切れて、本文が送れたか分かりません。LINEを見て、届いていなければもう一度押してください。"
              : (r && r.error) || "本文を送れませんでした。";
            await mark(-1, lost ? "unknown" : "failed", text);
          } else await mark(-1, "sent", text);
        }
        // 1つ失敗したら止める。順番が崩れたまま残りが届くほうが、相手は混乱する。
        for (var i = 0; i < set.items.length && !failed; i++) {
          var x = set.items[i];
          if (x.state === "sent") continue;
          // 結果不明のものは、勝手に送り直さない。二重に届くほうが困る。
          if (x.state === "unknown") { failed = x.name + " は送れたか分かりません。LINEを見て確かめてください。"; break; }
          btn.textContent = (i + 1) + "つ目を送信中…";
          var res = await api(x.isImage ? "/send-image" : "/send-file", {
            method: "POST", body: JSON.stringify({ id: t.id, fileId: x.fileId, name: x.name, public: okPublicSet }) });
          if (!res || res.error) {
            var lost2 = res && /通信できません/.test(res.error);
            failed = lost2
              ? x.name + " は通信が切れて、送れたか分かりません。LINEを見て確かめてください。"
              : (res && res.error) || (x.name + " を送れませんでした。");
            await mark(i, lost2 ? "unknown" : "failed");
          }
          else await mark(i, "sent");
        }
        if (failed) {
          toast(failed + " ここで止めました。送れた分は送信済みになっています。");
        } else {
          await api("/prep-set?id=" + encodeURIComponent(t.id), { method: "DELETE" });
          // 本文が無いセットだと /send を通らないので、ここで対応済みに落とす。
          if (!text) await api("/status", { method: "POST", body: JSON.stringify({ id: t.id, status: "done" }) });
          toast(left + "通を送信しました。対応済みにしました。");
        }
        await loadList(); openThread(t.id);
      } finally {
        btn.disabled = false;
      }
    };
  })();

  // 先回りで用意した下書きを、開いた時点で入れておく。
  // 読んだあとに新しい発言が来ていたら入れない。最新を知らない下書きになっている。
  if (t.prep_draft && !stale(t) && !$("#reply").value) $("#reply").value = t.prep_draft;

  var ta = $("#reply");
  ta.addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter") return;
    if (ev.shiftKey || ev.ctrlKey || ev.metaKey) { ev.preventDefault(); $("#doSend").click(); }
  });
  ta.focus();
}

// Jevが入口で何と判断したかを見せる。裏で効いているだけだと、
// 受信箱が静かになった理由が分からない。
var JEV_KIND = { question: "問い合わせ", schedule: "日程", document: "資料",
                 request: "依頼", report: "報告", smalltalk: "雑談" };
var JEV_WEIGHT = { light: "すぐ返せる", normal: "少し確認", heavy: "判断が要る" };

function jevTag(t) {
  if (!t.route_kind) return "";
  var w = JEV_WEIGHT[t.route_weight] || "";
  return '<span class="jev' + (t.route_weight === "heavy" ? " heavy" : "") + '">'
    + "Jev <b>" + esc(JEV_KIND[t.route_kind] || t.route_kind) + "</b>"
    + (w ? " / " + esc(w) : "") + "</span>";
}

// 提案されたやることは、押したときだけ登録する。勝手には足さない。
function wirePrepTasks(body, id) {
  var pb = body.querySelector(".prep");
  if (!pb) return;
  pb.onclick = async function (ev) {
    var b = ev.target.closest("[data-addtask]"); if (!b) return;
    b.disabled = true;
    var r = await api("/task", { method: "POST", body: JSON.stringify({ id: id, title: b.dataset.addtask }) });
    if (!r || r.error) { b.disabled = false; toast((r && r.error) || "追加できませんでした"); return; }
    b.textContent = "追加しました";
    await loadList();
    openThread(id);
  };
}

// 相手（2026-09-23）。グループとは別に「誰の件か」を持つ。題の末尾の（名前）と二重に見せない。
function taskTitle(k) {
  var t = String(k.title || "");
  var w = k.who ? "（" + k.who + "）" : "";
  if (w && t.length > w.length && t.slice(-w.length) === w) t = t.slice(0, -w.length);
  return t;
}
function whoTag(k) {
  return k.who ? ' <span class="tag who">' + esc(k.who) + "</span>" : "";
}
// 相手の候補（これまでの発言者と事務所の人）。入力欄の候補に出す。
function peopleList() {
  if (state.peopleLoaded) return;
  state.peopleLoaded = true;
  api("/people").then(function (r) {
    var dl = document.getElementById("peopleList");
    if (!dl) { dl = document.createElement("datalist"); dl.id = "peopleList"; document.body.appendChild(dl); }
    dl.innerHTML = ((r && r.people) || []).map(function (n) { return '<option value="' + esc(n) + '">'; }).join("");
  });
}
function threadTitle(th) {
  return th ? (th.label || shortName(th.display_name)) : "";
}
// 行の✎。相手とグループを直す。グループは名前の一部で探す。
async function editTask(k) {
  var th = state.threads.filter(function (t) { return t.id === k.thread_id; })[0];
  var cur = threadTitle(th);
  var v = await askFill("相手とグループを直します。" + String.fromCharCode(10)
    + "グループは名前の一部で入れてください。空にすると紐づけを外し、「自動」と入れると当て直します。",
    [{ label: "相手", value: k.who || "" }, { label: "グループ", value: cur }], "直す");
  if (!v) return false;
  var body = { taskId: k.id, who: v[0].trim() };
  var g = v[1].trim();
  if (g !== cur) body.thread = g === "自動" ? "auto" : g;
  var r = await api("/task", { method: "PATCH", body: JSON.stringify(body) });
  if (!r || r.error) { toast((r && r.error) || "直せませんでした"); return false; }
  if (body.thread !== undefined) toast(r.threadName ? "「" + r.threadName + "」に紐づけました" : "紐づけを外しました");
  return true;
}

function taskRow(k) {
  var wait = k.side === "theirs";
  var overdue = wait && k.due_at && k.due_at <= Date.now();
  var note = wait
    ? (overdue ? "催促どき（" + since(k.created_at) + "から）"
               : since(k.due_at) + "まで待つ")
    : (k.due_at ? since(k.due_at) + "まで" : "");
  return '<div class="task ' + (k.done ? "done" : "") + '">'
    + '<input type="checkbox" data-done="' + k.id + '" ' + (k.done ? "checked" : "") + ">"
    + "<span>" + esc(taskTitle(k)) + whoTag(k)
    + (note ? '<span class="tag' + (overdue ? " task" : "") + '" style="margin-left:7px">'
              + esc(note) + "</span>" : "")
    + "</span>"
    + '<button class="x" data-edit="' + k.id + '" title="相手とグループを直す">✎</button>'
    + '<button class="x" data-del="' + k.id + '">×</button></div>';
}

function wireTasks(id) {
  peopleList();
  // 自分の分とお願いしている分で、同じ操作を使い回す。
  async function rows(e) {
    var ed = e.target.closest("[data-edit]");
    if (ed) {
      var kk = state.tasks.filter(function (x) { return x.id === +ed.dataset.edit; })[0];
      if (kk && await editTask(kk)) { await loadList(); openThread(id); }
      return;
    }
    var del = e.target.closest("[data-del]"), chk = e.target.closest("[data-done]");
    if (del) await api("/task", { method: "DELETE", body: JSON.stringify({ taskId: +del.dataset.del }) });
    else if (chk) await api("/task", { method: "PATCH", body: JSON.stringify({ taskId: +chk.dataset.done, done: chk.checked }) });
    else return;
    await loadList(); openThread(id);
  }
  // ［やってもらうこと］の欄には #tl が無い。無いまま触ると例外で止まり、追加ボタンが配線されなかった。
  if ($("#tl")) $("#tl").onclick = rows;
  if ($("#tlw")) $("#tlw").onclick = rows;

  $("#addTask").onclick = async function () {
    var title = $("#newTask").value.trim(); if (!title) return;
    var side = $("#taskSide") ? $("#taskSide").value : "mine";
    // 期日はその日の18時（JST）として扱う。空ならサーバー側で決める。
    var due = null;
    if ($("#taskDue") && $("#taskDue").value) {
      due = Date.parse($("#taskDue").value + "T18:00:00+09:00");
      if (isNaN(due)) due = null;
    }
    var who = $("#taskWho") ? $("#taskWho").value.trim() : "";
    await api("/task", { method: "POST", body: JSON.stringify({
      id: id, title: title, side: side, dueAt: due, who: who || null }) });
    await loadList(); openThread(id);
  };
  $("#newTask").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { ev.preventDefault(); $("#addTask").click(); }
  });
  $("#aiTasks").onclick = async function (e) {
    var b = e.currentTarget;
    b.disabled = true; b.textContent = "読んでいます…";
    var r;
    try {
      r = await api("/suggest-tasks", { method: "POST", body: JSON.stringify({ id: id }) });
    } finally {
      b.disabled = false; b.textContent = "AIに拾わせる";
    }
    if (!r || !r.tasks || !r.tasks.length) { toast("拾えるものはありませんでした"); return; }

    // 自分が動くものと、相手に頂いているものを分けて聞く。
    // 後者は「いつ頒んだか」が分からないと催促の時期が決まらないので、そこも見せる。
    var added = 0;
    for (var ti = 0; ti < r.tasks.length; ti++) {
      var q = r.tasks[ti];
      var wait = q.side === "theirs";
      var head = wait ? "やってもらうこととして追加しますか？" : "自分がやることとして追加しますか？";
      var body = head + String.fromCharCode(10, 10) + q.title
        + (q.who ? String.fromCharCode(10) + "相手：" + q.who : "")
        + (wait && q.asked ? String.fromCharCode(10) + "（" + q.asked + "に依頼）" : "");
      if (!(await ask(body, "追加する"))) continue;
      await api("/task", { method: "POST", body: JSON.stringify({
        id: id, title: q.title, side: wait ? "theirs" : "mine", who: q.who || null }) });
      added++;
    }
    if (added) { await loadList(); openThread(id); }
  };
}

// やることの全体一覧。自分がやることと、やってもらうことを分ける。
// 自分の分が空になれば自分の仕事は終わり。やってもらう分は念のため進み具合を見る場所。
function todayEnd() {
  var j = new Date(Date.now() + 9 * 3600e3); j.setUTCHours(23, 59, 59, 999);
  return j.getTime() - 9 * 3600e3;
}
function todayAt9() {
  var j = new Date(Date.now() + 9 * 3600e3); j.setUTCHours(9, 0, 0, 0);
  return j.getTime() - 9 * 3600e3;
}
// 今日やるもの：実施予定が今日まで、または締切が今日まで（過ぎたものも含む）。
function isToday(k) {
  var end = todayEnd();
  return (k.plan_at && k.plan_at <= end) || (k.due_at && k.due_at <= end);
}
var EST = [["", "—"], ["5", "5分"], ["15", "15分"], ["30", "30分"], ["60", "1時間"], ["120", "2時間"]];

function renderAllTasks() {
  var f = state.features || {};
  var waits = state.taskView === "theirs";
  var useToday = !waits && f.today !== false;
  var useNext = !waits && f.nextStep !== false;
  if (useToday && !state.todayView) state.todayView = "all";
  var all = state.tasks.filter(function (k) { return waits ? k.side === "theirs" : k.side !== "theirs"; });
  var list = useToday && state.todayView === "today" ? all.filter(isToday) : all;
  if (useToday && state.todayView === "review") { renderReview(); return; }
  // 時間で選ぶ。すき間の5分でできるもの、腰を据えて30分以上かかるもの。
  var tf = state.timeFilter || "";
  if (!useNext) tf = "";
  if (!waits && tf) list = list.filter(function (k) {
    var m = k.est_min || 0;
    return tf === "5" ? m && m <= 5 : tf === "15" ? m && m <= 15 : m >= 30;
  });
  // 相手で選ぶ。グループ・個人ごとに、その人の分だけを見たいとき（2026-09-23）。
  // 選べる相手は、いま出ている側（やること／やってもらうこと）に実際にあるものだけ。
  var whoCount = {}, whoName = {}, noneCount = 0;
  all.forEach(function (k) {
    if (!k.thread_id) { noneCount++; return; }
    var key = String(k.thread_id);
    whoCount[key] = (whoCount[key] || 0) + 1;
    if (!whoName[key]) {
      var th0 = state.threads.filter(function (t) { return t.id === k.thread_id; })[0];
      whoName[key] = th0 ? threadTitle(th0) : key;
    }
  });
  var whoKeys = Object.keys(whoCount).sort(function (a, b) { return whoCount[b] - whoCount[a]; });
  // やること側で選んだ相手が、やってもらうこと側にいないことがある。
  // 選べないものが選ばれたままだと空に見えるので、そのときは「すべて」に戻す。
  // グループで絞る。エクセルのフィルタのように、チェックで複数選ぶ（2026-09-23）。
  // 選んだものは端末に覚える。null は「すべて」。
  if (state.groupSel === undefined) {
    try { state.groupSel = JSON.parse(localStorage.getItem("taskGroups") || "null"); } catch (e) { state.groupSel = null; }
  }
  var gKeys = whoKeys.concat(noneCount ? ["none"] : []);
  var gs = state.groupSel;
  var gOn = gs ? gKeys.filter(function (key) { return gs[key]; }) : gKeys;
  // 選んでいたグループが無くなって空に見えるときは「すべて」に戻す（全部外したときは空のまま）。
  if (gs && !gOn.length && Object.keys(gs).some(function (key) { return gs[key]; })) { gs = null; state.groupSel = null; gOn = gKeys; }
  if (gs) list = list.filter(function (k) { return !!gs[k.thread_id ? String(k.thread_id) : "none"]; });
  function gName(key) { return key === "none" ? "紐づけなし" : whoName[key]; }
  function gCount(key) { return key === "none" ? noneCount : whoCount[key]; }
  var gLab = !gs ? "すべて（" + all.length + "件）" : gOn.length === 1 ? gName(gOn[0]) : gOn.length + "グループ";
  // 相手（人）で選ぶ。グループをまたいで、その人の件だけを見たいとき（2026-09-23）。
  var pCount = {}, pNone = 0;
  all.forEach(function (k) { if (k.who) pCount[k.who] = (pCount[k.who] || 0) + 1; else pNone++; });
  var pKeys = Object.keys(pCount).sort(function (a, b) { return pCount[b] - pCount[a]; });
  var pf = state.personFilter || "";
  if (pf === "none" ? !pNone : pf && !pCount[pf]) { pf = ""; state.personFilter = ""; }
  if (pf) list = list.filter(function (k) { return pf === "none" ? !k.who : k.who === pf; });
  if (waits) list.sort(function (a, b) { return (a.due_at || 9e15) - (b.due_at || 9e15); });
  var whoBar = (whoKeys.length || noneCount)
    ? '<div class="subtabs"><div class="gf"><button class="chip' + (gs ? " on" : "") + '" id="gfBtn" title="グループで絞る">'
      + "グループ：" + esc(gLab) + " ▾</button>"
      + (state.gfOpen
          ? '<div class="gfbox" id="gfBox"><input type="text" id="gfQ" placeholder="グループを探す">'
            + '<label class="gfi gfall"><input type="checkbox" data-gall' + (!gs ? " checked" : "") + "><span>（すべて選択）</span></label>"
            + '<div class="gflist">' + gKeys.map(function (key) {
                return '<label class="gfi" data-name="' + esc(gName(key)) + '"><input type="checkbox" data-g="' + esc(key) + '"'
                  + (!gs || gs[key] ? " checked" : "") + "><span>" + esc(gName(key)) + '</span><span class="n">' + gCount(key) + "</span></label>";
              }).join("") + "</div>"
            + '<div class="row" style="margin-top:6px"><button class="mini" id="gfClose">閉じる</button></div></div>'
          : "")
      + "</div>"
      + (pKeys.length
          ? ' <select class="mini" id="personF" title="相手で絞る">'
            + '<option value=""' + (pf === "" ? " selected" : "") + ">相手：すべて</option>"
            + pKeys.map(function (n) {
                return '<option value="' + esc(n) + '"' + (pf === n ? " selected" : "") + ">" + esc(n) + "（" + pCount[n] + "件）</option>";
              }).join("")
            + (pNone ? '<option value="none"' + (pf === "none" ? " selected" : "") + ">相手未設定（" + pNone + "件）</option>" : "")
            + "</select>"
          : "")
      + "</div>"
    : "";

  function row(k) {
    var th = state.threads.filter(function (t) { return t.id === k.thread_id; })[0];
    var wait = k.side === "theirs";
    var overdue = wait && k.due_at && k.due_at <= Date.now();
    var late = !wait && k.due_at && k.due_at < Date.now();
    var note = wait
      ? (overdue ? "催促どき" : (k.due_at ? since(k.due_at) + "に確認" : ""))
      : (k.due_at ? (late ? "締切超過" : since(k.due_at) + "締切") : "");
    var planned = k.plan_at && k.plan_at <= todayEnd();
    return '<div class="task">'
      + '<input type="checkbox" data-done="' + k.id + '">'
      + "<span>" + esc(taskTitle(k)) + whoTag(k)
      + (note ? ' <span class="tag' + (overdue || late ? " task" : "") + '">' + esc(note) + "</span>" : "")
      + (th ? ' <button class="lnk" data-open="' + esc(th.id) + '">' + esc(threadTitle(th)) + "</button>"
            : ' <span class="hint" style="margin:0">紐づけなし</span>')
      + (useNext
          ? '<span class="nx"><select class="mini" data-est="' + k.id + '" title="所要時間">'
            + EST.map(function (e) {
                return '<option value="' + e[0] + '"' + (String(k.est_min || "") === e[0] ? " selected" : "") + ">" + e[1] + "</option>";
              }).join("")
            + '</select><button class="chip' + (planned ? " on" : "") + '" data-plan="' + k.id + '">'
            + (planned ? "今日やる" : "今日に入れる") + "</button></span>"
          : "")
      + (wait && overdue && th ? ' <button class="chip" data-nudge="' + k.id + '">催促案を作る</button>' : "")
      + "</span>"
      + '<button class="x" data-edit="' + k.id + '" title="相手とグループを直す">✎</button>'
      + '<button class="x" data-del="' + k.id + '">×</button></div>';
  }

  // 今日の予定の重さ。使える時間を超えていたら知らせる。
  var load = "";
  if (useNext && useToday && state.todayView === "today") {
    var sum = all.filter(isToday).reduce(function (a, k) { return a + (k.est_min || 0); }, 0);
    var cap = f.dayMinutes || 240;
    var unknown = all.filter(isToday).filter(function (k) { return !k.est_min; }).length;
    load = '<p class="hint load' + (sum > cap ? " over" : "") + '">今日の予定 ' + sum + "分／使える時間 " + cap + "分"
      + (unknown ? "（時間未設定 " + unknown + "件）" : "") + (sum > cap ? "　入れすぎです" : "") + "</p>";
  }

  $("#detail").innerHTML =
    '<div class="dhead"><b>' + (waits ? "やってもらうこと" : "自分がやること") + '</b><div class="sp"></div>'
    + '<button class="mini" id="pruneAll" title="会話の中で済んだもの・日程が変わって古くなったもの・重複をAIが見つけて完了にします">AIで整理</button></div>'
    + '<div id="msgs" style="display:block">'
    + (useToday
        ? '<div class="subtabs">'
          + [["today", "今日"], ["all", "すべて"]].concat(f.weekly !== false ? [["review", "見直し"]] : []).map(function (x) {
              return '<button class="chip' + (state.todayView === x[0] ? " on" : "") + '" data-tv="' + x[0] + '">' + x[1] + "</button>";
            }).join("")
          + (useNext
              ? '<span class="sp"></span>'
                + [["", "全部"], ["5", "5分以内"], ["15", "15分以内"], ["30", "30分以上"]].map(function (x) {
                    return '<button class="chip' + (tf === x[0] ? " on" : "") + '" data-tf="' + x[0] + '">' + x[1] + "</button>";
                  }).join("")
              : "")
          + "</div>"
        : "")
    + whoBar
    + load
    + '<p class="hint" style="margin:4px 0 6px">' + (waits
        ? "念のため進み具合を見る場所。確認日が来たら要対応に出ます"
        : useToday && state.todayView === "today"
          ? (useNext ? "今日やるもの。締切が今日までのものと、［今日に入れる］を押したもの" : "締切が今日までのもの")
          : "ここが空になれば自分の仕事は終わり") + "</p>"
    + (list.length ? list.map(row).join("")
        : '<div class="empty">' + (useToday && state.todayView === "today" ? "今日やるものはありません" : "ありません") + "</div>")
    + "</div>"
    // 足すときはグループを選ばない。相手と内容から当て、外れたら行の✎で直す（2026-09-23）。
    + '<div class="panel"><div class="row">'
      + '<input type="text" id="newTask" placeholder="' + (waits ? "やってもらうことを追加" : "やることを追加") + '（グループは自動で判別）">'
      + '<input type="text" class="mini" id="newWho" list="peopleList" placeholder="相手" style="max-width:9em">'
      + '<button class="act" id="addTask">追加</button></div></div>';
  peopleList();

  $("#msgs").onclick = async function (e) {
    var tv = e.target.closest("[data-tv]");
    if (tv) { state.todayView = tv.dataset.tv; renderAllTasks(); return; }
    var tfb = e.target.closest("[data-tf]");
    if (tfb) { state.timeFilter = tfb.dataset.tf; renderAllTasks(); return; }
    var op = e.target.closest("[data-open]");
    if (op) { goThread(op.dataset.open); return; }
    var ed = e.target.closest("[data-edit]");
    if (ed) {
      var ek = state.tasks.filter(function (x) { return x.id === +ed.dataset.edit; })[0];
      if (ek && await editTask(ek)) { await loadList(); renderAllTasks(); }
      return;
    }
    var nd = e.target.closest("[data-nudge]");
    if (nd) {
      var k = state.tasks.filter(function (x) { return x.id === +nd.dataset.nudge; })[0];
      if (k) nudge(k);
      return;
    }
    var pl = e.target.closest("[data-plan]");
    if (pl) {
      var kk = state.tasks.filter(function (x) { return x.id === +pl.dataset.plan; })[0];
      var on = kk && kk.plan_at && kk.plan_at <= todayEnd();
      await api("/task", { method: "PATCH", body: JSON.stringify({ taskId: +pl.dataset.plan, planAt: on ? null : todayAt9() }) });
      await loadList(); renderAllTasks(); return;
    }
    var del = e.target.closest("[data-del]"), chk = e.target.closest("[data-done]");
    if (del) await api("/task", { method: "DELETE", body: JSON.stringify({ taskId: +del.dataset.del }) });
    else if (chk) await api("/task", { method: "PATCH", body: JSON.stringify({ taskId: +chk.dataset.done, done: chk.checked }) });
    else return;
    await loadList(); renderAllTasks();
  };
  if ($("#gfBtn")) $("#gfBtn").onclick = function (e) {
    e.stopPropagation(); state.gfOpen = !state.gfOpen; renderAllTasks();
  };
  var gfBox = $("#gfBox");
  if (gfBox) {
    gfBox.onclick = function (e) { e.stopPropagation(); };
    gfBox.onchange = function (e) {
      var t = e.target;
      if (t.hasAttribute("data-gall")) state.groupSel = t.checked ? null : {};
      else if (t.dataset.g) {
        var sel = state.groupSel ? Object.assign({}, state.groupSel)
          : gKeys.reduce(function (o, key) { o[key] = true; return o; }, {});
        sel[t.dataset.g] = t.checked;
        state.groupSel = gKeys.every(function (key) { return sel[key]; }) ? null : sel;
      } else return;
      try { localStorage.setItem("taskGroups", JSON.stringify(state.groupSel)); } catch (err) {}
      renderAllTasks();
    };
    var gq = $("#gfQ");
    var applyQ = function () {
      var q = gq.value.trim(); state.gfQ = q;
      gfBox.querySelectorAll(".gflist .gfi").forEach(function (l) {
        l.style.display = !q || l.dataset.name.indexOf(q) >= 0 ? "" : "none";
      });
    };
    gq.value = state.gfQ || ""; applyQ();
    gq.oninput = applyQ;
    $("#gfClose").onclick = function () { state.gfOpen = false; renderAllTasks(); };
  }
  if ($("#personF")) $("#personF").onchange = function () { state.personFilter = $("#personF").value; renderAllTasks(); };
  document.querySelectorAll("[data-est]").forEach(function (sel) {
    sel.onchange = async function () {
      await api("/task", { method: "PATCH", body: JSON.stringify({ taskId: +sel.dataset.est, estMin: sel.value ? +sel.value : null }) });
      await loadList(); renderAllTasks();
    };
  });
  $("#pruneAll").onclick = async function (e) {
    var b = e.currentTarget; b.disabled = true; b.textContent = "整理しています…";
    var r = await api("/prune-tasks", { method: "POST", body: JSON.stringify({}) });
    b.disabled = false; b.textContent = "AIで整理";
    if (!r || r.error) { toast((r && r.error) || "整理できませんでした"); return; }
    toast(r.closed.length ? r.closed.length + "件を片付けました（済み・古い・重複・移動）" : "片付けられるものはありませんでした");
    await loadList(); renderAllTasks();
  };
  if ($("#addTask")) $("#addTask").onclick = async function (e) {
    var title = $("#newTask").value.trim(); if (!title) return;
    var who = $("#newWho").value.trim();
    var b = e.currentTarget; b.disabled = true; b.textContent = "グループを探しています…";
    var r = await api("/task", { method: "POST", body: JSON.stringify({
      title: title, who: who || null, side: waits ? "theirs" : "mine" }) });
    b.disabled = false; b.textContent = "追加";
    if (!r || r.error) { toast((r && r.error) || "追加できませんでした"); return; }
    toast(r.threadName ? "「" + r.threadName + "」の件として追加しました（違えば✎で直せます）"
                       : "当てはまるグループが見つからないため、紐づけなしで追加しました");
    await loadList(); renderAllTasks();
  };
  if ($("#newTask")) $("#newTask").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.isComposing) { ev.preventDefault(); $("#addTask").click(); }
  });
}

// 週次の見直し。溜まりやすいものを並べ、1つずつ決め直す（GTDの「レビュー」）。
function addBizDays(n) {
  var j = new Date(Date.now() + 9 * 3600e3), left = n;
  while (left > 0) { j.setUTCDate(j.getUTCDate() + 1); var w = j.getUTCDay(); if (w !== 0 && w !== 6) left--; }
  j.setUTCHours(9, 0, 0, 0);
  return j.getTime() - 9 * 3600e3;
}

async function renderReview() {
  var f = state.features || {};
  $("#detail").innerHTML = '<div class="dhead"><b>週次の見直し</b><div class="sp"></div>'
    + '<button class="mini" id="backToTasks">やることに戻る</button></div>'
    + '<div id="msgs" style="display:block"><p class="hint">読んでいます…</p></div>';
  $("#backToTasks").onclick = function () { state.todayView = "today"; renderAllTasks(); };
  var r = await api("/weekly");
  if (!r || r.error) { $("#msgs").innerHTML = '<p class="hint">' + esc((r && r.error) || "読めませんでした") + "</p>"; return; }
  function taskRows(arr, acts) {
    return arr.map(function (k) {
      return '<div class="task"><span>' + esc(k.title)
        + (k.threadName ? ' <button class="lnk" data-open="' + esc(k.thread || "") + '">' + esc(shortName(k.threadName)) + "</button>" : "")
        + '<span class="nx">' + acts.map(function (a) {
            return '<button class="chip" data-act="' + a[0] + '" data-id="' + k.id + '" data-th="' + esc(k.thread || "") + '" data-title="' + esc(k.title) + '">' + a[1] + "</button>";
          }).join("") + "</span></span></div>";
    }).join("");
  }
  function threadRows(arr, note) {
    return arr.map(function (t) {
      return '<div class="task"><span><button class="lnk" data-open="' + esc(t.id) + '">' + esc(shortName(t.name)) + "</button>"
        + (note ? ' <span class="hint" style="margin:0">' + note + "</span>" : "") + "</span></div>";
    }).join("");
  }
  var nx = (state.features || {}).nextStep !== false;
  var TODAY = nx ? [["today", "今日に入れる"]] : [];
  var S = [
    ["締切を過ぎたやること", r.overdueMine, function (a) { return taskRows(a, [["done", "完了"]].concat(TODAY, [["drop", "やめる"]])); }],
    ["1週間以上待っているやってもらうこと", r.longWaits, function (a) { return taskRows(a, [["nudge", "催促案"], ["later", "確認を" + (f.checkDays || 3) + "営業日延ばす"], ["done", "完了"]]); }],
    ["保留しているもの", r.holds, function (a) { return taskRows(a, [["done", "もう要らない"]].concat(TODAY)); }],
    ["日付がないまま1週間以上のやること", r.staleMine, function (a) { return taskRows(a, TODAY.concat([["drop", "やめる"]])); }],
    ["3日以上止まっている要対応", r.staleOpen, function (a) { return threadRows(a, "開いて行き先を決める"); }],
    ["担当が分からない会話", r.unknownLead, function (a) { return threadRows(a, "開いて担当を決める"); }]
  ];
  var total = S.reduce(function (n, x) { return n + (x[1] || []).length; }, 0);
  $("#msgs").innerHTML = (total
      ? '<p class="hint">上から1つずつ決め直します。25〜30分が目安です。</p>'
      : '<div class="empty">見直すものはありません。よく回っています</div>')
    + S.filter(function (x) { return (x[1] || []).length; }).map(function (x) {
        return '<p class="hint" style="margin:14px 0 4px"><b>' + x[0] + "（" + x[1].length + "）</b></p>" + x[2](x[1]);
      }).join("");
  $("#msgs").onclick = async function (e) {
    var op = e.target.closest("[data-open]");
    if (op && op.dataset.open) { goThread(op.dataset.open); return; }
    var b = e.target.closest("[data-act]"); if (!b) return;
    var id = +b.dataset.id, act = b.dataset.act;
    b.disabled = true;
    if (act === "done") await api("/task", { method: "PATCH", body: JSON.stringify({ taskId: id, done: true }) });
    else if (act === "drop") await api("/task", { method: "DELETE", body: JSON.stringify({ taskId: id }) });
    else if (act === "today") await api("/task", { method: "PATCH", body: JSON.stringify({ taskId: id, planAt: todayAt9() }) });
    else if (act === "later") await api("/task", { method: "PATCH", body: JSON.stringify({ taskId: id, dueAt: addBizDays(f.checkDays || 3) }) });
    else if (act === "nudge") { nudge({ thread_id: b.dataset.th, title: b.dataset.title }); return; }
    await loadList(); renderReview();
  };
}

    + '<div class="row" style="margin-top:7px"><input type="text" id="kToken" placeholder="チャネルアクセストークン（長期）"></div>'
    + '<div class="row" style="margin-top:7px"><input type="text" id="kOwner" placeholder="通知先のユーザーID（任意）" value="'
    + esc(a.owner_user_id || "") + '"></div></div>'
    + '<p class="hint" style="margin-top:12px">繋いだら、LINE側の「応答メッセージ」と「あいさつメッセージ」は'
    + "どちらもオフにしてください。こちらからも送るので、二重に届きます。</p>"

// 今日のダイジェスト。1件ずつの画面では埋もれる「約束」と「期限」を横断して出す。
$("#digest").onclick = async function () {
  state.tab = "digest"; state.current = null;
  $("#tabInbox").classList.remove("on"); $("#tabTasks").classList.remove("on"); $("#tabWaits").classList.remove("on");
  $("#main").classList.add("viewing");

    + '<div id="msgs" style="display:block"><p class="hint">まとめています…</p></div>';

  var d = await api("/digest");
  if (!d || d.error) {
    $("#msgs").innerHTML = '<p class="hint">' + esc((d && d.error) || "まとめられませんでした") + "</p>";
    return;
  }

  var h = '<div class="dg">';
  h += '<div class="lead">' + esc(d.headline || "") + "</div>";

  if (d.promises && d.promises.length) {
    h += "<h3>こちらの約束（" + d.promises.length + "件）</h3>";
    h += d.promises.map(function (p) {
      return '<div class="row2"><span class="due' + (p.overdue ? " over" : "") + '">'
        + esc(p.due || "期日なし") + '</span><div><div class="who">' + esc(p.who) + "</div>"
        + '<div class="what">' + esc(p.what) + "</div></div></div>";
    }).join("");
  }

  if (d.waiting && d.waiting.length) {
    h += "<h3>相手待ち（" + d.waiting.length + "件）</h3>";
    h += d.waiting.map(function (w) {
      return '<div class="row2"><div><div class="who">' + esc(w.who) + "</div>"
        + '<div class="what">' + esc(w.what) + "</div></div></div>";
    }).join("");
  }

  if (d.notes && d.notes.length) {
    h += "<h3>気をつけること</h3>";
    h += d.notes.map(function (n) { return '<div class="row2"><div class="what">' + esc(n) + "</div></div>"; }).join("");
  }

  if (d.open && d.open.length) {
    h += "<h3>未対応（" + d.open.length + "件）</h3>";
    h += d.open.map(function (o) {
      return '<div class="row2" data-open="' + esc(o.id) + '" style="cursor:pointer">'
        + '<div><div class="who">' + esc(o.name)

            + (o.weight ? " / " + esc(JEV_WEIGHT[o.weight] || "") : "") + "</span>" : "")
        + "</div>" + (o.summary ? '<div class="what">' + esc(o.summary) + "</div>" : "") + "</div></div>";
    }).join("");
  }

  h += '<div class="row" style="margin-top:16px"><button class="act" id="reDigest">作り直す</button>'
    + '<span class="hint">30分は同じものを表示します。</span></div></div>';

  $("#msgs").innerHTML = h;
  $("#msgs").onclick = function (ev) {
    var b = ev.target.closest("[data-open]");
    if (b) { $("#tabInbox").click(); openThread(b.dataset.open); return; }
    if (ev.target.id === "reDigest") {
      ev.target.disabled = true; ev.target.textContent = "作り直しています…";
      api("/digest?force=1").then(function () { $("#digest").click(); });
    }
  };
};
